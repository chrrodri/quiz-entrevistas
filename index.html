ernal HTTP call: confirm delivery boundaries and business effects."}},{"text":{"es":"El publisher exitoso prueba todos los destinos","en":"Publisher success proves every destination"},"correct":false,"feedback":{"es":"Puede existir backlog o rechazo posterior.","en":"A backlog or downstream rejection can exist."}},{"text":{"es":"Todo consumidor procesa cualquier familia de evento","en":"Every consumer handles every event family"},"correct":false,"feedback":{"es":"Suscripciones y contratos controlan el procesamiento.","en":"Subscriptions and contracts control processing."}}],"explanation":{"es":"En el patrón asíncrono se desacoplan tiempos de origen y destino. Que el publisher complete no prueba el estado final del subscriber. Reúne familia/tipo, ID de entidad, mensaje, publicación, destino y errores. Respeta secuencia y dependencias del contrato. No extrapoles garantías de RIB a toda llamada HTTP externa: la frontera de entrega y el efecto comercial deben confirmarse.","en":"An asynchronous pattern decouples source and destination timing. Publisher completion does not prove final subscriber state. Gather family/type, entity ID, message, publication, destination and errors. Respect contract sequencing and dependencies. Do not extrapolate RIB guarantees to every external HTTP call: confirm delivery boundaries and business effects."},"flow":{"es":"Cambio origen > Publisher > Mensaje > Subscriber > Resultado destino","en":"Source change > Publisher > Message > Subscriber > Destination outcome"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-integration-cloud/latest/oriov/retail-integration-cloud-service-components.htm","retail":true,"followup":{"es":"Define evidencias para ubicar un evento de item entre origen y destino.","en":"Define evidence to locate an item event between source and destination."},"diagram":"messaging"},{"id":"retail-integration-03","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué es RIB Hospital y cómo tratarías un mensaje rechazado?","en":"What is RIB Hospital and how would you handle a rejected message?"},"options":[{"text":{"es":"Un mecanismo de tratamiento de errores que requiere diagnóstico y reintento controlado","en":"An error-handling mechanism requiring diagnosis and controlled retry"},"correct":true,"feedback":{"es":"Hospital conserva información de mensajes con problemas según release. Puede haber datos inválidos, dependencias ausentes o falla técnica. Lee error y cadena de entidad, corrige la causa mediante procedimiento autorizado y luego verifica reintento. No edites payload arbitrariamente ni elimines mensajes para limpiar un dashboard. Orden y efectos previos importan; preserva evidencia y conciliación.","en":"Hospital retains information about troubled messages under release-specific behavior. Causes may include invalid data, missing dependencies or technical failure. Read the error and entity chain, fix the cause through an authorized procedure, then verify retry. Do not arbitrarily edit payloads or delete messages to clean a dashboard. Ordering and prior effects matter; preserve evidence and reconciliation."}},{"text":{"es":"Eliminar todos los errores es una solución","en":"Deleting every error is a solution"},"correct":false,"feedback":{"es":"Oculta pendientes y puede perder datos.","en":"This hides pending work and may lose data."}},{"text":{"es":"Reintentar infinito sin clasificar causa","en":"Retry indefinitely without classifying the cause"},"correct":false,"feedback":{"es":"Un error permanente seguirá fallando y consume capacidad.","en":"A permanent error keeps failing and consumes capacity."}}],"explanation":{"es":"Hospital conserva información de mensajes con problemas según release. Puede haber datos inválidos, dependencias ausentes o falla técnica. Lee error y cadena de entidad, corrige la causa mediante procedimiento autorizado y luego verifica reintento. No edites payload arbitrariamente ni elimines mensajes para limpiar un dashboard. Orden y efectos previos importan; preserva evidencia y conciliación.","en":"Hospital retains information about troubled messages under release-specific behavior. Causes may include invalid data, missing dependencies or technical failure. Read the error and entity chain, fix the cause through an authorized procedure, then verify retry. Do not arbitrarily edit payloads or delete messages to clean a dashboard. Ordering and prior effects matter; preserve evidence and reconciliation."},"flow":{"es":"Mensaje fallido > Error / Dependencia > Causa corregida > Retry controlado > Conciliación","en":"Failed message > Error / Dependency > Corrected cause > Controlled retry > Reconciliation"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-integration-cloud/24.0.101.0/ribha/F90423_01.pdf","retail":true,"followup":{"es":"Un item padre falta: explica por qué no reintentas sus eventos hijos sin resolverlo.","en":"A parent item is missing: explain why you would not retry its child events first."}},{"id":"retail-integration-04","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo protegerías secuencia e idempotencia al reintentar integración Retail?","en":"How would you protect sequencing and idempotency when retrying Retail integration?"},"options":[{"text":{"es":"Confirmar efectos previos, claves y dependencias antes de repetir","en":"Confirm prior effects, keys and dependencies before repeating"},"correct":true,"feedback":{"es":"Crear artículo antes de modificarlo es una dependencia típica. Un timeout puede ocurrir después del commit del destino: ausencia de respuesta no significa ausencia de efecto. Busca ID de negocio/mensaje, estado y registro de deduplicación si existe. Sigue el mecanismo soportado de recuperación y prueba una unidad acotada. Un replay masivo sin clasificación puede duplicar stock, órdenes o asientos.","en":"Creating an item before modifying it is a typical dependency. A timeout can occur after the destination commits: no response does not mean no effect. Check business/message ID, state and any deduplication record. Follow the supported recovery mechanism and test a bounded unit. Unclassified bulk replay can duplicate stock, orders or accounting entries."}},{"text":{"es":"Timeout demuestra que nada se guardó","en":"A timeout proves nothing was saved"},"correct":false,"feedback":{"es":"La respuesta puede perderse después del commit.","en":"The response can be lost after commit."}},{"text":{"es":"Cambiar ID para saltar deduplicación","en":"Change the ID to bypass deduplication"},"correct":false,"feedback":{"es":"Puede convertir un reintento en efecto duplicado.","en":"It can turn a retry into a duplicate effect."}}],"explanation":{"es":"Crear artículo antes de modificarlo es una dependencia típica. Un timeout puede ocurrir después del commit del destino: ausencia de respuesta no significa ausencia de efecto. Busca ID de negocio/mensaje, estado y registro de deduplicación si existe. Sigue el mecanismo soportado de recuperación y prueba una unidad acotada. Un replay masivo sin clasificación puede duplicar stock, órdenes o asientos.","en":"Creating an item before modifying it is a typical dependency. A timeout can occur after the destination commits: no response does not mean no effect. Check business/message ID, state and any deduplication record. Follow the supported recovery mechanism and test a bounded unit. Unclassified bulk replay can duplicate stock, orders or accounting entries."},"flow":{"es":"Timeout > Buscar efecto previo > Verificar orden > Retry autorizado > Control de duplicados","en":"Timeout > Check prior effect > Verify order > Authorized retry > Duplicate check"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Propón una prueba antes de reenviar 500 mensajes con timeout.","en":"Propose a test before resending 500 timed-out messages."},"evidence":{"es":"Caso hipotético: destino registra recepción R-88, pero publisher obtuvo timeout al esperar respuesta.","en":"Hypothetical case: the destination records receipt R-88, but the publisher timed out waiting for a response."}},{"id":"retail-integration-05","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué investigas en una carga BDI además de job status?","en":"What do you investigate in a BDI load besides job status?"},"options":[{"text":{"es":"Volumen, etapas, controles, dependencias y publicación al destino","en":"Volume, stages, controls, dependencies and delivery to the destination"},"correct":true,"feedback":{"es":"BDI integra conjuntos grandes de datos. Un status de ejecución necesita interpretarse con su componente y logs: extracción, transferencia y carga pueden ser etapas diferentes. Compara conteos, claves y totales con filtros documentados. Distingue rechazo parcial de transporte fallido. Un mapa visual de flujo no siempre es monitoreo runtime; confirma qué consola muestra ejecución real en tu release.","en":"BDI integrates large datasets. Interpret execution status in the context of its component and logs: extraction, transfer and loading can be different stages. Compare counts, keys and totals against documented filters. Distinguish partial rejection from transport failure. A visual flow map is not always runtime monitoring; confirm which console shows actual execution in your release."}},{"text":{"es":"Job verde elimina necesidad de conteos","en":"A green job removes the need for counts"},"correct":false,"feedback":{"es":"Puede existir éxito parcial o diferencia de filtros.","en":"Partial success or filter differences may exist."}},{"text":{"es":"Un diagrama de flujo prueba ejecución exitosa","en":"A flow diagram proves successful execution"},"correct":false,"feedback":{"es":"Describe diseño, no necesariamente estado runtime.","en":"It describes design, not necessarily runtime state."}}],"explanation":{"es":"BDI integra conjuntos grandes de datos. Un status de ejecución necesita interpretarse con su componente y logs: extracción, transferencia y carga pueden ser etapas diferentes. Compara conteos, claves y totales con filtros documentados. Distingue rechazo parcial de transporte fallido. Un mapa visual de flujo no siempre es monitoreo runtime; confirma qué consola muestra ejecución real en tu release.","en":"BDI integrates large datasets. Interpret execution status in the context of its component and logs: extraction, transfer and loading can be different stages. Compare counts, keys and totals against documented filters. Distinguish partial rejection from transport failure. A visual flow map is not always runtime monitoring; confirm which console shows actual execution in your release."},"flow":{"es":"Extract > Transfer > Load > Conteos / Rechazos > Publicación validada","en":"Extract > Transfer > Load > Counts / Rejections > Validated delivery"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-integration-cloud/latest/bdiin/introduction.htm","retail":true,"followup":{"es":"Extraes 100000 y destino acepta 99800: qué preguntas antes de repetir toda la carga.","en":"You extract 100000 and the destination accepts 99800: what do you ask before repeating the load?"},"diagram":"patterns"},{"id":"retail-integration-06","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo reconocer un fallo de contrato de datos en una integración?","en":"How do you recognize a data-contract failure in an integration?"},"options":[{"text":{"es":"Comparar schema/version, campos requeridos, tipos y referencias","en":"Compare schema/version, required fields, types and references"},"correct":true,"feedback":{"es":"Contrato define qué se envía y cómo interpretarlo: identificadores, enums, unidades, moneda, timezone y versión. Un JSON válido puede ser semánticamente inválido. Toma un payload sanitizado, valida contra el contrato del endpoint y compara con un caso sano. Si fallan solo ciertas entidades, revisa valores y referencias antes de reiniciar todo. Coordina la corrección con productor y consumidor.","en":"A contract defines what is sent and how to interpret it: identifiers, enums, units, currency, time zone and version. Valid JSON can be semantically invalid. Use a sanitized payload, validate it against the endpoint contract and compare with a healthy case. If only certain entities fail, inspect values and references before restarting everything. Coordinate correction with producer and consumer."}},{"text":{"es":"JSON parseable garantiza aceptación comercial","en":"Parseable JSON guarantees business acceptance"},"correct":false,"feedback":{"es":"No verifica tipos de negocio ni referencias.","en":"It does not verify business types or references."}},{"text":{"es":"Cambiar el consumidor sin avisar al productor","en":"Change the consumer without informing the producer"},"correct":false,"feedback":{"es":"Rompe contrato y futuras cargas.","en":"It breaks the contract and future loads."}}],"explanation":{"es":"Contrato define qué se envía y cómo interpretarlo: identificadores, enums, unidades, moneda, timezone y versión. Un JSON válido puede ser semánticamente inválido. Toma un payload sanitizado, valida contra el contrato del endpoint y compara con un caso sano. Si fallan solo ciertas entidades, revisa valores y referencias antes de reiniciar todo. Coordina la corrección con productor y consumidor.","en":"A contract defines what is sent and how to interpret it: identifiers, enums, units, currency, time zone and version. Valid JSON can be semantically invalid. Use a sanitized payload, validate it against the endpoint contract and compare with a healthy case. If only certain entities fail, inspect values and references before restarting everything. Coordinate correction with producer and consumer."},"flow":{"es":"Payload sanitizado > Contrato > Validación > Diferencia > Corrección conjunta","en":"Sanitized payload > Contract > Validation > Difference > Joint correction"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Un campo quantity llega como texto y unidad incorrecta: separa sintaxis de semántica.","en":"Quantity arrives as text with the wrong unit: separate syntax from semantics."}},{"id":"retail-integration-07","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"basic","kind":"concept","question":{"es":"¿Qué significa SOA y cómo ubicas BPEL y OSB?","en":"What does SOA mean and how do BPEL and OSB fit?"},"options":[{"text":{"es":"Arquitectura orientada a servicios; BPEL orquesta y OSB puede mediar servicios","en":"Service-oriented architecture; BPEL orchestrates and OSB can mediate services"},"correct":true,"feedback":{"es":"SOA no es un producto único obligatorio en todo Retail. En stacks que lo usan, BPEL modela procesos/orquestación y Oracle Service Bus ofrece mediación/routing según diseño. Confirma composites, servicios, endpoints y dueños presentes. Para soporte distingue fallo de transporte, regla, transformación y dependencia. No estudies una consola ajena al entorno como si fuera universal.","en":"SOA is not a single product mandatory for all Retail. In stacks using it, BPEL models processes/orchestration and Oracle Service Bus provides mediation/routing under the design. Confirm the actual composites, services, endpoints and owners. In support distinguish transport, rule, transformation and dependency failures. Do not treat a console absent from the environment as universal."}},{"text":{"es":"SOA significa simplemente un servidor Linux","en":"SOA simply means a Linux server"},"correct":false,"feedback":{"es":"Describe una arquitectura de servicios.","en":"It describes a service architecture."}},{"text":{"es":"Todo Retail requiere idéntico BPEL","en":"All Retail requires identical BPEL"},"correct":false,"feedback":{"es":"Depende del producto y diseño.","en":"It depends on the product and design."}}],"explanation":{"es":"SOA no es un producto único obligatorio en todo Retail. En stacks que lo usan, BPEL modela procesos/orquestación y Oracle Service Bus ofrece mediación/routing según diseño. Confirma composites, servicios, endpoints y dueños presentes. Para soporte distingue fallo de transporte, regla, transformación y dependencia. No estudies una consola ajena al entorno como si fuera universal.","en":"SOA is not a single product mandatory for all Retail. In stacks using it, BPEL models processes/orchestration and Oracle Service Bus provides mediation/routing under the design. Confirm the actual composites, services, endpoints and owners. In support distinguish transport, rule, transformation and dependency failures. Do not treat a console absent from the environment as universal."},"flow":{"es":"Servicio > Mediación > Orquestación > Dependencia > Resultado","en":"Service > Mediation > Orchestration > Dependency > Outcome"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12212/soasuite/administer/GUID-A6CAAB62-CD73-4D52-8E80-0B618B3C5B82.htm","retail":true,"followup":{"es":"Dibuja un proceso de pedido con dos servicios y un punto de fallo.","en":"Draw an order process with two services and a failure point."}},{"id":"retail-integration-08","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"scenario","question":{"es":"¿Qué evidencia buscarías en un composite SOA fallido?","en":"What evidence would you look for in a failed SOA composite?"},"options":[{"text":{"es":"Flow/instance ID, fault, etapa y dependencia con audit disponible","en":"Flow/instance ID, fault, stage and dependency using available audit data"},"correct":true,"feedback":{"es":"Identifica instancia, versión del composite, hora y actividad fallida. La información visible depende de audit level y retención; ausencia de detalle no prueba ausencia de ejecución. Correlaciona logs con el endpoint destino y distingue fault recuperable de error de datos. Antes de recover/retry verifica efectos previos y política. No habilites logging excesivo en PROD sin evaluar volumen y datos sensibles.","en":"Identify the instance, composite version, time and failed activity. Visibility depends on audit level and retention; missing detail does not prove no execution. Correlate logs with the target endpoint and distinguish recoverable faults from data errors. Before recovery/retry check prior effects and policy. Do not enable excessive production logging without assessing volume and sensitive data."}},{"text":{"es":"Retry todas las instancias sin clasificación","en":"Retry every instance without classification"},"correct":false,"feedback":{"es":"Puede repetir efectos no idempotentes.","en":"It can repeat non-idempotent effects."}},{"text":{"es":"Activar audit máximo para siempre","en":"Enable maximum audit forever"},"correct":false,"feedback":{"es":"Puede generar costo y exposición innecesarios.","en":"It can create unnecessary cost and exposure."}}],"explanation":{"es":"Identifica instancia, versión del composite, hora y actividad fallida. La información visible depende de audit level y retención; ausencia de detalle no prueba ausencia de ejecución. Correlaciona logs con el endpoint destino y distingue fault recuperable de error de datos. Antes de recover/retry verifica efectos previos y política. No habilites logging excesivo en PROD sin evaluar volumen y datos sensibles.","en":"Identify the instance, composite version, time and failed activity. Visibility depends on audit level and retention; missing detail does not prove no execution. Correlate logs with the target endpoint and distinguish recoverable faults from data errors. Before recovery/retry check prior effects and policy. Do not enable excessive production logging without assessing volume and sensitive data."},"flow":{"es":"Instance ID > Fault > Actividad > Dependencia > Recuperación controlada","en":"Instance ID > Fault > Activity > Dependency > Controlled recovery"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12212/soasuite/administer/GUID-A6CAAB62-CD73-4D52-8E80-0B618B3C5B82.htm","retail":true,"followup":{"es":"¿Qué harías si el fault muestra timeout y destino no confirma todavía el commit?","en":"What would you do if the fault shows a timeout and the destination has not confirmed commit?"},"evidence":{"es":"Caso hipotético: composite de pedido tiene Flow ID 731; falla al invocar un servicio de reserva.","en":"Hypothetical case: an order composite has Flow ID 731 and fails calling a reservation service."}},{"id":"retail-integration-09","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"command","question":{"es":"¿Cómo inspeccionarías un log de integración sin perder el contexto?","en":"How would you inspect an integration log without losing context?"},"options":[{"text":{"es":"Filtrar por ID literal y capturar líneas cercanas con hora y componente","en":"Filter by literal ID and capture nearby lines with time and component"},"correct":true,"feedback":{"es":"grep -F trata el ID como texto literal y evita interpretarlo como regex. -n muestra línea; -C conserva contexto. Confirma rotación, timezone y servidor. Un error aislado puede estar precedido por la causa y seguido por recovery. Sanitiza payloads y secretos antes de compartir. Una ausencia en un archivo no demuestra que el evento no exista en otra instancia o log rotado.","en":"grep -F treats the ID as literal text rather than regex. -n shows line numbers; -C keeps context. Confirm rotation, time zone and server. An isolated error may be preceded by its cause and followed by recovery. Sanitize payloads and secrets before sharing. Absence from one file does not prove the event is absent from another instance or rotated log."}},{"text":{"es":"Buscar ERROR y compartir todo el archivo","en":"Search ERROR and share the whole file"},"correct":false,"feedback":{"es":"Pierdes correlación y puedes exponer información.","en":"This loses correlation and may expose information."}},{"text":{"es":"Asumir que grep vacío prueba evento inexistente","en":"Assume an empty grep proves no event exists"},"correct":false,"feedback":{"es":"Puede ser archivo, tiempo o instancia incorrectos.","en":"The file, time or instance can be wrong."}}],"explanation":{"es":"grep -F trata el ID como texto literal y evita interpretarlo como regex. -n muestra línea; -C conserva contexto. Confirma rotación, timezone y servidor. Un error aislado puede estar precedido por la causa y seguido por recovery. Sanitiza payloads y secretos antes de compartir. Una ausencia en un archivo no demuestra que el evento no exista en otra instancia o log rotado.","en":"grep -F treats the ID as literal text rather than regex. -n shows line numbers; -C keeps context. Confirm rotation, time zone and server. An isolated error may be preceded by its cause and followed by recovery. Sanitize payloads and secrets before sharing. Absence from one file does not prove the event is absent from another instance or rotated log."},"flow":{"es":"ID negocio > Archivo / Hora > Contexto > Correlación destino > Hipótesis","en":"Business ID > File / Time > Context > Destination correlation > Hypothesis"},"code":"grep -Fn -C 3 -- 'message-id-123' /authorized/path/integration.log","output":{"es":"Muestra coincidencias literales con tres líneas de contexto. Ruta e ID son ejemplos, no archivos Retail universales.","en":"Shows literal matches with three context lines. Path and ID are examples, not universal Retail files."},"source":"","retail":true,"followup":{"es":"¿Cómo cambiaría tu búsqueda si los logs están distribuidos en cuatro nodos?","en":"How would your search change if logs are distributed across four nodes?"}},{"id":"retail-integration-10","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué medirías para detectar retraso de integración antes de la queja?","en":"What would you measure to detect integration delay before a complaint?"},"options":[{"text":{"es":"Edad del pendiente más antiguo, tasas, rechazos y deadline comercial","en":"Oldest pending age, rates, rejections and business deadline"},"correct":true,"feedback":{"es":"Backlog cuenta pendientes; su edad revela cuánto llevan esperando. Compara publish/consume rates, error/redelivery y estado del consumidor. Si llegan 100/min y salen 70/min, crece 30/min mientras esas tasas se mantengan. Una alerta útil combina duración y cutoff de negocio. Queue depth cero tampoco prueba éxito si se descartaron mensajes; añade controles de efectos y rechazo.","en":"Backlog counts pending work; its age reveals waiting time. Compare publish/consume rates, errors/redelivery and consumer status. If 100/min arrive and 70/min leave, backlog grows 30/min while those rates persist. A useful alert combines duration and business cutoff. Zero queue depth does not prove success if messages were discarded; add outcome and rejection checks."}},{"text":{"es":"Solo revisar profundidad una vez al día","en":"Only check depth once a day"},"correct":false,"feedback":{"es":"Puede ocultar retrasos críticos y tendencia.","en":"This can hide critical delay and trends."}},{"text":{"es":"Queue vacía demuestra conciliación final","en":"An empty queue proves final reconciliation"},"correct":false,"feedback":{"es":"Necesitas verificar procesamiento y destino.","en":"You need to verify processing and destination."}}],"explanation":{"es":"Backlog cuenta pendientes; su edad revela cuánto llevan esperando. Compara publish/consume rates, error/redelivery y estado del consumidor. Si llegan 100/min y salen 70/min, crece 30/min mientras esas tasas se mantengan. Una alerta útil combina duración y cutoff de negocio. Queue depth cero tampoco prueba éxito si se descartaron mensajes; añade controles de efectos y rechazo.","en":"Backlog counts pending work; its age reveals waiting time. Compare publish/consume rates, errors/redelivery and consumer status. If 100/min arrive and 70/min leave, backlog grows 30/min while those rates persist. A useful alert combines duration and business cutoff. Zero queue depth does not prove success if messages were discarded; add outcome and rejection checks."},"flow":{"es":"Tasa entrada > Tasa salida > Backlog y edad > Cutoff > Acción","en":"Input rate > Output rate > Backlog and age > Cutoff > Action"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Diseña umbral de alerta para precios que deben llegar antes de abrir tiendas.","en":"Design an alert threshold for prices required before stores open."},"diagram":"messaging"},{"id":"retail-integration-11","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo separarías un poison message de una caída del consumidor?","en":"How would you separate a poison message from a consumer outage?"},"options":[{"text":{"es":"Comparar alcance, repetición de IDs y estado del consumidor","en":"Compare scope, repeating IDs and consumer state"},"correct":true,"feedback":{"es":"Poison message es un mensaje que falla repetidamente por su contenido o una condición específica. Una caída afecta el consumo más ampliamente. Segmenta familia, error, ID y tiempo; compara mensajes sanos con el fallido. Usa el hospital/dead-letter mechanism soportado y corrección autorizada; no borres la cola. Reducir redelivery sin diagnóstico puede ocultar pérdida de mensajes.","en":"A poison message repeatedly fails because of its content or a specific condition. An outage affects consumption more broadly. Segment by family, error, ID and time; compare healthy and failing messages. Use supported hospital/dead-letter handling and authorized correction; do not delete the queue. Reducing redelivery without diagnosis may hide message loss."}},{"text":{"es":"Reiniciar BD por cualquier redelivery","en":"Restart the DB for any redelivery"},"correct":false,"feedback":{"es":"No distingue dato específico de plataforma.","en":"This does not distinguish specific data from platform issues."}},{"text":{"es":"Eliminar M-17 sin preservar evidencia","en":"Delete M-17 without preserving evidence"},"correct":false,"feedback":{"es":"Puede perder una operación comercial necesaria.","en":"You can lose a required business operation."}}],"explanation":{"es":"Poison message es un mensaje que falla repetidamente por su contenido o una condición específica. Una caída afecta el consumo más ampliamente. Segmenta familia, error, ID y tiempo; compara mensajes sanos con el fallido. Usa el hospital/dead-letter mechanism soportado y corrección autorizada; no borres la cola. Reducir redelivery sin diagnóstico puede ocultar pérdida de mensajes.","en":"A poison message repeatedly fails because of its content or a specific condition. An outage affects consumption more broadly. Segment by family, error, ID and time; compare healthy and failing messages. Use supported hospital/dead-letter handling and authorized correction; do not delete the queue. Reducing redelivery without diagnosis may hide message loss."},"flow":{"es":"Pendientes > IDs / Errores > Alcance > Dato o consumidor > Recuperación","en":"Pending work > IDs / Errors > Scope > Data or consumer > Recovery"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Solo M-17 falla 200 veces; otros progresan: plantea siguiente prueba y mitigación.","en":"Only M-17 fails 200 times; others progress: propose the next test and mitigation."},"evidence":{"es":"Caso hipotético: redeliveryCount sube solo para M-17 con referencia de item inexistente.","en":"Hypothetical case: redeliveryCount rises only for M-17 with a nonexistent item reference."}},{"id":"retail-integration-12","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo organizarías reconciliación después de recuperar una interface?","en":"How would you organize reconciliation after recovering an interface?"},"options":[{"text":{"es":"Comparar pendientes, efectos y controles por rango antes de cerrar","en":"Compare pending work, effects and controls by range before closing"},"correct":true,"feedback":{"es":"Recuperar transporte es la primera parte. Define ventana afectada y población de entidades; compara conteos, IDs y totales con exclusiones esperadas. Investiga faltantes y duplicados; ejecuta recovery soportado con dueño funcional. Conserva evidencia de que backlog disminuye y los procesos dependientes terminaron. No cierres porque el dashboard técnico cambió a verde si la venta o factura sigue ausente.","en":"Restoring transport is the first part. Define the affected window and entity population; compare counts, IDs and totals with expected exclusions. Investigate missing and duplicate entries; execute supported recovery with the functional owner. Preserve evidence of falling backlog and completed dependent processes. Do not close because the technical dashboard turns green while a sale or invoice remains missing."}},{"text":{"es":"Cerrar al primer mensaje exitoso","en":"Close after the first successful message"},"correct":false,"feedback":{"es":"No verifica la población afectada completa.","en":"It does not verify the full affected population."}},{"text":{"es":"Reprocesar todo el histórico siempre","en":"Always reprocess all history"},"correct":false,"feedback":{"es":"Aumenta carga y riesgo de duplicados.","en":"This increases load and duplicate risk."}}],"explanation":{"es":"Recuperar transporte es la primera parte. Define ventana afectada y población de entidades; compara conteos, IDs y totales con exclusiones esperadas. Investiga faltantes y duplicados; ejecuta recovery soportado con dueño funcional. Conserva evidencia de que backlog disminuye y los procesos dependientes terminaron. No cierres porque el dashboard técnico cambió a verde si la venta o factura sigue ausente.","en":"Restoring transport is the first part. Define the affected window and entity population; compare counts, IDs and totals with expected exclusions. Investigate missing and duplicate entries; execute supported recovery with the functional owner. Preserve evidence of falling backlog and completed dependent processes. Do not close because the technical dashboard turns green while a sale or invoice remains missing."},"flow":{"es":"Servicio recuperado > Ventana afectada > Comparación > Recovery acotado > Sign-off","en":"Service restored > Affected window > Comparison > Bounded recovery > Sign-off"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Propón un reporte de reconciliación con seis columnas y criterios de cierre.","en":"Propose a six-column reconciliation report and closure criteria."}},{"id":"retail-database-01","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"basic","kind":"concept","question":{"es":"¿Qué diferencias de Oracle DB debes aprender viniendo de DB2 LUW?","en":"What Oracle DB differences should you learn coming from DB2 LUW?"},"options":[{"text":{"es":"Arquitectura, sintaxis, vistas, herramientas y recuperación propias de Oracle","en":"Oracle-specific architecture, syntax, views, tools and recovery"},"correct":true,"feedback":{"es":"Tu experiencia en locks, planes, I/O, backup y HA aporta método, pero DB2 HADR no es Oracle Data Guard y db2 comandos no son SQL*Plus. Aprende servicio/listener, schemas, privilegios, vistas y transacciones Oracle del entorno. Usa laboratorios y documentación; confirma quién opera la BD. No afirmes dominio Oracle profundo solo porque ambos usan SQL.","en":"Your experience with locks, plans, I/O, backup and HA supplies a method, but DB2 HADR is not Oracle Data Guard and db2 commands are not SQL*Plus. Learn the environment service/listener, schemas, privileges, views and Oracle transactions. Use labs and documentation; confirm who operates the DB. Do not claim deep Oracle mastery solely because both use SQL."}},{"text":{"es":"HADR y Data Guard son idénticos comandos","en":"HADR and Data Guard use identical commands"},"correct":false,"feedback":{"es":"Comparten objetivo general, no implementación ni procedimiento.","en":"They share a general objective, not implementation or procedures."}},{"text":{"es":"SQL elimina todas las diferencias entre motores","en":"SQL eliminates all engine differences"},"correct":false,"feedback":{"es":"Sintaxis y comportamiento operativo varían.","en":"Syntax and operational behavior vary."}}],"explanation":{"es":"Tu experiencia en locks, planes, I/O, backup y HA aporta método, pero DB2 HADR no es Oracle Data Guard y db2 comandos no son SQL*Plus. Aprende servicio/listener, schemas, privilegios, vistas y transacciones Oracle del entorno. Usa laboratorios y documentación; confirma quién opera la BD. No afirmes dominio Oracle profundo solo porque ambos usan SQL.","en":"Your experience with locks, plans, I/O, backup and HA supplies a method, but DB2 HADR is not Oracle Data Guard and db2 commands are not SQL*Plus. Learn the environment service/listener, schemas, privileges, views and Oracle transactions. Use labs and documentation; confirm who operates the DB. Do not claim deep Oracle mastery solely because both use SQL."},"flow":{"es":"Fundamentos DB2 > Diferencias Oracle > Lab > Evidencia > Operación autorizada","en":"DB2 foundations > Oracle differences > Lab > Evidence > Authorized operation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Prepara una respuesta honesta sobre performance transferible y herramientas por aprender.","en":"Prepare an honest answer about transferable performance skills and tools to learn."}},{"id":"retail-database-02","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"basic","kind":"query","question":{"es":"¿Cómo contarías pedidos fallidos por tienda en un laboratorio SQL?","en":"How would you count failed orders by store in an SQL lab?"},"options":[{"text":{"es":"Filtrar estados y agrupar por tienda con COUNT","en":"Filter statuses and group by store with COUNT"},"correct":true,"feedback":{"es":"Usa tablas lab_* para aprender sin asumir el schema real de Oracle Retail. WHERE filtra filas antes de GROUP BY; COUNT(*) cuenta filas, no necesariamente pedidos únicos si hay duplicados. Confirma granularidad y timestamps antes de usar una consulta en diagnóstico. En un entorno real pide el modelo autorizado y usa SELECT de alcance acotado; no pegues este nombre de tabla como si fuera una tabla oficial.","en":"Use lab_* tables to learn without assuming the actual Oracle Retail schema. WHERE filters rows before GROUP BY; COUNT(*) counts rows, not necessarily unique orders if duplicates exist. Confirm grain and timestamps before using a diagnostic query. In a real environment request the authorized model and use bounded SELECTs; do not treat this table name as an official product table."}},{"text":{"es":"COUNT siempre significa entidades únicas","en":"COUNT always means unique entities"},"correct":false,"feedback":{"es":"COUNT(*) cuenta filas según la fuente.","en":"COUNT(*) counts rows in the source."}},{"text":{"es":"Actualizar a PAID para eliminar errores","en":"Update to PAID to remove errors"},"correct":false,"feedback":{"es":"Falsea estados y evita el diagnóstico.","en":"This falsifies state and avoids diagnosis."}}],"explanation":{"es":"Usa tablas lab_* para aprender sin asumir el schema real de Oracle Retail. WHERE filtra filas antes de GROUP BY; COUNT(*) cuenta filas, no necesariamente pedidos únicos si hay duplicados. Confirma granularidad y timestamps antes de usar una consulta en diagnóstico. En un entorno real pide el modelo autorizado y usa SELECT de alcance acotado; no pegues este nombre de tabla como si fuera una tabla oficial.","en":"Use lab_* tables to learn without assuming the actual Oracle Retail schema. WHERE filters rows before GROUP BY; COUNT(*) counts rows, not necessarily unique orders if duplicates exist. Confirm grain and timestamps before using a diagnostic query. In a real environment request the authorized model and use bounded SELECTs; do not treat this table name as an official product table."},"flow":{"es":"Filas > WHERE FAILED > GROUP BY store_id > COUNT > Interpretación","en":"Rows > WHERE FAILED > GROUP BY store_id > COUNT > Interpretation"},"code":"SELECT store_id, COUNT(*) AS failed_rows\nFROM lab_orders\nWHERE status = 'FAILED'\nGROUP BY store_id\nORDER BY failed_rows DESC;","output":{"es":"Datos lab: FAILED en tiendas 10,10,20. Resultado: 10 → 2; 20 → 1. Tabla ilustrativa.","en":"Lab data: FAILED at stores 10,10,20. Result: 10 → 2; 20 → 1. Illustrative table."},"source":"","retail":true,"followup":{"es":"Añade un filtro por fecha usando bind variables, sin convertir cada fila a texto.","en":"Add a date filter using bind variables without converting each row to text."},"diagram":"sql-count"},{"id":"retail-database-03","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"intermediate","kind":"query","question":{"es":"¿Cómo detectarías recepciones sin factura asociada en tablas de práctica?","en":"How would you detect receipts with no associated invoice in practice tables?"},"options":[{"text":{"es":"Usar NOT EXISTS con una clave de relación documentada","en":"Use NOT EXISTS with a documented relationship key"},"correct":true,"feedback":{"es":"NOT EXISTS busca ausencia de filas relacionadas sin el problema de NULL de ciertas formas de NOT IN. La relación lab usa receipt_id solo para practicar; el producto real puede tener cabeceras, líneas y relaciones más complejas. Un resultado sin factura no es automáticamente error: revisa horizonte, estado y reglas. No combines documentos solo por importe porque cantidades iguales no identifican una relación.","en":"NOT EXISTS checks for missing related rows without NULL issues associated with some NOT IN forms. This lab uses receipt_id only for practice; the actual product may have headers, lines and more complex relationships. A receipt without an invoice is not automatically an error: check timing, status and rules. Do not join documents only by amount because equal quantities do not establish a relationship."}},{"text":{"es":"Unir únicamente por monto total","en":"Join only by total amount"},"correct":false,"feedback":{"es":"No asegura pertenencia del documento.","en":"It does not establish document identity."}},{"text":{"es":"Eliminar recepciones sin factura","en":"Delete receipts without invoices"},"correct":false,"feedback":{"es":"Son evidencia válida y pueden estar pendientes legítimamente.","en":"They are valid evidence and may legitimately be pending."}}],"explanation":{"es":"NOT EXISTS busca ausencia de filas relacionadas sin el problema de NULL de ciertas formas de NOT IN. La relación lab usa receipt_id solo para practicar; el producto real puede tener cabeceras, líneas y relaciones más complejas. Un resultado sin factura no es automáticamente error: revisa horizonte, estado y reglas. No combines documentos solo por importe porque cantidades iguales no identifican una relación.","en":"NOT EXISTS checks for missing related rows without NULL issues associated with some NOT IN forms. This lab uses receipt_id only for practice; the actual product may have headers, lines and more complex relationships. A receipt without an invoice is not automatically an error: check timing, status and rules. Do not join documents only by amount because equal quantities do not establish a relationship."},"flow":{"es":"Recepciones > Clave documentada > NOT EXISTS factura > Estado / Tiempo > Revisión","en":"Receipts > Documented key > NOT EXISTS invoice > State / Time > Review"},"code":"SELECT r.receipt_id\nFROM lab_receipts r\nWHERE NOT EXISTS (\n  SELECT 1 FROM lab_invoices i\n  WHERE i.receipt_id = r.receipt_id\n);","output":{"es":"Receipts 1,2,3; invoice para 1 y 3: devuelve 2. Es un modelo de laboratorio, no el schema Retail.","en":"Receipts 1,2,3; invoices for 1 and 3: returns 2. This is a lab model, not the Retail schema."},"source":"","retail":true,"followup":{"es":"¿Por qué una recepción de hoy sin factura puede ser válida?","en":"Why might a receipt from today with no invoice be valid?"},"diagram":"sql-missing"},{"id":"retail-database-04","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"intermediate","kind":"query","question":{"es":"¿Cómo buscarías eventos de un día sin romper semántica de timestamps?","en":"How would you search a day of events without breaking timestamp semantics?"},"options":[{"text":{"es":"Un rango semiabierto con binds compatibles y timezone definido","en":"A half-open range with compatible binds and a defined time zone"},"correct":true,"feedback":{"es":"Usa >= inicio y \u003c siguiente_inicio, evitando incluir exactamente la medianoche del día siguiente. Define si el dato usa hora UTC, local o fecha comercial y qué tipo Oracle almacena. Funciones sobre la columna pueden afectar acceso por índice según índices disponibles. Los binds deben ser tipos compatibles, no strings ambiguos sujetos a NLS. Verifica el plan y casos de frontera.","en":"Use >= start and \u003c next_start to avoid including the next midnight. Define whether data uses UTC, local time or business date and the stored Oracle type. Functions on the column may affect indexed access depending on available indexes. Binds should use compatible types, not ambiguous NLS-dependent strings. Check the plan and boundary cases."}},{"text":{"es":"Comparar fecha usando texto sin formato definido","en":"Compare dates as text without a defined format"},"correct":false,"feedback":{"es":"Introduce ambigüedad y conversiones.","en":"This introduces ambiguity and conversions."}},{"text":{"es":"BETWEEN hasta medianoche incluye solo el día previo","en":"BETWEEN through midnight includes only the prior day"},"correct":false,"feedback":{"es":"BETWEEN incluye ambos extremos.","en":"BETWEEN includes both boundaries."}}],"explanation":{"es":"Usa >= inicio y \u003c siguiente_inicio, evitando incluir exactamente la medianoche del día siguiente. Define si el dato usa hora UTC, local o fecha comercial y qué tipo Oracle almacena. Funciones sobre la columna pueden afectar acceso por índice según índices disponibles. Los binds deben ser tipos compatibles, no strings ambiguos sujetos a NLS. Verifica el plan y casos de frontera.","en":"Use >= start and \u003c next_start to avoid including the next midnight. Define whether data uses UTC, local time or business date and the stored Oracle type. Functions on the column may affect indexed access depending on available indexes. Binds should use compatible types, not ambiguous NLS-dependent strings. Check the plan and boundary cases."},"flow":{"es":"Zona / Tipo > Bind inicio > Rango semiabierto > Filas > Fronteras","en":"Zone / Type > Start bind > Half-open range > Rows > Boundaries"},"code":"SELECT event_id, created_at\nFROM lab_events\nWHERE created_at >= :start_ts\n  AND created_at \u003c :end_ts;","output":{"es":"Binds tipados: inicio inclusivo, siguiente inicio exclusivo. Confirma timezone y tipo del campo.","en":"Typed binds: inclusive start, exclusive next start. Confirm time zone and column type."},"source":"","retail":true,"followup":{"es":"¿Qué cambia si una tienda tiene horario de verano y business date diferente?","en":"What changes if a store uses daylight saving and a different business date?"}},{"id":"retail-database-05","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué es PL/SQL y qué papel tiene un package?","en":"What is PL/SQL and what is the role of a package?"},"options":[{"text":{"es":"Lenguaje procedural de Oracle; package agrupa una interfaz y su implementación","en":"Oracle procedural language; a package groups an interface and implementation"},"correct":true,"feedback":{"es":"SQL consulta/modifica conjuntos; PL/SQL agrega variables, control y manejo de excepciones dentro de la BD. Un package tiene specification pública y body de implementación según diseño. Un batch puede invocar procedimientos para operaciones autorizadas. Confirma parámetros, efectos, permisos y control transaccional antes de ejecutar; un procedimiento no es seguro por ser oficial si lo llamas en contexto equivocado.","en":"SQL queries/modifies sets; PL/SQL adds variables, control and exception handling in the DB. A package has a public specification and implementation body under its design. A batch can call procedures for authorized operations. Confirm parameters, effects, permissions and transaction control before execution; an official procedure is not safe when called in the wrong context."}},{"text":{"es":"PL/SQL solo existe en un archivo Bash","en":"PL/SQL exists only in a Bash file"},"correct":false,"feedback":{"es":"Puede ejecutarse en Oracle DB desde clientes compatibles.","en":"It can execute in Oracle DB from compatible clients."}},{"text":{"es":"Un package siempre hace commit automáticamente","en":"A package always commits automatically"},"correct":false,"feedback":{"es":"Depende de su implementación y contrato.","en":"It depends on implementation and contract."}}],"explanation":{"es":"SQL consulta/modifica conjuntos; PL/SQL agrega variables, control y manejo de excepciones dentro de la BD. Un package tiene specification pública y body de implementación según diseño. Un batch puede invocar procedimientos para operaciones autorizadas. Confirma parámetros, efectos, permisos y control transaccional antes de ejecutar; un procedimiento no es seguro por ser oficial si lo llamas en contexto equivocado.","en":"SQL queries/modifies sets; PL/SQL adds variables, control and exception handling in the DB. A package has a public specification and implementation body under its design. A batch can call procedures for authorized operations. Confirm parameters, effects, permissions and transaction control before execution; an official procedure is not safe when called in the wrong context."},"flow":{"es":"Llamada > Package spec > Body / SQL > Excepción o resultado > Transacción","en":"Call > Package spec > Body / SQL > Exception or result > Transaction"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Explica cuándo preferir una consulta SQL a un loop fila por fila.","en":"Explain when to prefer an SQL query over a row-by-row loop."}},{"id":"retail-database-06","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"intermediate","kind":"query","question":{"es":"¿Cómo escribirías un bloque PL/SQL de lectura con error visible?","en":"How would you write a read-only PL/SQL block with visible errors?"},"options":[{"text":{"es":"Consultar un dato y propagar excepciones en vez de ocultarlas","en":"Query a value and propagate exceptions instead of hiding them"},"correct":true,"feedback":{"es":"Practica con lab_orders. SELECT COUNT INTO asigna un valor a una variable; DBMS_OUTPUT requiere cliente habilitado. RAISE preserva el fallo para el caller. No uses WHEN OTHERS THEN NULL porque transforma error en aparente éxito. No registres datos personales en mensajes. Un ejemplo de lectura no demuestra manejo de transacciones de un procedimiento productivo; ese contrato se revisa aparte.","en":"Practice with lab_orders. SELECT COUNT INTO assigns a value to a variable; DBMS_OUTPUT needs client enablement. RAISE preserves failure for the caller. Do not use WHEN OTHERS THEN NULL because it turns errors into apparent success. Do not log personal data in messages. A read-only example does not establish production procedure transaction behavior; review that contract separately."}},{"text":{"es":"Ignorar todas las excepciones","en":"Ignore every exception"},"correct":false,"feedback":{"es":"El job puede declarar éxito con trabajo incompleto.","en":"The job may report success with incomplete work."}},{"text":{"es":"Imprimir contraseña para diagnosticar","en":"Print the password for diagnosis"},"correct":false,"feedback":{"es":"Expone un secreto, no ayuda a entender el resultado.","en":"This exposes a secret and does not explain the result."}}],"explanation":{"es":"Practica con lab_orders. SELECT COUNT INTO asigna un valor a una variable; DBMS_OUTPUT requiere cliente habilitado. RAISE preserva el fallo para el caller. No uses WHEN OTHERS THEN NULL porque transforma error en aparente éxito. No registres datos personales en mensajes. Un ejemplo de lectura no demuestra manejo de transacciones de un procedimiento productivo; ese contrato se revisa aparte.","en":"Practice with lab_orders. SELECT COUNT INTO assigns a value to a variable; DBMS_OUTPUT needs client enablement. RAISE preserves failure for the caller. Do not use WHEN OTHERS THEN NULL because it turns errors into apparent success. Do not log personal data in messages. A read-only example does not establish production procedure transaction behavior; review that contract separately."},"flow":{"es":"Variable > SELECT INTO > Resultado > Excepción visible > Caller","en":"Variable > SELECT INTO > Result > Visible exception > Caller"},"code":"SET SERVEROUTPUT ON\nDECLARE\n  v_failed NUMBER;\nBEGIN\n  SELECT COUNT(*) INTO v_failed\n  FROM lab_orders WHERE status = 'FAILED';\n  DBMS_OUTPUT.PUT_LINE('failed_rows=' || v_failed);\nEXCEPTION\n  WHEN OTHERS THEN\n    RAISE;\nEND;\n/","output":{"es":"Si existen tres filas FAILED: failed_rows=3. Si la tabla falta, el error se propaga.","en":"With three FAILED rows: failed_rows=3. If the table is missing, the error propagates."},"source":"","retail":true,"followup":{"es":"¿Qué cambiaría si COUNT fuese una modificación y el caller controlara commit?","en":"What would change if COUNT were a modification and the caller controlled commit?"}},{"id":"retail-database-07","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"intermediate","kind":"scenario","question":{"es":"¿Qué revisarías ante ORA-00942 o ORA-01031 en una aplicación Retail?","en":"What would you check for ORA-00942 or ORA-01031 in a Retail application?"},"options":[{"text":{"es":"Usuario/schema, objeto, sinónimos y privilegios mínimos del flujo","en":"User/schema, object, synonyms and least privileges for the flow"},"correct":true,"feedback":{"es":"ORA-00942 puede indicar objeto inexistente o no visible; ORA-01031 indica privilegios insuficientes en la operación. Confirma qué identidad utiliza realmente el datasource y la operación exacta. En PL/SQL importa el modelo de derechos y grants aplicables; no basta una prueba con tu usuario DBA. Compara con configuración aprobada y solicita el permiso específico, no DBA para toda la aplicación.","en":"ORA-00942 can mean an absent or inaccessible object; ORA-01031 indicates insufficient privileges for the operation. Confirm the datasource identity and exact operation. PL/SQL rights models and applicable grants matter; a test using your DBA identity is insufficient. Compare approved configuration and request the specific privilege, not DBA for the entire application."}},{"text":{"es":"Otorgar DBA a todo usuario","en":"Grant DBA to every user"},"correct":false,"feedback":{"es":"Amplía riesgo y oculta el permiso realmente requerido.","en":"This expands risk and hides the actual required permission."}},{"text":{"es":"Crear una tabla con el mismo nombre sin revisar","en":"Create a same-name table without review"},"correct":false,"feedback":{"es":"Puede ocultar schema incorrecto y romper el modelo.","en":"This may hide a wrong schema and break the model."}}],"explanation":{"es":"ORA-00942 puede indicar objeto inexistente o no visible; ORA-01031 indica privilegios insuficientes en la operación. Confirma qué identidad utiliza realmente el datasource y la operación exacta. En PL/SQL importa el modelo de derechos y grants aplicables; no basta una prueba con tu usuario DBA. Compara con configuración aprobada y solicita el permiso específico, no DBA para toda la aplicación.","en":"ORA-00942 can mean an absent or inaccessible object; ORA-01031 indicates insufficient privileges for the operation. Confirm the datasource identity and exact operation. PL/SQL rights models and applicable grants matter; a test using your DBA identity is insufficient. Compare approved configuration and request the specific privilege, not DBA for the entire application."},"flow":{"es":"Error > Identidad real > Objeto / Schema > Grants > Prueba mínima","en":"Error > Actual identity > Object / Schema > Grants > Minimal test"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Por qué el SELECT funciona con tu cuenta y falla desde la app?","en":"Why does SELECT work with your account but fail from the app?"},"evidence":{"es":"Caso hipotético: el datasource APP_QA usa un schema distinto al documentado; falla una consulta tras un clon.","en":"Hypothetical case: APP_QA datasource uses a different schema from the documented one; a query fails after cloning."}},{"id":"retail-database-08","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"advanced","kind":"query","question":{"es":"¿Qué buscarías en un plan de ejecución Oracle para una pantalla lenta?","en":"What would you look for in an Oracle execution plan for a slow screen?"},"options":[{"text":{"es":"Operaciones, predicados, estimaciones y filas reales cuando estén disponibles","en":"Operations, predicates, estimates and actual rows when available"},"correct":true,"feedback":{"es":"Relaciona request ID con SQL_ID mediante instrumentación aprobada. Compara plan/binds y estadísticas bajo carga relevante. EXPLAIN PLAN es una estimación; DISPLAY_CURSOR puede mostrar el cursor observado, y ALLSTATS LAST requiere estadísticas disponibles. No declares todo full scan incorrecto: depende de selectividad/volumen. Las vistas requieren permisos; AWR/ASH y packs tienen condiciones de licencia que debes confirmar.","en":"Relate request ID to SQL_ID through approved instrumentation. Compare plan/binds and statistics under relevant load. EXPLAIN PLAN is an estimate; DISPLAY_CURSOR can show the observed cursor, and ALLSTATS LAST needs available statistics. Do not call every full scan wrong: selectivity/volume matters. Views require privileges; confirm licensing conditions for AWR/ASH and packs."}},{"text":{"es":"Crear índice sin mirar predicados","en":"Create an index without examining predicates"},"correct":false,"feedback":{"es":"Puede no usarse y aumentar costo de escrituras.","en":"It may not be used and can increase write cost."}},{"text":{"es":"EXPLAIN PLAN siempre muestra lo realmente ejecutado","en":"EXPLAIN PLAN always shows actual execution"},"correct":false,"feedback":{"es":"No sustituye evidencia del cursor y runtime.","en":"It does not replace cursor and runtime evidence."}}],"explanation":{"es":"Relaciona request ID con SQL_ID mediante instrumentación aprobada. Compara plan/binds y estadísticas bajo carga relevante. EXPLAIN PLAN es una estimación; DISPLAY_CURSOR puede mostrar el cursor observado, y ALLSTATS LAST requiere estadísticas disponibles. No declares todo full scan incorrecto: depende de selectividad/volumen. Las vistas requieren permisos; AWR/ASH y packs tienen condiciones de licencia que debes confirmar.","en":"Relate request ID to SQL_ID through approved instrumentation. Compare plan/binds and statistics under relevant load. EXPLAIN PLAN is an estimate; DISPLAY_CURSOR can show the observed cursor, and ALLSTATS LAST needs available statistics. Do not call every full scan wrong: selectivity/volume matters. Views require privileges; confirm licensing conditions for AWR/ASH and packs."},"flow":{"es":"Petición > SQL_ID > Plan / Binds > Filas y waits > Hipótesis > Medición","en":"Request > SQL_ID > Plan / Binds > Rows and waits > Hypothesis > Measurement"},"code":"SELECT * FROM TABLE(\n  DBMS_XPLAN.DISPLAY_CURSOR(:sql_id, :child_number, 'ALLSTATS LAST')\n);","output":{"es":"Requiere permisos y estadísticas de ejecución disponibles. Si no hay A-Rows, no inventes valores reales.","en":"Requires privileges and available runtime statistics. If A-Rows are absent, do not invent actual values."},"source":"https://docs.oracle.com/en/database/oracle/oracle-database/18/arpls/DBMS_XPLAN.html","retail":true,"followup":{"es":"¿Qué sospechas si estimación es 10 filas y ejecución produce 500000?","en":"What do you suspect if estimation is 10 rows and execution produces 500000?"}},{"id":"retail-database-09","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo analizarías un bloqueo Oracle que retrasa un batch Retail?","en":"How would you analyze an Oracle lock delaying a Retail batch?"},"options":[{"text":{"es":"Identificar waiter, blocker, transacción y dueño antes de una acción disruptiva","en":"Identify waiter, blocker, transaction and owner before disruption"},"correct":true,"feedback":{"es":"Un lock puede preservar consistencia legítimamente. Con DBA consulta sesiones/waits autorizados y registra SQL, inicio de transacción y objeto. Evalúa si el blocker progresa o quedó abierto, cuánto espera el batch y deadline. Matar una sesión puede iniciar rollback costoso y afectar negocio. Coordina commit/rollback del dueño o terminación aprobada; valida recuperación y evita repetir el patrón.","en":"A lock may legitimately preserve consistency. With the DBA inspect authorized sessions/waits and record SQL, transaction start and object. Assess whether the blocker progresses or remains open, batch wait and deadline. Killing a session can trigger costly rollback and business impact. Coordinate owner commit/rollback or approved termination; verify recovery and prevent recurrence."}},{"text":{"es":"Matar todo proceso con lock","en":"Kill every locking process"},"correct":false,"feedback":{"es":"Los locks pueden ser normales y necesarios.","en":"Locks can be normal and necessary."}},{"text":{"es":"Reiniciar BD ante un único blocker","en":"Restart the DB for one blocker"},"correct":false,"feedback":{"es":"Amplía impacto sin justificar el alcance.","en":"This expands impact without justifying scope."}}],"explanation":{"es":"Un lock puede preservar consistencia legítimamente. Con DBA consulta sesiones/waits autorizados y registra SQL, inicio de transacción y objeto. Evalúa si el blocker progresa o quedó abierto, cuánto espera el batch y deadline. Matar una sesión puede iniciar rollback costoso y afectar negocio. Coordina commit/rollback del dueño o terminación aprobada; valida recuperación y evita repetir el patrón.","en":"A lock may legitimately preserve consistency. With the DBA inspect authorized sessions/waits and record SQL, transaction start and object. Assess whether the blocker progresses or remains open, batch wait and deadline. Killing a session can trigger costly rollback and business impact. Coordinate owner commit/rollback or approved termination; verify recovery and prevent recurrence."},"flow":{"es":"Batch esperando > Waiter > Blocker > Dueño / Transacción > Acción aprobada > Verificación","en":"Waiting batch > Waiter > Blocker > Owner / Transaction > Approved action > Verification"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué preguntas antes de pedir kill session de un proceso de carga?","en":"What do you ask before requesting kill session for a loading process?"},"evidence":{"es":"Caso hipotético: batch espera 20 minutos; una sesión QA dejó transacción abierta sobre la misma entidad.","en":"Hypothetical case: a batch waits 20 minutes; a QA session left an open transaction on the same entity."}},{"id":"retail-database-10","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"advanced","kind":"concept","question":{"es":"¿Qué riesgo tiene crear un índice para resolver lentitud en Retail?","en":"What is the risk of adding an index to fix Retail slowness?"},"options":[{"text":{"es":"Mejora algunas lecturas pero cuesta escrituras, espacio y soporte del producto","en":"It helps some reads but costs writes, space and product-support compatibility"},"correct":true,"feedback":{"es":"Elige a partir de query, selectividad, cardinalidad, plan y frecuencia. En schema de producto los cambios deben pasar por DBA y política de soporte; no alteres objetos suministrados improvisadamente. Prueba con volumen representativo, mide reads/writes y mantenimiento. Un índice mal elegido puede no utilizarse o perjudicar batch. Considera estadísticas y configuración antes de cualquier DDL.","en":"Choose based on query, selectivity, cardinality, plan and frequency. Changes in a product schema must follow DBA and support policy; do not improvise alterations to shipped objects. Test with representative volume and measure reads/writes and maintenance. A poor index may be unused or harm batch. Consider statistics and configuration before any DDL."}},{"text":{"es":"Un índice siempre acelera todo","en":"An index always speeds everything"},"correct":false,"feedback":{"es":"Las escrituras deben mantenerlo y consultas pueden no usarlo.","en":"Writes must maintain it and queries may not use it."}},{"text":{"es":"Aplicar DDL productivo sin review","en":"Apply production DDL without review"},"correct":false,"feedback":{"es":"Puede bloquear, consumir recursos y afectar soporte.","en":"It can block, consume resources and affect support."}}],"explanation":{"es":"Elige a partir de query, selectividad, cardinalidad, plan y frecuencia. En schema de producto los cambios deben pasar por DBA y política de soporte; no alteres objetos suministrados improvisadamente. Prueba con volumen representativo, mide reads/writes y mantenimiento. Un índice mal elegido puede no utilizarse o perjudicar batch. Considera estadísticas y configuración antes de cualquier DDL.","en":"Choose based on query, selectivity, cardinality, plan and frequency. Changes in a product schema must follow DBA and support policy; do not improvise alterations to shipped objects. Test with representative volume and measure reads/writes and maintenance. A poor index may be unused or harm batch. Consider statistics and configuration before any DDL."},"flow":{"es":"Query / Plan > Hipótesis de acceso > Aprobación > Prueba > Impacto total","en":"Query / Plan > Access hypothesis > Approval > Test > Overall impact"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué medirías si un índice acelera búsqueda pero duplica tiempo de carga?","en":"What would you measure if an index speeds search but doubles load time?"}},{"id":"retail-database-11","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"advanced","kind":"concept","question":{"es":"¿Cómo relacionar waits Oracle con CPU, I/O y locks sin adivinar?","en":"How would you relate Oracle waits to CPU, I/O and locks without guessing?"},"options":[{"text":{"es":"Correlacionar ventana, SQL y sesiones con métricas del host/almacenamiento","en":"Correlate the time window, SQL and sessions with host/storage metrics"},"correct":true,"feedback":{"es":"Una app lenta no implica CPU alta. Sesiones pueden esperar I/O, contención o red; la categoría wait no identifica por sí sola toda la causa. Compara baseline, SQL afectados y métricas del mismo intervalo. iostat del app host no describe automáticamente el almacenamiento de una BD remota. Escala con evidencia acotada al dueño de la capa y valida una mejora con carga comparable.","en":"A slow app does not imply high CPU. Sessions may wait for I/O, contention or network; a wait category alone does not identify the full cause. Compare baseline, affected SQL and metrics from the same interval. iostat on the app host does not automatically describe a remote DB storage system. Escalate bounded evidence to the layer owner and validate improvement under comparable load."}},{"text":{"es":"CPU app baja descarta cualquier problema","en":"Low app CPU rules out every problem"},"correct":false,"feedback":{"es":"Esperas y dependencias pueden causar lentitud.","en":"Waits and dependencies can cause slowness."}},{"text":{"es":"I/O wait identifica exactamente un disco roto","en":"I/O wait identifies an exact failed disk"},"correct":false,"feedback":{"es":"Se requiere detalle de carga y almacenamiento.","en":"Workload and storage detail are needed."}}],"explanation":{"es":"Una app lenta no implica CPU alta. Sesiones pueden esperar I/O, contención o red; la categoría wait no identifica por sí sola toda la causa. Compara baseline, SQL afectados y métricas del mismo intervalo. iostat del app host no describe automáticamente el almacenamiento de una BD remota. Escala con evidencia acotada al dueño de la capa y valida una mejora con carga comparable.","en":"A slow app does not imply high CPU. Sessions may wait for I/O, contention or network; a wait category alone does not identify the full cause. Compare baseline, affected SQL and metrics from the same interval. iostat on the app host does not automatically describe a remote DB storage system. Escalate bounded evidence to the layer owner and validate improvement under comparable load."},"flow":{"es":"Ventana > Waits / SQL > Host BD > Storage / Red > Prueba causal","en":"Window > Waits / SQL > DB host > Storage / Network > Causal test"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"CPU app 15%, p95 alto y waits BD de I/O: qué hipótesis probarías.","en":"App CPU 15%, high p95 and DB I/O waits: what hypothesis would you test?"}},{"id":"retail-database-12","section":"retail-database","sectionLabel":{"es":"Retail · Oracle DB y PL/SQL","en":"Retail · Oracle DB and PL/SQL"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué verificarías de backup y restore antes de un cambio con datos Retail?","en":"What would you verify about backup and restore before a Retail data change?"},"options":[{"text":{"es":"Alcance, consistencia, RPO/RTO y restauración probada","en":"Scope, consistency, RPO/RTO and tested restoration"},"correct":true,"feedback":{"es":"Un archivo de backup existente no demuestra restore útil. Coordina BD, configuración, artefactos y estado de integración según alcance, con un punto consistente y plan de reconciliación. RPO tolera pérdida de datos; RTO define tiempo objetivo de recuperación. Verifica permisos, cifrado, retención y prueba de restore. En SaaS pide responsabilidades y garantías, no acceso root por defecto.","en":"An existing backup file does not prove a useful restore. Coordinate DB, configuration, artifacts and integration state under the scope, with a consistent point and reconciliation plan. RPO tolerates data loss; RTO defines target recovery time. Verify permissions, encryption, retention and restoration tests. In SaaS ask for responsibilities and guarantees rather than default root access."}},{"text":{"es":"Backup elimina necesidad de rollback plan","en":"Backup removes the need for a rollback plan"},"correct":false,"feedback":{"es":"Recuperar puede requerir más sistemas y controles.","en":"Recovery can require additional systems and checks."}},{"text":{"es":"Restaurar siempre equivale a cero pérdida","en":"Restoration always means zero loss"},"correct":false,"feedback":{"es":"Depende de punto recuperable y reconciliación.","en":"It depends on the recoverable point and reconciliation."}}],"explanation":{"es":"Un archivo de backup existente no demuestra restore útil. Coordina BD, configuración, artefactos y estado de integración según alcance, con un punto consistente y plan de reconciliación. RPO tolera pérdida de datos; RTO define tiempo objetivo de recuperación. Verifica permisos, cifrado, retención y prueba de restore. En SaaS pide responsabilidades y garantías, no acceso root por defecto.","en":"An existing backup file does not prove a useful restore. Coordinate DB, configuration, artifacts and integration state under the scope, with a consistent point and reconciliation plan. RPO tolerates data loss; RTO defines target recovery time. Verify permissions, encryption, retention and restoration tests. In SaaS ask for responsibilities and guarantees rather than default root access."},"flow":{"es":"Cambio > Backup consistente > Restore ensayado > RPO / RTO > Reconciliación","en":"Change > Consistent backup > Rehearsed restore > RPO / RTO > Reconciliation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué podría pasar si restauras BD a ayer pero conservas mensajes confirmados de hoy?","en":"What could happen if you restore the DB to yesterday but retain messages acknowledged today?"}},{"id":"retail-cloudnative-01","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"basic","kind":"concept","question":{"es":"¿Qué significa cloud native en este JD y qué debes confirmar?","en":"What does cloud native mean in this JD and what must you confirm?"},"options":[{"text":{"es":"Prácticas de operación con contenedores y automatización; confirmar plataforma y permisos","en":"Container and automation-based operations; confirm platform and permissions"},"correct":true,"feedback":{"es":"El JD menciona Kubernetes, Docker, GitLab y Object Storage como base deseable. Eso no demuestra qué producto Retail corre en pods ni qué distribución CNE usa. Pide diagrama, release y frontera de responsabilidad. Como ejemplo específico, Retail Home documenta arquitectura de contenedores en su guía next-generation; no generalices ese ejemplo a todos los módulos ni asumas que un cliente SaaS administra sus nodos.","en":"The JD lists Kubernetes, Docker, GitLab and Object Storage as desired foundations. That does not establish which Retail product runs in pods or which CNE distribution it uses. Ask for the diagram, release and responsibility boundary. As one specific example, Retail Home documents container architecture in its next-generation guide; do not generalize it to every module or assume SaaS customers administer nodes."}},{"text":{"es":"CNE siempre significa Oracle Linux OCNE","en":"CNE always means Oracle Linux OCNE"},"correct":false,"feedback":{"es":"La abreviatura del JD no identifica ese producto.","en":"The JD abbreviation does not identify that product."}},{"text":{"es":"Cloud native elimina bases de datos","en":"Cloud native removes databases"},"correct":false,"feedback":{"es":"Persistencia y otras dependencias siguen existiendo.","en":"Persistence and other dependencies remain."}}],"explanation":{"es":"El JD menciona Kubernetes, Docker, GitLab y Object Storage como base deseable. Eso no demuestra qué producto Retail corre en pods ni qué distribución CNE usa. Pide diagrama, release y frontera de responsabilidad. Como ejemplo específico, Retail Home documenta arquitectura de contenedores en su guía next-generation; no generalices ese ejemplo a todos los módulos ni asumas que un cliente SaaS administra sus nodos.","en":"The JD lists Kubernetes, Docker, GitLab and Object Storage as desired foundations. That does not establish which Retail product runs in pods or which CNE distribution it uses. Ask for the diagram, release and responsibility boundary. As one specific example, Retail Home documents container architecture in its next-generation guide; do not generalize it to every module or assume SaaS customers administer nodes."},"flow":{"es":"JD CNE > Producto / Release > Topología > Permisos > Runbook","en":"JD CNE > Product / Release > Topology > Permissions > Runbook"},"code":"","output":null,"source":"https://docs.oracle.com/cd/F16882_01/rh/pdf/2411010/next_gen_cloud_update_guide.pdf","retail":true,"followup":{"es":"Redacta cuatro preguntas para entender la plataforma CNE real.","en":"Write four questions to understand the actual CNE platform."},"diagram":"topology"},{"id":"retail-cloudnative-02","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"basic","kind":"concept","question":{"es":"¿Cómo se comparan OCI, AWS, Azure y Google Cloud para soporte?","en":"How do OCI, AWS, Azure and Google Cloud compare for support?"},"options":[{"text":{"es":"Comparten categorías de servicio, pero cambian nombres, permisos y operación","en":"They share service categories but differ in names, permissions and operations"},"correct":true,"feedback":{"es":"Aprende compute, red privada, load balancer, identidad, storage y monitoreo antes de memorizar catálogos. Ejemplos de compute: OCI Compute, EC2, Azure Virtual Machines y Compute Engine; redes: VCN, VPC, VNet y VPC. Transferir conceptos no equivale a experiencia productiva en todos. Elige OCI como ancla por tu CV y verifica comandos/políticas del proveedor real antes de actuar.","en":"Learn compute, private networking, load balancing, identity, storage and monitoring before memorizing catalogs. Compute examples include OCI Compute, EC2, Azure Virtual Machines and Compute Engine; networks include VCN, VPC, VNet and VPC. Concept transfer is not production experience in all of them. Use OCI as your CV anchor and verify actual provider commands/policies before acting."}},{"text":{"es":"Todos aceptan la misma política IAM","en":"They all accept identical IAM policies"},"correct":false,"feedback":{"es":"Lenguaje y alcance de políticas difieren.","en":"Policy language and scope differ."}},{"text":{"es":"Conocer nombres demuestra dominio operativo","en":"Knowing names proves operational mastery"},"correct":false,"feedback":{"es":"Necesitas pruebas y experiencia contextual.","en":"You need tests and contextual experience."}}],"explanation":{"es":"Aprende compute, red privada, load balancer, identidad, storage y monitoreo antes de memorizar catálogos. Ejemplos de compute: OCI Compute, EC2, Azure Virtual Machines y Compute Engine; redes: VCN, VPC, VNet y VPC. Transferir conceptos no equivale a experiencia productiva en todos. Elige OCI como ancla por tu CV y verifica comandos/políticas del proveedor real antes de actuar.","en":"Learn compute, private networking, load balancing, identity, storage and monitoring before memorizing catalogs. Compute examples include OCI Compute, EC2, Azure Virtual Machines and Compute Engine; networks include VCN, VPC, VNet and VPC. Concept transfer is not production experience in all of them. Use OCI as your CV anchor and verify actual provider commands/policies before acting."},"flow":{"es":"Concepto común > Servicio del proveedor > IAM / Red > Evidencia > Acción","en":"Common concept > Provider service > IAM / Network > Evidence > Action"},"code":"","output":null,"source":"https://docs.oracle.com/en-us/iaas/Content/GSG/Concepts/concepts-core.htm","retail":true,"followup":{"es":"Mapea compute, object storage y Kubernetes gestionado de dos clouds y declara brechas.","en":"Map compute, object storage and managed Kubernetes in two clouds and state gaps."}},{"id":"retail-cloudnative-03","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué capas revisarías entre usuario y pod en un Retail cloud native?","en":"What layers would you inspect between a user and a cloud-native Retail pod?"},"options":[{"text":{"es":"DNS/TLS, LB/Ingress, Service/Endpoint y aplicación/pod","en":"DNS/TLS, LB/Ingress, Service/Endpoint and application/pod"},"correct":true,"feedback":{"es":"El camino exacto depende del ingress/controller y red. Si un Service no tiene endpoints elegibles, un pod Running no basta: revisa labels, selectors y readiness. Aísla la capa con pruebas desde orígenes autorizados. No expongas un pod a Internet ni hagas port-forward como solución permanente. Correlaciona código HTTP y hora con eventos y logs de la instancia afectada.","en":"The actual path depends on the ingress/controller and network. If a Service has no eligible endpoints, a Running pod is insufficient: inspect labels, selectors and readiness. Isolate the layer with tests from authorized origins. Do not expose a pod to the Internet or treat port-forward as a permanent fix. Correlate HTTP code and time with events and logs from the affected instance."}},{"text":{"es":"Running equivale a Ready y sano","en":"Running equals Ready and healthy"},"correct":false,"feedback":{"es":"Readiness es una condición distinta.","en":"Readiness is a separate condition."}},{"text":{"es":"Eliminar NetworkPolicies para siempre","en":"Permanently remove NetworkPolicies"},"correct":false,"feedback":{"es":"Debilita aislamiento sin diagnosticar la regla.","en":"This weakens isolation without diagnosing the rule."}}],"explanation":{"es":"El camino exacto depende del ingress/controller y red. Si un Service no tiene endpoints elegibles, un pod Running no basta: revisa labels, selectors y readiness. Aísla la capa con pruebas desde orígenes autorizados. No expongas un pod a Internet ni hagas port-forward como solución p
