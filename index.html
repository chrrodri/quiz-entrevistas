release, OS, JDK, runtime, DB, required patches, licensing and deployment model. A certified matrix matters more than randomly installing recent components. Validate resources, network, accounts and the window with owners. Produce a checklist with evidence and blockers; an RMS 16 guide applies to that release, not universally to a cloud service."}},{"text":{"es":"Instalar antes de confirmar versiones","en":"Install before confirming versions"},"correct":false,"feedback":{"es":"Incompatibilidades pueden invalidar toda la instalación.","en":"Incompatibilities can invalidate the installation."}},{"text":{"es":"Copiar configuración productiva sin revisarla","en":"Copy production configuration without review"},"correct":false,"feedback":{"es":"Puedes conectar pruebas a producción o exponer secretos.","en":"You can connect tests to production or expose secrets."}}],"explanation":{"es":"Identifica producto/release, OS, JDK, runtime, BD, parches requeridos, licencias y modelo de despliegue. La matriz certificada importa más que instalar componentes recientes al azar. Valida recursos, red, cuentas y ventana con responsables. Produce una checklist con evidencia y bloqueadores; una guía de RMS 16 sirve para ese release, no como receta universal de un servicio cloud.","en":"Identify product/release, OS, JDK, runtime, DB, required patches, licensing and deployment model. A certified matrix matters more than randomly installing recent components. Validate resources, network, accounts and the window with owners. Produce a checklist with evidence and blockers; an RMS 16 guide applies to that release, not universally to a cloud service."},"flow":{"es":"Release > Matriz certificada > Prerrequisitos > Checklist > Instalación","en":"Release > Certified matrix > Prerequisites > Checklist > Installation"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Haz una checklist de ocho prerrequisitos y quién valida cada uno.","en":"Create an eight-item prerequisite checklist and identify each validator."}},{"id":"retail-environments-02","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"basic","kind":"command","question":{"es":"¿Cómo harías un inventario inicial de un host Linux Retail?","en":"How would you inventory a Retail Linux host?"},"options":[{"text":{"es":"Consultar OS, JDK, CPU, memoria, discos y sockets sin modificar el host","en":"Inspect OS, JDK, CPU, memory, disks and sockets without changing the host"},"correct":true,"feedback":{"es":"Usa consultas de lectura y registra hora, host y alcance. java -version informa el ejecutable de tu PATH, no garantiza el JDK del proceso WebLogic. Revisa el startup/configuration autorizado para confirmar JAVA_HOME real. df muestra capacidad por filesystem y df -i inodos. No publiques salidas que incluyan información sensible; contrasta inventario con certificación y sizing del entorno.","en":"Use read-only queries and record time, host and scope. java -version reports the executable on your PATH, not necessarily the JDK used by WebLogic. Check authorized startup/configuration to confirm the actual JAVA_HOME. df shows filesystem capacity and df -i inode usage. Do not publish sensitive output; compare inventory with environment certification and sizing."}},{"text":{"es":"Actualizar paquetes durante el inventario","en":"Update packages during inventory"},"correct":false,"feedback":{"es":"Cambiaría el entorno antes de evaluar compatibilidad.","en":"This changes the environment before assessing compatibility."}},{"text":{"es":"Revisar solamente hostname","en":"Check only hostname"},"correct":false,"feedback":{"es":"No informa recursos ni stack.","en":"It does not report resources or stack."}}],"explanation":{"es":"Usa consultas de lectura y registra hora, host y alcance. java -version informa el ejecutable de tu PATH, no garantiza el JDK del proceso WebLogic. Revisa el startup/configuration autorizado para confirmar JAVA_HOME real. df muestra capacidad por filesystem y df -i inodos. No publiques salidas que incluyan información sensible; contrasta inventario con certificación y sizing del entorno.","en":"Use read-only queries and record time, host and scope. java -version reports the executable on your PATH, not necessarily the JDK used by WebLogic. Check authorized startup/configuration to confirm the actual JAVA_HOME. df shows filesystem capacity and df -i inode usage. Do not publish sensitive output; compare inventory with environment certification and sizing."},"flow":{"es":"Host > Consultas de lectura > Runtime real > Capacidad > Inventario","en":"Host > Read-only queries > Actual runtime > Capacity > Inventory"},"code":"cat /etc/os-release\nuname -r\njava -version\nlscpu\nfree -h\ndf -h\ndf -i\nss -lnt","output":{"es":"Obtienes versión y capacidad observada; documenta el runtime realmente usado por la aplicación.","en":"You obtain observed versions and capacity; document the runtime actually used by the application."},"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"¿Cómo confirmarías el JDK de una JVM que no usa tu PATH?","en":"How would you confirm the JDK of a JVM that does not use your PATH?"}},{"id":"retail-environments-03","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué debe contener el mapa de conexiones de un ambiente Retail?","en":"What belongs in a Retail environment connection map?"},"options":[{"text":{"es":"Origen, destino, DNS, puerto, protocolo, certificado y dueño","en":"Source, destination, DNS, port, protocol, certificate and owner"},"correct":true,"feedback":{"es":"Documenta navegador a LB, LB a backend, backend a BD y servicios/colas/object storage que use el entorno. DNS resuelve nombres, routing elige camino, firewall autoriza y TLS verifica identidad/cifrado. Prueba desde el origen real: una conexión desde tu laptop no prueba la del pod o host. No uses puertos por memoria; confirma configuración y rutas permitidas del release.","en":"Document browser to LB, LB to backend, backend to DB and any services/queues/object storage used by the environment. DNS resolves names, routing selects paths, firewalls authorize and TLS verifies identity/encryption. Test from the actual origin: laptop connectivity does not prove pod or host connectivity. Do not rely on memorized ports; confirm configuration and allowed release routes."}},{"text":{"es":"Abrir todos los puertos para simplificar","en":"Open every port to simplify"},"correct":false,"feedback":{"es":"Viola mínimo privilegio y aumenta riesgo.","en":"This violates least privilege and increases risk."}},{"text":{"es":"Ping prueba JDBC y HTTPS completos","en":"Ping proves complete JDBC and HTTPS connectivity"},"correct":false,"feedback":{"es":"ICMP no valida esos protocolos ni credenciales.","en":"ICMP does not validate those protocols or credentials."}}],"explanation":{"es":"Documenta navegador a LB, LB a backend, backend a BD y servicios/colas/object storage que use el entorno. DNS resuelve nombres, routing elige camino, firewall autoriza y TLS verifica identidad/cifrado. Prueba desde el origen real: una conexión desde tu laptop no prueba la del pod o host. No uses puertos por memoria; confirma configuración y rutas permitidas del release.","en":"Document browser to LB, LB to backend, backend to DB and any services/queues/object storage used by the environment. DNS resolves names, routing selects paths, firewalls authorize and TLS verifies identity/encryption. Test from the actual origin: laptop connectivity does not prove pod or host connectivity. Do not rely on memorized ports; confirm configuration and allowed release routes."},"flow":{"es":"Origen real > DNS > Ruta / Firewall > TLS > Servicio","en":"Actual origin > DNS > Route / Firewall > TLS > Service"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Completa una matriz de cinco conexiones de una topología hipotética.","en":"Complete a five-connection matrix for a hypothetical topology."},"diagram":"topology"},{"id":"retail-environments-04","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué separarías entre DEV, QA/UAT y PROD?","en":"What would you separate between DEV, QA/UAT and PROD?"},"options":[{"text":{"es":"Datos, identidades, endpoints, secretos, capacidad y aprobación de cambios","en":"Data, identities, endpoints, secrets, capacity and change approval"},"correct":true,"feedback":{"es":"DEV permite desarrollo; QA verifica comportamiento; UAT valida negocio; PROD atiende operaciones reales. Los nombres no garantizan aislamiento. Revisa URLs, schemas, buckets, colas y cuentas para evitar escrituras cruzadas. Mantén configuración parametrizada y secretos fuera del artefacto. Usa datos sintéticos o sanitizados y controles antes de habilitar integraciones externas.","en":"DEV supports development; QA checks behavior; UAT validates business; PROD serves real operations. Names do not guarantee isolation. Check URLs, schemas, buckets, queues and accounts to avoid cross-environment writes. Keep configuration parameterized and secrets outside the artifact. Use synthetic or sanitized data and controls before enabling external integrations."}},{"text":{"es":"Solo cambia el nombre del servidor","en":"Only change the server name"},"correct":false,"feedback":{"es":"Referencias y credenciales pueden seguir apuntando a producción.","en":"References and credentials may still target production."}},{"text":{"es":"QA debe contener PII completa por defecto","en":"QA must contain full PII by default"},"correct":false,"feedback":{"es":"Requiere base legal y controles; usa minimización.","en":"This needs legal basis and controls; use minimization."}}],"explanation":{"es":"DEV permite desarrollo; QA verifica comportamiento; UAT valida negocio; PROD atiende operaciones reales. Los nombres no garantizan aislamiento. Revisa URLs, schemas, buckets, colas y cuentas para evitar escrituras cruzadas. Mantén configuración parametrizada y secretos fuera del artefacto. Usa datos sintéticos o sanitizados y controles antes de habilitar integraciones externas.","en":"DEV supports development; QA checks behavior; UAT validates business; PROD serves real operations. Names do not guarantee isolation. Check URLs, schemas, buckets, queues and accounts to avoid cross-environment writes. Keep configuration parameterized and secrets outside the artifact. Use synthetic or sanitized data and controls before enabling external integrations."},"flow":{"es":"Artefacto común > Configuración por ambiente > Secretos separados > Validación > Promoción","en":"Common artifact > Per-environment configuration > Separate secrets > Validation > Promotion"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Detecta los riesgos de una copia QA con endpoint de pagos y bucket de PROD.","en":"Identify risks in a QA copy retaining production payment endpoints and bucket."}},{"id":"retail-environments-05","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué orden lógico seguiría una instalación clásica autorizada?","en":"What logical order would an authorized classic installation follow?"},"options":[{"text":{"es":"Prerrequisitos, BD, runtime/dominio, recursos, aplicación y validación","en":"Prerequisites, DB, runtime/domain, resources, application and validation"},"correct":true,"feedback":{"es":"La guía específica determina el orden exacto y scripts permitidos. A nivel conceptual prepara infraestructura y esquemas, runtime/dominio, datasources y recursos de integración, despliega el artefacto y configura endpoints. Conserva logs e inventario de versiones. Valida una función que use BD e interfaces, no solo la página de login. Si falla un prerequisito, resuélvelo antes de encadenar pasos parcialmente exitosos.","en":"The specific guide determines the exact order and permitted scripts. Conceptually prepare infrastructure and schemas, runtime/domain, datasources and integration resources, deploy the artifact and configure endpoints. Retain logs and version inventory. Validate a function using the DB and interfaces, not just login. If a prerequisite fails, resolve it before chaining partially successful steps."}},{"text":{"es":"Deploy primero y crear BD después siempre","en":"Always deploy first and create the DB afterward"},"correct":false,"feedback":{"es":"El orden depende del instalador y dependencias.","en":"The order depends on installer and dependencies."}},{"text":{"es":"Saltar warnings sin documentarlos","en":"Skip warnings without recording them"},"correct":false,"feedback":{"es":"Puedes ocultar un bloqueo de soporte o funcionalidad.","en":"You can hide a support or functionality blocker."}}],"explanation":{"es":"La guía específica determina el orden exacto y scripts permitidos. A nivel conceptual prepara infraestructura y esquemas, runtime/dominio, datasources y recursos de integración, despliega el artefacto y configura endpoints. Conserva logs e inventario de versiones. Valida una función que use BD e interfaces, no solo la página de login. Si falla un prerequisito, resuélvelo antes de encadenar pasos parcialmente exitosos.","en":"The specific guide determines the exact order and permitted scripts. Conceptually prepare infrastructure and schemas, runtime/domain, datasources and integration resources, deploy the artifact and configure endpoints. Retain logs and version inventory. Validate a function using the DB and interfaces, not just login. If a prerequisite fails, resolve it before chaining partially successful steps."},"flow":{"es":"Infra / BD > Runtime > Recursos > Artefacto > Smoke test","en":"Infra / DB > Runtime > Resources > Artifact > Smoke test"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Para cada etapa explica evidencia de éxito y condición de pausa.","en":"For every stage explain evidence of success and a stop condition."},"diagram":"deployment"},{"id":"retail-environments-06","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué diferencia hay entre ORACLE_HOME, DOMAIN_HOME y schema?","en":"What differs between ORACLE_HOME, DOMAIN_HOME and a schema?"},"options":[{"text":{"es":"Binarios de software, configuración de dominio y objetos lógicos de BD","en":"Software binaries, domain configuration and logical DB objects"},"correct":true,"feedback":{"es":"En un stack compatible, ORACLE_HOME contiene software instalado y DOMAIN_HOME configura un dominio WebLogic; un schema pertenece a Oracle Database. No son intercambiables ni todos los productos usan idénticos directorios. Documenta homes, propietarios, inventario y dependencias. Un backup de DOMAIN_HOME no sustituye backup de BD, y copiar binarios no migra los datos ni valida un cambio de schema.","en":"In a compatible stack, ORACLE_HOME contains installed software and DOMAIN_HOME configures a WebLogic domain; a schema belongs to Oracle Database. They are not interchangeable, and products may use different directory layouts. Document homes, owners, inventory and dependencies. A DOMAIN_HOME backup does not replace a DB backup, and copying binaries neither migrates data nor validates a schema change."}},{"text":{"es":"Schema es un directorio Linux","en":"A schema is a Linux directory"},"correct":false,"feedback":{"es":"Es un conjunto lógico de objetos de BD.","en":"It is a logical set of DB objects."}},{"text":{"es":"Respaldar solo el EAR cubre todo","en":"Backing up only the EAR covers everything"},"correct":false,"feedback":{"es":"Faltan configuración, secretos gestionados, estado y BD según alcance.","en":"Configuration, managed secrets, state and DB may also be needed."}}],"explanation":{"es":"En un stack compatible, ORACLE_HOME contiene software instalado y DOMAIN_HOME configura un dominio WebLogic; un schema pertenece a Oracle Database. No son intercambiables ni todos los productos usan idénticos directorios. Documenta homes, propietarios, inventario y dependencias. Un backup de DOMAIN_HOME no sustituye backup de BD, y copiar binarios no migra los datos ni valida un cambio de schema.","en":"In a compatible stack, ORACLE_HOME contains installed software and DOMAIN_HOME configures a WebLogic domain; a schema belongs to Oracle Database. They are not interchangeable, and products may use different directory layouts. Document homes, owners, inventory and dependencies. A DOMAIN_HOME backup does not replace a DB backup, and copying binaries neither migrates data nor validates a schema change."},"flow":{"es":"Software home > Dominio > Deployments > Datasource > Schema","en":"Software home > Domain > Deployments > Datasource > Schema"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Explica qué respaldarías ante cambio de binarios, dominio y esquema.","en":"Explain what you would back up for binary, domain and schema changes."}},{"id":"retail-environments-07","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué comprobarías en el usuario instalador y permisos de archivos?","en":"What would you check for the installer account and file permissions?"},"options":[{"text":{"es":"Propiedad y permisos mínimos sobre rutas requeridas por la guía","en":"Ownership and minimum permissions on guide-required paths"},"correct":true,"feedback":{"es":"El instalador necesita acceso a directorios concretos, no chmod 777 global. Confirma usuario/grupo, umask, espacio, ejecución y escritura donde corresponde. Después protege logs, archivos de respuesta y configuraciones porque pueden contener secretos. Si SELinux o políticas del host bloquean una acción, analiza evidencia con administración de sistema; no desactives controles de seguridad como arreglo permanente.","en":"The installer needs access to specific directories, not global chmod 777. Confirm user/group, umask, space, execution and required write access. Protect logs, response files and configuration afterward because they may contain secrets. If SELinux or host policies block an action, examine evidence with system administration; do not disable security controls as a permanent fix."}},{"text":{"es":"chmod -R 777 sobre todo Oracle","en":"Run chmod -R 777 over all Oracle files"},"correct":false,"feedback":{"es":"Expone software y secretos; tampoco diagnostica el bloqueo.","en":"This exposes software and secrets and does not diagnose the block."}},{"text":{"es":"Ejecutar siempre toda la aplicación como root","en":"Always run the entire application as root"},"correct":false,"feedback":{"es":"Eleva privilegios innecesariamente.","en":"It unnecessarily elevates privileges."}}],"explanation":{"es":"El instalador necesita acceso a directorios concretos, no chmod 777 global. Confirma usuario/grupo, umask, espacio, ejecución y escritura donde corresponde. Después protege logs, archivos de respuesta y configuraciones porque pueden contener secretos. Si SELinux o políticas del host bloquean una acción, analiza evidencia con administración de sistema; no desactives controles de seguridad como arreglo permanente.","en":"The installer needs access to specific directories, not global chmod 777. Confirm user/group, umask, space, execution and required write access. Protect logs, response files and configuration afterward because they may contain secrets. If SELinux or host policies block an action, examine evidence with system administration; do not disable security controls as a permanent fix."},"flow":{"es":"Cuenta > Rutas requeridas > Permisos mínimos > Instalación > Protección","en":"Account > Required paths > Minimum permissions > Installation > Protection"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"¿Qué buscarías si el instalador falla con permission denied?","en":"What would you inspect if an installer fails with permission denied?"}},{"id":"retail-environments-08","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo promoverías un EAR/WAR de QA a producción?","en":"How would you promote an EAR/WAR from QA to production?"},"options":[{"text":{"es":"Usar un artefacto inmutable probado con configuración y aprobación de PROD","en":"Use a tested immutable artifact with production configuration and approval"},"correct":true,"feedback":{"es":"WAR empaqueta una aplicación web; EAR agrupa componentes enterprise en stacks compatibles. Construye una vez, registra versión/digest, prueba y promueve el mismo artefacto. Confirma targets, dependencias, configuración y compatibilidad de schema. Un redeploy puede interrumpir sesiones o trabajo en curso; planifica drenado, ventana y rollback según producto. No sustituyas un deployment soportado por copiar archivos improvisadamente.","en":"WAR packages a web application; EAR groups enterprise components in compatible stacks. Build once, record version/digest, test and promote the same artifact. Confirm targets, dependencies, configuration and schema compatibility. Redeployment may interrupt sessions or in-flight work; plan draining, a window and rollback under the product procedure. Do not replace supported deployment with improvised file copying."}},{"text":{"es":"Recompilar distinto dentro de PROD","en":"Rebuild differently inside production"},"correct":false,"feedback":{"es":"Pierdes equivalencia con lo probado.","en":"You lose equivalence with the tested artifact."}},{"text":{"es":"Cambiar schema sin revisar rollback","en":"Change the schema without checking rollback"},"correct":false,"feedback":{"es":"Una reversión de binario puede ser incompatible con el schema nuevo.","en":"A binary rollback may be incompatible with the new schema."}}],"explanation":{"es":"WAR empaqueta una aplicación web; EAR agrupa componentes enterprise en stacks compatibles. Construye una vez, registra versión/digest, prueba y promueve el mismo artefacto. Confirma targets, dependencias, configuración y compatibilidad de schema. Un redeploy puede interrumpir sesiones o trabajo en curso; planifica drenado, ventana y rollback según producto. No sustituyas un deployment soportado por copiar archivos improvisadamente.","en":"WAR packages a web application; EAR groups enterprise components in compatible stacks. Build once, record version/digest, test and promote the same artifact. Confirm targets, dependencies, configuration and schema compatibility. Redeployment may interrupt sessions or in-flight work; plan draining, a window and rollback under the product procedure. Do not replace supported deployment with improvised file copying."},"flow":{"es":"Build > Artefacto firmado / digest > QA > Aprobación > Deploy > Verificación","en":"Build > Signed artifact / digest > QA > Approval > Deploy > Verification"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"¿Qué compararías si solo un Managed Server ejecuta el release anterior?","en":"What would you compare if only one Managed Server runs the previous release?"},"diagram":"deployment"},{"id":"retail-environments-09","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué es configuration drift en ambientes Retail?","en":"What is configuration drift in Retail environments?"},"options":[{"text":{"es":"Diferencias no controladas frente a la configuración aprobada","en":"Uncontrolled differences from approved configuration"},"correct":true,"feedback":{"es":"Un nodo con timeout, truststore o datasource diferente puede fallar mientras otro funciona. Compara fuentes autorizadas, versiones, targets y parámetros sin divulgar secretos. Controla cambios mediante revisión y configuración declarativa donde aplique. Distingue overrides legítimos de cambios accidentales. En el RCA registra qué diferencia altera el comportamiento, no solamente que dos archivos son distintos.","en":"A node with a different timeout, truststore or datasource may fail while another works. Compare authorized sources, versions, targets and parameters without exposing secrets. Control changes through review and declarative configuration where applicable. Distinguish legitimate overrides from accidental changes. In the RCA identify the difference affecting behavior, not just that two files differ."}},{"text":{"es":"Igualar archivos sin revisar propósito","en":"Make files identical without understanding purpose"},"correct":false,"feedback":{"es":"Overrides por ambiente pueden ser necesarios.","en":"Environment-specific overrides may be necessary."}},{"text":{"es":"Cambiar parámetros en consola sin registro","en":"Change console parameters without records"},"correct":false,"feedback":{"es":"Genera deriva y dificulta auditoría/RCA.","en":"This creates drift and complicates audit/RCA."}}],"explanation":{"es":"Un nodo con timeout, truststore o datasource diferente puede fallar mientras otro funciona. Compara fuentes autorizadas, versiones, targets y parámetros sin divulgar secretos. Controla cambios mediante revisión y configuración declarativa donde aplique. Distingue overrides legítimos de cambios accidentales. En el RCA registra qué diferencia altera el comportamiento, no solamente que dos archivos son distintos.","en":"A node with a different timeout, truststore or datasource may fail while another works. Compare authorized sources, versions, targets and parameters without exposing secrets. Control changes through review and declarative configuration where applicable. Distinguish legitimate overrides from accidental changes. In the RCA identify the difference affecting behavior, not just that two files differ."},"flow":{"es":"Baseline > Comparación > Diferencia relevante > Prueba > Reconciliación","en":"Baseline > Comparison > Relevant difference > Test > Reconciliation"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Diseña una comparación segura de configuración excluyendo secretos.","en":"Design a safe configuration comparison excluding secrets."}},{"id":"retail-environments-10","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"scenario","question":{"es":"¿Qué validarías después de instalar Retail además del login?","en":"What would you validate after installing Retail besides login?"},"options":[{"text":{"es":"Un recorrido de negocio autorizado y dependencias observadas","en":"An authorized business journey and observed dependencies"},"correct":true,"feedback":{"es":"Login prueba solo parte de la cadena. En QA usa datos de prueba: consulta un item, comprueba conexión BD y verifica una integración o batch representativo bajo el plan funcional. Mide errores y tiempos, valida roles y destino. Documenta evidencia y criterios de aceptación. No crees compras o ajustes en PROD como smoke test improvisado; el recorrido debe ser autorizado y no destructivo.","en":"Login tests only part of the chain. In QA use test data: query an item, check DB connectivity and verify a representative integration or batch under the functional plan. Measure errors and time, validate roles and destination. Document evidence and acceptance criteria. Do not create purchases or adjustments in production as an improvised smoke test; the journey must be authorized and non-destructive."}},{"text":{"es":"Solo comprobar HTTP 200 de homepage","en":"Only check homepage HTTP 200"},"correct":false,"feedback":{"es":"No cubre recursos ni flujo comercial.","en":"It does not cover resources or the business flow."}},{"text":{"es":"Crear transacciones reales sin autorización","en":"Create real transactions without authorization"},"correct":false,"feedback":{"es":"Afecta datos y negocio.","en":"This affects data and business."}}],"explanation":{"es":"Login prueba solo parte de la cadena. En QA usa datos de prueba: consulta un item, comprueba conexión BD y verifica una integración o batch representativo bajo el plan funcional. Mide errores y tiempos, valida roles y destino. Documenta evidencia y criterios de aceptación. No crees compras o ajustes en PROD como smoke test improvisado; el recorrido debe ser autorizado y no destructivo.","en":"Login tests only part of the chain. In QA use test data: query an item, check DB connectivity and verify a representative integration or batch under the functional plan. Measure errors and time, validate roles and destination. Document evidence and acceptance criteria. Do not create purchases or adjustments in production as an improvised smoke test; the journey must be authorized and non-destructive."},"flow":{"es":"Login > Función representativa > BD / Interface > Resultado > Aceptación","en":"Login > Representative function > DB / Interface > Outcome > Acceptance"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Define cinco criterios observables para aceptar un ambiente QA.","en":"Define five observable acceptance criteria for a QA environment."},"evidence":{"es":"Caso hipotético: login responde, pero búsqueda de artículos devuelve error del datasource.","en":"Hypothetical case: login responds but item search returns a datasource error."}},{"id":"retail-environments-11","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo prepararías un clon de ambiente sin afectar al original?","en":"How would you prepare an environment clone without affecting the original?"},"options":[{"text":{"es":"Aislar primero, sanitizar y cambiar referencias antes de habilitar procesos","en":"Isolate first, sanitize and change references before enabling processes"},"correct":true,"feedback":{"es":"Restaurar datos no crea automáticamente un ambiente seguro. Bloquea schedulers, notificaciones, pagos e interfaces de salida antes de habilitar el clon. Cambia DNS/endpoints, identidades, secretos, buckets y colas; sanitiza datos según política. Valida incompatibilidades de versión y claves de cifrado con el runbook. Conserva trazabilidad del restore y prueba que QA no escribe ni envía información a PROD.","en":"Restoring data does not automatically create a safe environment. Block schedulers, notifications, payments and outbound interfaces before enabling the clone. Change DNS/endpoints, identities, secrets, buckets and queues; sanitize data under policy. Validate version and encryption-key compatibility using the runbook. Preserve restore traceability and prove QA neither writes nor sends information to production."}},{"text":{"es":"Arrancar todos los jobs inmediatamente","en":"Start every job immediately"},"correct":false,"feedback":{"es":"Puede reenviar pedidos, pagos o correos reales.","en":"This can resend real orders, payments or emails."}},{"text":{"es":"Cambiar solo la etiqueta QA","en":"Only change the QA label"},"correct":false,"feedback":{"es":"No aísla conexiones ni credenciales.","en":"It does not isolate connections or credentials."}}],"explanation":{"es":"Restaurar datos no crea automáticamente un ambiente seguro. Bloquea schedulers, notificaciones, pagos e interfaces de salida antes de habilitar el clon. Cambia DNS/endpoints, identidades, secretos, buckets y colas; sanitiza datos según política. Valida incompatibilidades de versión y claves de cifrado con el runbook. Conserva trazabilidad del restore y prueba que QA no escribe ni envía información a PROD.","en":"Restoring data does not automatically create a safe environment. Block schedulers, notifications, payments and outbound interfaces before enabling the clone. Change DNS/endpoints, identities, secrets, buckets and queues; sanitize data under policy. Validate version and encryption-key compatibility using the runbook. Preserve restore traceability and prove QA neither writes nor sends information to production."},"flow":{"es":"Restore aislado > Sanitización > Nuevas referencias > Controles > Habilitación","en":"Isolated restore > Sanitization > New references > Checks > Enablement"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Enumera efectos externos que una copia podría disparar por accidente.","en":"List external effects a copy could accidentally trigger."}},{"id":"retail-environments-12","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué evidencia entregarías al cerrar una instalación para desarrollo y QA?","en":"What evidence would you provide when handing an installation to development and QA?"},"options":[{"text":{"es":"Inventario, topología, pruebas, accesos, límites y runbooks actualizados","en":"Inventory, topology, tests, access, limits and updated runbooks"},"correct":true,"feedback":{"es":"Un handover operativo incluye URLs y dueños, versiones/digests, configuración no secreta, dependencias, smoke tests, monitoreo y procedimientos de arranque/parada aprobados. Documenta problemas conocidos y escalación. El receptor debe poder verificar salud y reproducir un diagnóstico sin depender de tu memoria. Comparte secretos solo mediante el mecanismo aprobado, nunca pegados en una wiki.","en":"An operational handover includes URLs and owners, versions/digests, non-secret configuration, dependencies, smoke tests, monitoring and approved startup/shutdown procedures. Document known issues and escalation. The recipient should verify health and reproduce a diagnosis without relying on your memory. Share secrets only through the approved mechanism, never pasted into a wiki."}},{"text":{"es":"Solo enviar credenciales por chat","en":"Only send credentials through chat"},"correct":false,"feedback":{"es":"No cubre operación y puede exponer secretos.","en":"It does not cover operations and may expose secrets."}},{"text":{"es":"Declarar listo sin pruebas documentadas","en":"Declare readiness without recorded tests"},"correct":false,"feedback":{"es":"Falta evidencia repetible.","en":"Repeatable evidence is missing."}}],"explanation":{"es":"Un handover operativo incluye URLs y dueños, versiones/digests, configuración no secreta, dependencias, smoke tests, monitoreo y procedimientos de arranque/parada aprobados. Documenta problemas conocidos y escalación. El receptor debe poder verificar salud y reproducir un diagnóstico sin depender de tu memoria. Comparte secretos solo mediante el mecanismo aprobado, nunca pegados en una wiki.","en":"An operational handover includes URLs and owners, versions/digests, non-secret configuration, dependencies, smoke tests, monitoring and approved startup/shutdown procedures. Document known issues and escalation. The recipient should verify health and reproduce a diagnosis without relying on your memory. Share secrets only through the approved mechanism, never pasted into a wiki."},"flow":{"es":"Inventario > Validación > Runbook > Revisión del receptor > Handover","en":"Inventory > Validation > Runbook > Recipient review > Handover"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Redacta el índice de una página de servicio que QA pueda usar mañana.","en":"Write a service-page outline that QA could use tomorrow."}},{"id":"retail-middleware-01","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué aporta un cluster WebLogic a una aplicación Retail?","en":"What does a WebLogic cluster provide for a Retail application?"},"options":[{"text":{"es":"Instancias coordinadas para capacidad y disponibilidad con límites de estado","en":"Coordinated instances for capacity and availability with state constraints"},"correct":true,"feedback":{"es":"Un cluster no convierte automáticamente cualquier aplicación en HA. Verifica despliegue homogéneo, sesiones, recursos compartidos, routing y dependencias. Si los dos nodos usan una única BD sin resiliencia, sigue existiendo ese punto de falla. Prueba pérdida controlada de una instancia en QA y observa errores, sesiones y recuperación antes de prometer cero downtime.","en":"A cluster does not automatically make every application highly available. Verify consistent deployment, sessions, shared resources, routing and dependencies. If two nodes use a non-resilient single DB, that failure point remains. Test controlled instance loss in QA and observe errors, sessions and recovery before promising zero downtime."}},{"text":{"es":"Dos nodos garantizan cero pérdida de sesión","en":"Two nodes guarantee zero session loss"},"correct":false,"feedback":{"es":"Depende de replicación, aplicación y configuración.","en":"It depends on replication, application and configuration."}},{"text":{"es":"Cluster sustituye backup y DR","en":"A cluster replaces backup and DR"},"correct":false,"feedback":{"es":"Disponibilidad no protege por sí sola contra corrupción o desastre.","en":"Availability alone does not protect against corruption or disaster."}}],"explanation":{"es":"Un cluster no convierte automáticamente cualquier aplicación en HA. Verifica despliegue homogéneo, sesiones, recursos compartidos, routing y dependencias. Si los dos nodos usan una única BD sin resiliencia, sigue existiendo ese punto de falla. Prueba pérdida controlada de una instancia en QA y observa errores, sesiones y recuperación antes de prometer cero downtime.","en":"A cluster does not automatically make every application highly available. Verify consistent deployment, sessions, shared resources, routing and dependencies. If two nodes use a non-resilient single DB, that failure point remains. Test controlled instance loss in QA and observe errors, sessions and recovery before promising zero downtime."},"flow":{"es":"LB > Nodos del cluster > Estado / Recursos > Dependencias > Prueba de failover","en":"LB > Cluster nodes > State / Resources > Dependencies > Failover test"},"code":"","output":null,"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"Dibuja dos nodos y marca los puntos de falla que el cluster no elimina.","en":"Draw two nodes and mark failure points not eliminated by clustering."},"diagram":"topology"},{"id":"retail-middleware-02","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué diferencia hay entre load balancing y replicación de sesión?","en":"What differs between load balancing and session replication?"},"options":[{"text":{"es":"Balanceo distribuye peticiones; replicación protege estado compatible","en":"Balancing distributes requests; replication protects compatible state"},"correct":true,"feedback":{"es":"Sticky sessions mantienen un usuario en una instancia, pero no equivalen a replicar su estado. Si ese nodo cae, el resultado depende de configuración y diseño de aplicación. Verifica cookies/routing, tipos de sesión y prueba de failover. No habilites parámetros por intuición: algunas aplicaciones externalizan estado y otras requieren configuración certificada específica.","en":"Sticky sessions keep a user on an instance but do not replicate its state. If that node fails, the outcome depends on application configuration and design. Check cookies/routing, session types and failover tests. Do not enable parameters by intuition: some applications externalize state; others require specific certified settings."}},{"text":{"es":"Sticky significa copia automática de sesiones","en":"Sticky means automatic session copying"},"correct":false,"feedback":{"es":"Afinidad y replicación son mecanismos distintos.","en":"Affinity and replication are different mechanisms."}},{"text":{"es":"El LB almacena siempre la sesión de negocio","en":"The LB always stores the business session"},"correct":false,"feedback":{"es":"No es una propiedad universal del balanceador.","en":"That is not a universal load-balancer property."}}],"explanation":{"es":"Sticky sessions mantienen un usuario en una instancia, pero no equivalen a replicar su estado. Si ese nodo cae, el resultado depende de configuración y diseño de aplicación. Verifica cookies/routing, tipos de sesión y prueba de failover. No habilites parámetros por intuición: algunas aplicaciones externalizan estado y otras requieren configuración certificada específica.","en":"Sticky sessions keep a user on an instance but do not replicate its state. If that node fails, the outcome depends on application configuration and design. Check cookies/routing, session types and failover tests. Do not enable parameters by intuition: some applications externalize state; others require specific certified settings."},"flow":{"es":"Petición > LB / Afinidad > Nodo > Estado de sesión > Failover","en":"Request > LB / Affinity > Node > Session state > Failover"},"code":"","output":null,"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"Un usuario pierde login al fallar nodo A: explica dos hipótesis y pruebas.","en":"A user loses login when node A fails: explain two hypotheses and tests."}},{"id":"retail-middleware-03","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué es JDBC y cómo se relaciona con JNDI en Retail?","en":"What is JDBC and how does it relate to JNDI in Retail?"},"options":[{"text":{"es":"JDBC accede a BD; JNDI permite localizar recursos configurados","en":"JDBC accesses databases; JNDI locates configured resources"},"correct":true,"feedback":{"es":"JDBC es una API Java de acceso a BD. Una aplicación puede buscar un datasource por nombre JNDI y obtener una conexión del pool. Error de nombre/target no es igual que autenticación BD, listener o query lenta. Sigue la cadena lookup, datasource, driver, red, autenticación y SQL. Confirma el recurso usado por el deployment; probar otro datasource sano no prueba el de la aplicación.","en":"JDBC is a Java database-access API. An application may look up a datasource by JNDI name and obtain a pooled connection. A name/target error differs from DB authentication, listener failure or slow SQL. Follow lookup, datasource, driver, network, authentication and SQL. Confirm the resource used by the deployment; testing another healthy datasource does not prove the application one."}},{"text":{"es":"JNDI ejecuta directamente todo SQL","en":"JNDI directly executes all SQL"},"correct":false,"feedback":{"es":"Localiza recursos; JDBC realiza acceso a BD.","en":"It locates resources; JDBC performs DB access."}},{"text":{"es":"JDBC es una cola de mensajes","en":"JDBC is a message queue"},"correct":false,"feedback":{"es":"JMS cubre mensajería en este stack.","en":"JMS covers messaging in this stack."}}],"explanation":{"es":"JDBC es una API Java de acceso a BD. Una aplicación puede buscar un datasource por nombre JNDI y obtener una conexión del pool. Error de nombre/target no es igual que autenticación BD, listener o query lenta. Sigue la cadena lookup, datasource, driver, red, autenticación y SQL. Confirma el recurso usado por el deployment; probar otro datasource sano no prueba el de la aplicación.","en":"JDBC is a Java database-access API. An application may look up a datasource by JNDI name and obtain a pooled connection. A name/target error differs from DB authentication, listener failure or slow SQL. Follow lookup, datasource, driver, network, authentication and SQL. Confirm the resource used by the deployment; testing another healthy datasource does not prove the application one."},"flow":{"es":"Aplicación > Lookup JNDI > Datasource > Pool JDBC > Oracle DB","en":"Application > JNDI lookup > Datasource > JDBC pool > Oracle DB"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12212/wls/JDBCA/manage.htm","retail":true,"followup":{"es":"Distingue NameNotFound, fallo de conexión y timeout SQL con una prueba para cada uno.","en":"Distinguish NameNotFound, connection failure and SQL timeout with one test each."}},{"id":"retail-middleware-04","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo dimensionarías pools JDBC de varios nodos sin saturar Oracle DB?","en":"How would you size JDBC pools across nodes without saturating Oracle DB?"},"options":[{"text":{"es":"Medir demanda, tiempo de conexión y límite agregado de BD antes de ajustar","en":"Measure demand, connection holding time and aggregate DB limits before tuning"},"correct":true,"feedback":{"es":"Cuatro nodos con capacidad 100 pueden exigir hasta 400 conexiones, además de batch y otros clientes. Mide activas, espera por reserva, duración SQL y presupuesto de sesiones. Aproxima concurrencia desde throughput y tiempo de uso, luego valida con carga real. Aumentar pool puede mover el cuello a BD. Coordina con DBA y prueba un cambio por vez con criterios de reversión.","en":"Four nodes with capacity 100 can demand up to 400 connections, plus batch and other clients. Measure active connections, reserve waits, SQL duration and session budget. Estimate concurrency from throughput and holding time, then validate with real load. Increasing pools may move the bottleneck to the DB. Coordinate with the DBA and test one change at a time with reversal criteria."}},{"text":{"es":"Poner un máximo infinito en todos los nodos","en":"Set an unlimited maximum on every node"},"correct":false,"feedback":{"es":"Puede agotar sesiones y memoria de BD.","en":"It can exhaust DB sessions and memory."}},{"text":{"es":"Dimensionar solo un nodo ignorando batch","en":"Size one node while ignoring batch"},"correct":false,"feedback":{"es":"Omite consumo agregado y picos.","en":"This omits aggregate usage and peaks."}}],"explanation":{"es":"Cuatro nodos con capacidad 100 pueden exigir hasta 400 conexiones, además de batch y otros clientes. Mide activas, espera por reserva, duración SQL y presupuesto de sesiones. Aproxima concurrencia desde throughput y tiempo de uso, luego valida con carga real. Aumentar pool puede mover el cuello a BD. Coordina con DBA y prueba un cambio por vez con criterios de reversión.","en":"Four nodes with capacity 100 can demand up to 400 connections, plus batch and other clients. Measure active connections, reserve waits, SQL duration and session budget. Estimate concurrency from throughput and holding time, then validate with real load. Increasing pools may move the bottleneck to the DB. Coordinate with the DBA and test one change at a time with reversal criteria."},"flow":{"es":"Demanda > Tiempo por conexión > Pools agregados > Capacidad BD > Load test","en":"Demand > Connection holding time > Aggregate pools > DB capacity > Load test"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12212/wls/JDBCA/manage.htm","retail":true,"followup":{"es":"Calcula 4 × 80 más 120 conexiones batch; explica por qué el máximo no es carga real.","en":"Calculate 4 × 80 plus 120 batch connections; explain why maximum is not actual load."},"evidence":{"es":"Caso hipotético: 4 Managed Servers; pool máximo 100; BD tiene presupuesto restante de 250 sesiones.","en":"Hypothetical case: 4 Managed Servers; maximum pool 100; the DB has 250 sessions of remaining budget."}},{"id":"retail-middleware-05","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"basic","kind":"concept","question":{"es":"¿Cómo se diferencian queue y topic JMS?","en":"How do a JMS queue and topic differ?"},"options":[{"text":{"es":"Queue distribuye mensajes entre consumidores; topic publica a suscripciones","en":"A queue distributes messages among consumers; a topic publishes to subscriptions"},"correct":true,"feedback":{"es":"JMS es Java Message Service. En una queue, un mensaje se entrega para consumo a un consumidor a la vez, con posible redelivery según transacción/ack. En un topic, suscripciones reciben publicaciones según configuración. Durabilidad, persistencia y ack son propiedades separadas. No confundas consumo por competidores con broadcast ni asumas que entrega implica commit del proceso de negocio.","en":"JMS means Java Message Service. A queue delivers a message to one consumer at a time, with possible redelivery under transaction/ack behavior. A topic publishes to subscriptions under configuration. Durability, persistence and acknowledgment are separate properties. Do not confuse competing consumers with broadcast or assume delivery implies a committed business process."}},{"text":{"es":"Cada consumidor de queue recibe copia de todo","en":"Every queue consumer gets a copy of everything"},"correct":false,"feedback":{"es":"Eso confunde distribución con publicación a suscripciones.","en":"This confuses distribution with publishing to subscriptions."}},{"text":{"es":"JMS garantiza ausencia total de duplicados comerciales","en":"JMS guarantees no business duplicates at all"},"correct":false,"feedback":{"es":"Reintentos y límites transaccionales requieren controles de idempotencia.","en":"Retries and transaction boundaries require idempotency controls."}}],"explanation":{"es":"JMS es Java Message Service. En una queue, un mensaje se entrega para consumo a un consumidor a la vez, con posible redelivery según transacción/ack. En un topic, suscripciones reciben publicaciones según configuración. Durabilidad, persistencia y ack son propiedades separadas. No confundas consumo por competidores con broadcast ni asumas que entrega implica commit del proceso de negocio.","en":"JMS means Java Message Service. A queue delivers a message to one consumer at a time, with possible redelivery under transaction/ack behavior. A topic publishes to subscriptions under configuration. Durability, persistence and acknowledgment are separate properties. Do not confuse competing consumers with broadcast or assume delivery implies a committed business process."},"flow":{"es":"Producer > Queue o Topic > Consumidor / Suscripción > Ack > Resultado","en":"Producer > Queue or Topic > Consumer / Subscription > Ack > Outcome"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12212/wls/JMSPG/overview.htm","retail":true,"followup":{"es":"Dibuja una queue con dos consumidores y un topic con dos suscripciones.","en":"Draw one queue with two consumers and one topic with two subscriptions."},"diagram":"messaging"},{"id":"retail-middleware-06","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"advanced","kind":"concept","question":{"es":"¿Qué protege un persistent store JMS y qué no protege?","en":"What does a JMS persistent store protect and not protect?"},"options":[{"text":{"es":"Persistencia configurada de mensajes; no sustituye backup ni validación comercial","en":"Configured message persistence; it does not replace backups or business validation"},"correct":true,"feedback":{"es":"Un store puede usar archivos o JDBC según configuración. Revisa salud, capacidad, I/O y recuperación/migración autorizada. Mensajes no persistentes y suscripciones no durables tienen otra semántica. Persistir un mensaje no garantiza que una BD externa y una llamada HTTP se confirmen atómicamente. Nunca borres stores para liberar espacio sin plan: puedes perder mensajes o impedir recuperación.","en":"A store may use files or JDBC under configuration. Check health, capacity, I/O and approved recovery/migration. Nonpersistent messages and nondurable subscriptions have different semantics. Persisting a message does not ensure an external DB and HTTP call commit atomically. Never delete stores to free space without a plan: you can lose messages or prevent recovery."}},{"text":{"es":"Borrar el store es un reinicio inocuo","en":"Deleting the store is a harmless restart"},"correct":false,"feedback":{"es":"Puede destruir estado y mensajes.","en":"It can destroy state and messages."}},{"text":{"es":"Persistencia hace innecesario un backup","en":"Persistence makes backups unnecessary"},"correct":false,"feedback":{"es":"No elimina corrupción ni pérdida de almacenamiento.","en":"It does not eliminate corruption or storage loss."}}],"explanation":{"es":"Un store puede usar archivos o JDBC según configuración. Revisa salud, capacidad, I/O y recuperación/migración autorizada. Mensajes no persistentes y suscripciones no durables tienen otra semántica. Persistir un mensaje no garantiza que una BD externa y una llamada HTTP se confirmen atómicamente. Nunca borres stores para liberar espacio sin plan: puedes perder mensajes o impedir recuperación.","en":"A store may use files or JDBC under configuration. Check health, capacity, I/O and approved recovery/migration. Nonpersistent messages and nondurable subscriptions have different semantics. Persisting a message does not ensure an external DB and HTTP call commit atomically. Never delete stores to free space without a plan: you can lose messages or prevent recovery."},"flow":{"es":"Mensaje persistente > Store > Recuperación > Redelivery > Validación","en":"Persistent message > Store > Recovery > Redelivery > Validation"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12212/wls/JMSPG/overview.htm","retail":true,"followup":{"es":"¿Qué evidencia pedirías antes de mover un JMS server a otro nodo?","en":"What evidence would you request before moving a JMS server to another node?"}},{"id":"retail-middleware-07","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"advanced","kind":"concept","question":{"es":"¿Para qué sirven JTA/XA y qué es una transacción in-doubt?","en":"What are JTA/XA for and what is an in-doubt transaction?"},"options":[{"text":{"es":"Coordinar recursos transaccionales; in-doubt implica resultado pendiente de resolver","en":"Coordinate transactional resources; in-doubt means an unresolved outcome"},"correct":true,"feedback":{"es":"JTA coordina transacciones Java; XA permite participación de recursos compatibles en una transacción distribuida. Fallas entre fases pueden dejar participantes pendientes de recuperación. Identifica transaction ID, coordinador, participantes y logs con especialistas. No fuerces commit/rollback por intuición ni asumas que HTTP externo participa en XA. Restaurar consistencia requiere el procedimiento soportado y validación de efectos.","en":"JTA coordinates Java transactions; XA allows compatible resources to participate in a distributed transaction. Failure between phases can leave participants awaiting recovery. Identify transaction ID, coordinator, participants and logs with specialists. Do not force commit/rollback by intuition or assume external HTTP participates in XA. Restoring consistency requires the supported procedure and effect validation."}},{"text":{"es":"XA incluye automáticamente cualquier API REST","en":"XA automatically includes every REST API"},"correct":false,"feedback":{"es":"No todo recurso soporta o participa en XA.","en":"Not every resource supports or participates in XA."}},{"text":{"es":"Resolver in-doubt borrando logs","en":"Resolve in-doubt by deleting logs"},"correct":false,"feedback":{"es":"Puedes perder la información de recuperación.","en":"You can lose recovery information."}}],"explanation":{"es":"JTA coordina transacciones Java; XA permite participación de recursos compatibles en una transacción distribuida. Fallas entre fases pueden dejar participantes pendientes de recuperación. Identifica transaction ID, coordinador, participantes y logs con especialistas. No fuerces commit/rollback por intuición ni asumas que HTTP externo participa en XA. Restaurar consistencia requiere el procedimiento soportado y validación de efectos.","en":"JTA coordinates Java transactions; XA allows compatible resources to participate in a distributed transaction. Failure between phases can leave participants awaiting recovery. Identify transaction ID, coordinator, participants and logs with specialists. Do not force commit/rollback by intuition or assume external HTTP participates in XA. Restoring consistency requires the supported procedure and effect validation."},"flow":{"es":"Transacción > Participantes XA > Prepare > Commit / Recuperación > Consistencia","en":"Transaction > XA participants > Prepare > Commit / Recovery > Consistency"},"code":"","output":null,"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"¿Qué información necesitas si JMS confirma pero el estado BD parece incierto?","en":"What information do you need if JMS acknowledges but DB state seems uncertain?"}},{"id":"retail-middleware-08","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo se relacionan EJB, RMI y T3 con WebLogic?","en":"How do EJB, RMI and T3 relate to WebLogic?"},"options":[{"text":{"es":"EJB son componentes Java enterprise; RMI invoca objetos remotos; T3 es transporte WebLogic","en":"EJB are enterprise Java components; RMI invokes remote objects; T3 is a WebLogic transport"},"correct":true,"feedback":{"es":"Una app puede usar EJB para lógica gestionada por el contenedor y acceder remotamente mediante protocolos compatibles. WebLogic usa T3/T3s para tráfico Java RMI; T3s incorpora seguridad TLS. Un endpoint HTTP sano no demuestra que esta ruta, hostname anunciado o permisos sean correctos. Restringe interfaces administrativas y protocolos a redes autorizadas; evita exponer T3 públicamente por comodidad.","en":"An app may use EJB for container-managed logic and access it remotely through compatible protocols. WebLogic uses T3/T3s for Java RMI traffic; T3s includes TLS security. A healthy HTTP endpoint does not prove that this route, advertised hostname or permissions are correct. Restrict administrative interfaces and protocols to authorized networks; do not expose T3 publicly for convenience."}},{"text":{"es":"RMI es exactamente REST sobre HTTP","en":"RMI is exactly REST over HTTP"},"correct":false,"feedback":{"es":"Son modelos de interacción diferentes.","en":"They are different interaction models."}},{"text":{"es":"Un curl HTTPS prueba también T3","en":"An HTTPS curl also proves T3"},"correct":false,"feedback":{"es":"Prueba otra ruta y protocolo.","en":"It tests a different route and protocol."}}],"explanation":{"es":"Una app puede usar EJB para lógica gestionada por el contenedor y acceder remotamente mediante protocolos compatibles. WebLogic usa T3/T3s para tráfico Java RMI; T3s incorpora seguridad TLS. Un endpoint HTTP sano no demuestra que esta ruta, hostname anunciado o permisos sean correctos. Restringe interfaces administrativas y protocolos a redes autorizadas; evita exponer T3 públicamente por comodidad.","en":"An app may use EJB for container-managed logic and access it remotely through compatible protocols. WebLogic uses T3/T3s for Java RMI traffic; T3s includes TLS security. A healthy HTTP endpoint does not prove that this route, advertised hostname or permissions are correct. Restrict administrative interfaces and protocols to authorized networks; do not expose T3 publicly for convenience."},"flow":{"es":"Cliente Java > Lookup > T3 / T3s > EJB remoto > Respuesta","en":"Java client > Lookup > T3 / T3s > Remote EJB > Response"},"code":"","output":null,"source":"https://docs.oracle.com/middleware/12213/wls/WLRMI/rmi_t3.htm","retail":true,"followup":{"es":"Explica qué revisarías si web funciona pero un cliente Java remoto falla.","en":"Explain what to check when the web UI works but a remote Java client fails."}},{"id":"retail-middleware-09","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"intermediate","kind":"command","question":{"es":"¿Cómo investigarías un handshake TLS fallido desde el host autorizado?","en":"How would you investigate a failed TLS handshake from an authorized host?"},"options":[{"text":{"es":"Verificar hostname/SNI, cadena, fechas y confianza sin desactivar validación","en":"Check hostname/SNI, chain, dates and trust without disabling verification"},"correct":true,"feedback":{"es":"Keystore guarda identidad y claves según uso; truststore contiene confianza en certificados/CA. Inspecciona el certificado presentado y la cadena desde el origen real. Un openssl válido no prueba el truststore Java: confirma JVM y configuración usadas. La verificación de nombre es distinta de la cadena. No uses -k como solución ni pegues claves privadas en tickets.","en":"A keystore holds identity and keys depending on usage; a truststore contains trusted certificates/CAs. Inspect the presented certificate and chain from the real origin. Successful openssl verification does not prove the Java truststore: confirm the actual JVM and configuration. Hostname verification differs from chain verification. Do not use -k as a fix or paste private keys into tickets."}},{"text":{"es":"Desactivar TLS en producción","en":"Disable TLS in production"},"correct":false,"feedback":{"es":"Elimina protección y no resuelve confianza correctamente.","en":"It removes protection and does not properly resolve trust."}},{"text":{"es":"Confiar en todo certificado recibido","en":"Trust every received certificate"},"correct":false,"feedback":{"es":"Permite identidad no verificada.","en":"It allows unverified identity."}}],"explanation":{"es":"Keystore guarda identidad y claves según uso; truststore contiene confianza en certificados/CA. Inspecciona el certificado presentado y la cadena desde el origen real. Un openssl válido no prueba el truststore Java: confirma JVM y configuración usadas. La verificación de nombre es distinta de la cadena. No uses -k como solución ni pegues claves privadas en tickets.","en":"A keystore holds identity and keys depending on usage; a truststore contains trusted certificates/CAs. Inspect the presented certificate and chain from the real origin. Successful openssl verification does not prove the Java truststore: confirm the actual JVM and configuration. Hostname verification differs from chain verification. Do not use -k as a fix or paste private keys into tickets."},"flow":{"es":"Origen > SNI / Hostname > Cadena y fechas > Truststore JVM > Prueba","en":"Origin > SNI / Hostname > Chain and dates > JVM truststore > Test"},"code":"openssl s_client -connect retail.example.test:443 \\\n  -servername retail.example.test -showcerts \\\n  -verify_return_error -verify_hostname retail.example.test \u003c/dev/null\n# Compare with the configured Java truststore using approved tooling.","output":{"es":"Observa certificado, cadena y errores. El dominio es ficticio; sustituye solo por un endpoint autorizado.","en":"Observe certificate, chain and errors. The domain is fictional; replace it only with an authorized endpoint."},"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"Distingue certificado expirado, SAN incorrecto y CA no confiable.","en":"Distinguish expired certificate, wrong SAN and untrusted CA."}},{"id":"retail-middleware-10","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"advanced","kind":"command","question":{"es":"¿Qué aporta una serie de thread dumps a un incidente Retail?","en":"What does a series of thread dumps add to a Retail incident?"},"options":[{"text":{"es":"Permite ver persistencia de esperas y stacks frente a una captura aislada","en":"It reveals persistent waits and stacks compared with one snapshot"},"correct":true,"feedback":{"es":"Un thread dump muestra hilos y stacks, no todo el estado de heap. Capturas separadas ayudan a reconocer JDBC waits, llamadas externas o locks repetidos. Correlaciona con latencia, logs y BD. jcmd requiere JDK/herramientas compatibles y permisos del proceso; la captura puede tener costo y datos sensibles. No ejecutes heap dumps enormes en disco lleno ni cambies umbral de stuck threads para ocultar un síntoma.","en":"A thread dump shows threads and stacks, not the entire heap state. Spaced captures help identify repeated JDBC waits, external calls or locks. Correlate them with latency, logs and the DB. jcmd needs compatible JDK tools and process permissions; capture has cost and may expose sensitive data. Do not take huge heap dumps on a full disk or change stuck-thread thresholds to hide symptoms."}},{"text":{"es":"Una captura demuestra toda la causa raíz","en":"One snapshot proves the entire root cause"},"correct":false,"feedback":{"es":"Puede ser un estado normal momentáneo.","en":"It can show normal transient state."}},{"text":{"es":"Subir el umbral corrige la dependencia lenta","en":"Increasing the threshold fixes the slow dependency"},"correct":false,"feedback":{"es":"Solo cambia clasificación/alerta.","en":"It only changes classification/alerting."}}],"explanation":{"es":"Un thread dump muestra hilos y stacks, no todo el estado de heap. Capturas separadas ayudan a reconocer JDBC waits, llamadas externas o locks repetidos. Correlaciona con latencia, logs y BD. jcmd requiere JDK/herramientas compatibles y permisos del proceso; la captura puede tener costo y datos sensibles. No ejecutes heap dumps enormes en disco lleno ni cambies umbral de stuck threads para ocultar un síntoma.","en":"A thread dump shows threads and stacks, not the entire heap state. Spaced captures help identify repeated JDBC waits, external calls or locks. Correlate them with latency, logs and the DB. jcmd needs compatible JDK tools and process permissions; capture has cost and may expose sensitive data. Do not take huge heap dumps on a full disk or change stuck-thread thresholds to hide symptoms."},"flow":{"es":"Latencia > Dumps espaciados > Stacks repetidos > Dependencia > Prueba","en":"Latency > Spaced dumps > Repeated stacks > Dependency > Test"},"code":"jcmd \u003cauthorized-java-pid> Thread.print\n# Repeat at approved intervals and store captures securely.","output":{"es":"Compara hilos/locks/stacks entre capturas y su dependencia. No asumas que WAITING es siempre error.","en":"Compare threads/locks/stacks across captures and their dependency. WAITING is not always an error."},"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"Un hilo espera socketRead en tres capturas: qué confirma y qué falta saber.","en":"A thread waits in socketRead in three captures: what does this prove and what is still unknown?"}},{"id":"retail-middleware-11","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo distinguirías heap insuficiente de GC excesivo por retención de objetos?","en":"How would you distinguish insufficient heap from excessive GC due to retained objects?"},"options":[{"text":{"es":"Comparar carga, GC pauses y ocupación posterior a GC a lo largo del tiempo","en":"Compare load, GC pauses and post-GC occupancy over time"},"correct":true,"feedback":{"es":"Heap es memoria gestionada para objetos Java; el RSS total incluye más recursos. Una línea base creciente después de GC puede sugerir retención, pero necesita análisis. Contrasta volumen, allocation rate, pausas, histograma y límite del proceso/contenedor. Aumentar Xmx puede causar OOM del host y no arreglar una fuga. Prueba con equipo dev y un presupuesto de memoria completo.","en":"Heap is managed memory for Java objects; total RSS includes additional resources. Rising post-GC baseline can suggest retention but requires analysis. Compare volume, allocation rate, pauses, histograms and process/container limits. Increasing Xmx can cause host OOM and does not fix a leak. Test with development and a complete memory budget."}},{"text":{"es":"Duplicar Xmx siempre resuelve una fuga","en":"Doubling Xmx always fixes a leak"},"correct":false,"feedback":{"es":"Puede retrasar síntomas sin corregir retención.","en":"It can delay symptoms without fixing retention."}},{"text":{"es":"RSS y heap son iguales","en":"RSS and heap are equal"},"correct":false,"feedback":{"es":"Memoria nativa, stacks y otros recursos también cuentan.","en":"Native memory, stacks and other resources also count."}}],"explanation":{"es":"Heap es memoria gestionada para objetos Java; el RSS total incluye más recursos. Una línea base creciente después de GC puede sugerir retención, pero necesita análisis. Contrasta volumen, allocation rate, pausas, histograma y límite del proceso/contenedor. Aumentar Xmx puede causar OOM del host y no arreglar una fuga. Prueba con equipo dev y un presupuesto de memoria completo.","en":"Heap is managed memory for Java objects; total RSS includes additional resources. Rising post-GC baseline can suggest retention but requires analysis. Compare volume, allocation rate, pauses, histograms and process/container limits. Increasing Xmx can cause host OOM and does not fix a leak. Test with development and a complete memory budget."},"flow":{"es":"Carga > GC y heap > Línea base > Presupuesto total > Hipótesis probada","en":"Load > GC and heap > Baseline > Total budget > Tested hypothesis"},"code":"","output":null,"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"Explica por qué Xmx de 4 GB puede no caber en un contenedor de 4 GB.","en":"Explain why Xmx 4 GB may not fit inside a 4 GB container."},"evidence":{"es":"Caso hipotético: heap después de GC crece de 40% a 85% en seis horas; throughput permanece estable.","en":"Hypothetical case: post-GC heap rises from 40% to 85% over six hours; throughput remains stable."}},{"id":"retail-middleware-12","section":"retail-middleware","sectionLabel":{"es":"Retail · WebLogic y Java enterprise","en":"Retail · WebLogic and enterprise Java"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo demostrarías que un tuning WebLogic mejoró y no desplazó el problema?","en":"How would you prove a WebLogic tuning change improved rather than shifted the problem?"},"options":[{"text":{"es":"Comparar baseline y carga equivalente con métricas de aplicación y dependencias","en":"Compare baseline and equivalent load using application and dependency metrics"},"correct":true,"feedback":{"es":"Tuning significa ajustar una hipótesis con medición, no cambiar todos los parámetros. Define objetivo: reducir p95 con igual throughput y errores aceptables. Observa colas, threads, pool, GC, BD y downstream. Un aumento de concurrencia puede bajar espera local pero saturar BD. Ejecuta prueba controlada en QA, registra configuración y criterios de rollback; evalúa también resultado comercial.","en":"Tuning means testing a hypothesis with measurement, not changing every parameter. Define an objective: lower p95 with equal throughput and acceptable errors. Observe queues, threads, pools, GC, DB and downstream. Greater concurrency can reduce local waits while saturating the DB. Run controlled QA tests, record configuration and rollback criteria, and evaluate business outcomes too."}},{"text":{"es":"Cambiar threads, heap y pool a la vez","en":"Change threads, heap and pool together"},"correct":false,"feedback":{"es":"Impide atribuir el resultado y aumenta riesgo.","en":"This prevents attribution and increases risk."}},{"text":{"es":"Validar solo promedio de CPU","en":"Validate only average CPU"},"correct":false,"feedback":{"es":"Omite latencia, errores y cuello downstream.","en":"This omits latency, errors and downstream bottlenecks."}}],"explanation":{"es":"Tuning significa ajustar una hipótesis con medición, no cambiar todos los parámetros. Define objetivo: reducir p95 con igual throughput y errores aceptables. Observa colas, threads, pool, GC, BD y downstream. Un aumento de concurrencia puede bajar espera local pero saturar BD. Ejecuta prueba controlada en QA, registra configuración y criterios de rollback; evalúa también resultado comercial.","en":"Tuning means testing a hypothesis with measurement, not changing every parameter. Define an objective: lower p95 with equal throughput and acceptable errors. Observe queues, threads, pools, GC, DB and downstream. Greater concurrency can reduce local waits while saturating the DB. Run controlled QA tests, record configuration and rollback criteria, and evaluate business outcomes too."},"flow":{"es":"Baseline > Hipótesis > Un cambio > Carga comparable > Métricas > Decisión","en":"Baseline > Hypothesis > One change > Comparable load > Metrics > Decision"},"code":"","output":null,"source":"https://docs.oracle.com/en/middleware/fusion-middleware/weblogic-server/14.1.2/perfm/wls_tuning.html","retail":true,"followup":{"es":"Propón un experimento para bajar latencia sin incrementar rechazos ni backlog.","en":"Propose an experiment lowering latency without increasing rejections or backlog."},"evidence":{"es":"Caso hipotético: p95 mejora tras ampliar threads, pero espera JDBC y sesiones BD se duplican.","en":"Hypothetical case: p95 improves after increasing threads, but JDBC wait and DB sessions double."}},{"id":"retail-integration-01","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"basic","kind":"concept","question":{"es":"¿Cuándo distinguir RIB, RSB y BDI en un mapa Retail?","en":"When should you distinguish RIB, RSB and BDI in a Retail map?"},"options":[{"text":{"es":"Al separar eventos asíncronos, servicios request/reply y cargas masivas","en":"When separating asynchronous events, request/reply services and bulk transfers"},"correct":true,"feedback":{"es":"RIB es Retail Integration Bus; RSB, Retail Service Backbone; BDI, Bulk Data Integration. En los flujos documentados representan patrones distintos, no tres nombres del mismo transporte. Ubica qué componente tiene tu release y por dónde pasa la entidad. Para soporte esto determina si buscar una respuesta inmediata, un mensaje pendiente o una ejecución batch. Las interfaces concretas se confirman por contrato y versión.","en":"RIB means Retail Integration Bus; RSB means Retail Service Backbone; BDI means Bulk Data Integration. Documented flows use them for different patterns, not as three names for the same transport. Identify components in your release and where an entity travels. This tells support whether to inspect an immediate response, a pending message or a batch run. Confirm specific interfaces by contract and version."}},{"text":{"es":"Todos son únicamente llamadas síncronas REST","en":"They are all only synchronous REST calls"},"correct":false,"feedback":{"es":"Los patrones y componentes difieren.","en":"Patterns and components differ."}},{"text":{"es":"BDI es una herramienta de backup de Oracle DB","en":"BDI is an Oracle DB backup tool"},"correct":false,"feedback":{"es":"Su propósito es integración de datos masivos.","en":"Its purpose is bulk data integration."}}],"explanation":{"es":"RIB es Retail Integration Bus; RSB, Retail Service Backbone; BDI, Bulk Data Integration. En los flujos documentados representan patrones distintos, no tres nombres del mismo transporte. Ubica qué componente tiene tu release y por dónde pasa la entidad. Para soporte esto determina si buscar una respuesta inmediata, un mensaje pendiente o una ejecución batch. Las interfaces concretas se confirman por contrato y versión.","en":"RIB means Retail Integration Bus; RSB means Retail Service Backbone; BDI means Bulk Data Integration. Documented flows use them for different patterns, not as three names for the same transport. Identify components in your release and where an entity travels. This tells support whether to inspect an immediate response, a pending message or a batch run. Confirm specific interfaces by contract and version."},"flow":{"es":"Entidad > Patrón requerido > RIB / RSB / BDI > Destino > Control","en":"Entity > Required pattern > RIB / RSB / BDI > Destination > Check"},"code":"","output":null,"source":"https://docs.oracle.com/cd/B31315_01/190/RSB%20Implementation%20Guide/Output/11%20RSB%20and%20RIB.htm","retail":true,"followup":{"es":"Clasifica consulta interactiva, evento de artículo y carga inicial de un millón de registros.","en":"Classify an interactive query, item event and one-million-record initial load."},"diagram":"patterns"},{"id":"retail-integration-02","section":"retail-integration","sectionLabel":{"es":"Retail · Integraciones y SOA","en":"Retail · Integration and SOA"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué significa publicar y suscribirse a un evento en RIB?","en":"What does publishing and subscribing to an event in RIB mean?"},"options":[{"text":{"es":"El productor emite un evento y consumidores configurados lo procesan","en":"A producer emits an event and configured consumers process it"},"correct":true,"feedback":{"es":"En el patrón asíncrono se desacoplan tiempos de origen y destino. Que el publisher complete no prueba el estado final del subscriber. Reúne familia/tipo, ID de entidad, mensaje, publicación, destino y errores. Respeta secuencia y dependencias del contrato. No extrapoles garantías de RIB a toda llamada HTTP externa: la frontera de entrega y el efecto comercial deben confirmarse.","en":"An asynchronous pattern decouples source and destination timing. Publisher completion does not prove final subscriber state. Gather family/type, entity ID, message, publication, destination and errors. Respect contract sequencing and dependencies. Do not extrapolate RIB guarantees to every ext
