ermanente. Correlaciona código HTTP y hora con eventos y logs de la instancia afectada.","en":"The actual path depends on the ingress/controller and network. If a Service has no eligible endpoints, a Running pod is insufficient: inspect labels, selectors and readiness. Isolate the layer with tests from authorized origins. Do not expose a pod to the Internet or treat port-forward as a permanent fix. Correlate HTTP code and time with events and logs from the affected instance."},"flow":{"es":"DNS / TLS > LB / Ingress > Service > Endpoint listo > Pod / App","en":"DNS / TLS > LB / Ingress > Service > Ready endpoint > Pod / App"},"code":"","output":null,"source":"https://kubernetes.io/docs/tasks/debug/debug-application/","retail":true,"followup":{"es":"Usuario ve 503 y Service tiene cero endpoints: plantea pruebas de selector y readiness.","en":"A user sees 503 and a Service has zero endpoints: propose selector and readiness tests."},"diagram":"topology"},{"id":"retail-cloudnative-04","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"intermediate","kind":"command","question":{"es":"¿Qué consultas kubectl usarías para un primer diagnóstico autorizado?","en":"Which kubectl queries would you use for an authorized first diagnosis?"},"options":[{"text":{"es":"Ver contexto/namespace, estado, eventos y logs de un pod acotado","en":"Check context/namespace, state, events and logs of a bounded pod"},"correct":true,"feedback":{"es":"Antes de consultar confirma cluster y namespace para no investigar otro ambiente. get pods muestra estado; describe resume condiciones/eventos; logs --previous ayuda tras reinicio si la instancia previa está disponible. --tail limita volumen, no garantiza anonimización. No ejecutes comandos de modificación ni exec como primer reflejo. Revisa permisos y evita sacar secretos del cluster.","en":"Before querying confirm cluster and namespace to avoid investigating another environment. get pods shows state; describe summarizes conditions/events; logs --previous helps after a restart if the previous instance is available. --tail limits volume, not privacy exposure. Do not modify resources or use exec as a first reflex. Check permissions and avoid exporting cluster secrets."}},{"text":{"es":"kubectl delete pod antes de observar","en":"Run kubectl delete pod before observing"},"correct":false,"feedback":{"es":"Puede borrar evidencia y añadir interrupción.","en":"It can erase evidence and add interruption."}},{"text":{"es":"Consultar todos los secrets para entender el error","en":"Query all secrets to understand the error"},"correct":false,"feedback":{"es":"Es innecesario y expone credenciales.","en":"This is unnecessary and exposes credentials."}}],"explanation":{"es":"Antes de consultar confirma cluster y namespace para no investigar otro ambiente. get pods muestra estado; describe resume condiciones/eventos; logs --previous ayuda tras reinicio si la instancia previa está disponible. --tail limita volumen, no garantiza anonimización. No ejecutes comandos de modificación ni exec como primer reflejo. Revisa permisos y evita sacar secretos del cluster.","en":"Before querying confirm cluster and namespace to avoid investigating another environment. get pods shows state; describe summarizes conditions/events; logs --previous helps after a restart if the previous instance is available. --tail limits volume, not privacy exposure. Do not modify resources or use exec as a first reflex. Check permissions and avoid exporting cluster secrets."},"flow":{"es":"Contexto > Namespace > Pods > Eventos > Logs correlacionados","en":"Context > Namespace > Pods > Events > Correlated logs"},"code":"kubectl config current-context\nkubectl -n \u003cauthorized-namespace> get pods\nkubectl -n \u003cauthorized-namespace> describe pod \u003cpod>\nkubectl -n \u003cauthorized-namespace> logs \u003cpod> --tail=100\nkubectl -n \u003cauthorized-namespace> logs \u003cpod> --previous --tail=100","output":{"es":"Identifica estado, razón y timestamps. Reemplaza placeholders; en SaaS podrías no disponer de kubectl.","en":"Identify state, reason and timestamps. Replace placeholders; in SaaS you may not have kubectl access."},"source":"https://kubernetes.io/docs/tasks/debug/debug-application/","retail":true,"followup":{"es":"Explica cómo distinguir Pending, ImagePullBackOff y CrashLoopBackOff.","en":"Explain how to distinguish Pending, ImagePullBackOff and CrashLoopBackOff."}},{"id":"retail-cloudnative-05","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo abordarías OOMKilled de una JVM Retail en Kubernetes?","en":"How would you approach a Retail JVM OOMKilled in Kubernetes?"},"options":[{"text":{"es":"Correlacionar límite de contenedor con heap, memoria nativa y carga","en":"Correlate the container limit with heap, native memory and load"},"correct":true,"feedback":{"es":"OOMKilled indica terminación por memoria en el contexto observado, no demuestra fuga Java. Revisa last state, exit reason, métricas de memoria, límites y presión del nodo. Xmx no incluye metaspace, stacks ni buffers nativos. Contrasta cambios y carga; corrige presupuesto o retención con pruebas. No aumentes límites sin capacidad del cluster ni conviertas la liveness probe en restart continuo.","en":"OOMKilled indicates memory-related termination in the observed context, not proof of a Java leak. Inspect last state, exit reason, memory metrics, limits and node pressure. Xmx excludes metaspace, stacks and native buffers. Compare changes and load; test budget or retention corrections. Do not increase limits without cluster capacity or turn the liveness probe into constant restart behavior."}},{"text":{"es":"OOMKilled prueba inmediatamente un bug de GC","en":"OOMKilled immediately proves a GC bug"},"correct":false,"feedback":{"es":"Se requiere distinguir presupuesto, carga y retención.","en":"Budget, load and retention must be distinguished."}},{"text":{"es":"Subir heap hasta igualar límite","en":"Increase heap to equal the limit"},"correct":false,"feedback":{"es":"No deja presupuesto para memoria no heap.","en":"This leaves no budget for non-heap memory."}}],"explanation":{"es":"OOMKilled indica terminación por memoria en el contexto observado, no demuestra fuga Java. Revisa last state, exit reason, métricas de memoria, límites y presión del nodo. Xmx no incluye metaspace, stacks ni buffers nativos. Contrasta cambios y carga; corrige presupuesto o retención con pruebas. No aumentes límites sin capacidad del cluster ni conviertas la liveness probe en restart continuo.","en":"OOMKilled indicates memory-related termination in the observed context, not proof of a Java leak. Inspect last state, exit reason, memory metrics, limits and node pressure. Xmx excludes metaspace, stacks and native buffers. Compare changes and load; test budget or retention corrections. Do not increase limits without cluster capacity or turn the liveness probe into constant restart behavior."},"flow":{"es":"OOM reason > Memoria total > Heap / Nativa > Límite / Nodo > Cambio probado","en":"OOM reason > Total memory > Heap / Native > Limit / Node > Tested change"},"code":"","output":null,"source":"https://kubernetes.io/docs/tasks/debug/debug-application/","retail":true,"followup":{"es":"Xmx 3.5 GiB, límite 4 GiB y pico nativo 1 GiB: explica el problema.","en":"Xmx 3.5 GiB, 4 GiB limit and 1 GiB native peak: explain the problem."},"evidence":{"es":"Caso hipotético: pod reinicia al cargar catálogo; Xmx 3.5 GiB y limit 4 GiB.","en":"Hypothetical case: a pod restarts while loading a catalog; Xmx is 3.5 GiB and the limit is 4 GiB."}},{"id":"retail-cloudnative-06","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo configurarías probes sin reiniciar por una dependencia lenta?","en":"How would you configure probes without restarting for a slow dependency?"},"options":[{"text":{"es":"Separar arranque, capacidad de recibir tráfico y salud recuperable por restart","en":"Separate startup, ability to receive traffic and restart-recoverable health"},"correct":true,"feedback":{"es":"startupProbe protege un arranque largo; readiness controla elegibilidad de tráfico; liveness puede reiniciar ante fallo. Si liveness depende de una BD temporalmente caída, todas las instancias pueden reiniciarse a la vez sin reparar la BD. Diseña checks y umbrales con la app, timeout y política. Verifica carga, warm-up y comportamiento durante mantenimiento en QA.","en":"startupProbe protects slow startup; readiness controls traffic eligibility; liveness may restart on failure. If liveness depends on a temporarily unavailable DB, every instance may restart without fixing the DB. Design checks and thresholds with the application, timeouts and policy. Verify load, warm-up and maintenance behavior in QA."}},{"text":{"es":"Un único check externo para todas las probes","en":"One external check for all probes"},"correct":false,"feedback":{"es":"Puede generar restart storms y semántica incorrecta.","en":"This can create restart storms and wrong semantics."}},{"text":{"es":"Readiness fallida borra siempre el pod","en":"Failed readiness always deletes the pod"},"correct":false,"feedback":{"es":"Controla tráfico, no por sí sola reinicio.","en":"It controls traffic, not by itself restart."}}],"explanation":{"es":"startupProbe protege un arranque largo; readiness controla elegibilidad de tráfico; liveness puede reiniciar ante fallo. Si liveness depende de una BD temporalmente caída, todas las instancias pueden reiniciarse a la vez sin reparar la BD. Diseña checks y umbrales con la app, timeout y política. Verifica carga, warm-up y comportamiento durante mantenimiento en QA.","en":"startupProbe protects slow startup; readiness controls traffic eligibility; liveness may restart on failure. If liveness depends on a temporarily unavailable DB, every instance may restart without fixing the DB. Design checks and thresholds with the application, timeouts and policy. Verify load, warm-up and maintenance behavior in QA."},"flow":{"es":"Arranque > Startup probe > Readiness > Tráfico > Liveness prudente","en":"Startup > Startup probe > Readiness > Traffic > Careful liveness"},"code":"","output":null,"source":"https://kubernetes.io/docs/concepts/workloads/pods/probes/","retail":true,"followup":{"es":"¿Qué respondería cada probe durante warm-up y durante caída de BD?","en":"What would each probe return during warm-up and during a DB outage?"}},{"id":"retail-cloudnative-07","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué diferencia hay entre imagen Docker, contenedor y deployment?","en":"What differs between a Docker image, container and deployment?"},"options":[{"text":{"es":"Imagen es artefacto; contenedor ejecuta; deployment declara réplicas y rollout","en":"An image is an artifact; a container runs it; a deployment declares replicas and rollout"},"correct":true,"feedback":{"es":"La imagen empaqueta código y dependencias; un contenedor ejecuta una instancia; Kubernetes coordina pods con controllers. Usa digest/version inmutable para reproducibilidad y registra configuración externa. El runtime del cluster no tiene que ser Docker solo porque se construyen imágenes con Docker. Escaneo y firma ayudan, pero no prueban corrección funcional; valida el release de Retail compatible.","en":"An image packages code and dependencies; a container runs an instance; Kubernetes coordinates pods through controllers. Use an immutable digest/version for reproducibility and record external configuration. The cluster runtime need not be Docker just because Docker builds images. Scanning and signing help but do not prove functional correctness; validate the compatible Retail release."}},{"text":{"es":"Contenedor es una VM con kernel independiente siempre","en":"A container is always a VM with an independent kernel"},"correct":false,"feedback":{"es":"Comparte kernel según la plataforma de ejecución.","en":"It shares a kernel according to the execution platform."}},{"text":{"es":"Digest solo es el nombre comercial del producto","en":"A digest is only the product marketing name"},"correct":false,"feedback":{"es":"Identifica contenido del artefacto.","en":"It identifies artifact content."}}],"explanation":{"es":"La imagen empaqueta código y dependencias; un contenedor ejecuta una instancia; Kubernetes coordina pods con controllers. Usa digest/version inmutable para reproducibilidad y registra configuración externa. El runtime del cluster no tiene que ser Docker solo porque se construyen imágenes con Docker. Escaneo y firma ayudan, pero no prueban corrección funcional; valida el release de Retail compatible.","en":"An image packages code and dependencies; a container runs an instance; Kubernetes coordinates pods through controllers. Use an immutable digest/version for reproducibility and record external configuration. The cluster runtime need not be Docker just because Docker builds images. Scanning and signing help but do not prove functional correctness; validate the compatible Retail release."},"flow":{"es":"Código > Imagen / Digest > Contenedor > Pod > Deployment / Rollout","en":"Code > Image / Digest > Container > Pod > Deployment / Rollout"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Por qué latest dificulta investigar qué versión falló ayer?","en":"Why does latest make it harder to investigate which version failed yesterday?"}},{"id":"retail-cloudnative-08","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"intermediate","kind":"concept","question":{"es":"¿Para qué sirven ConfigMap, Secret y Helm values en un deploy Retail compatible?","en":"What are ConfigMap, Secret and Helm values for in a compatible Retail deployment?"},"options":[{"text":{"es":"Separar parámetros, secretos y entradas de configuración del empaquetado","en":"Separate parameters, secrets and configuration inputs from packaging"},"correct":true,"feedback":{"es":"ConfigMap contiene configuración no secreta; Secret requiere controles reales, no solo base64. Helm values parametrizan un chart si esa herramienta forma parte del despliegue soportado. Revisa render/overrides y referencias al ambiente; evita credenciales en Git o salidas de pipeline. Cambiar un recurso no garantiza recarga de la app: confirma cómo consume configuración y qué restart/rollout está autorizado.","en":"ConfigMap holds non-secret configuration; Secret needs actual controls, not just base64. Helm values parameterize a chart if that tool belongs to the supported deployment. Review rendered resources/overrides and environment references; keep credentials out of Git and pipeline output. A resource change does not guarantee application reload: confirm configuration consumption and authorized restart/rollout behavior."}},{"text":{"es":"Base64 cifra de forma segura cualquier secreto","en":"Base64 securely encrypts every secret"},"correct":false,"feedback":{"es":"Es codificación, no cifrado.","en":"It is encoding, not encryption."}},{"text":{"es":"Helm existe siempre en todo Oracle Retail","en":"Helm always exists in every Oracle Retail setup"},"correct":false,"feedback":{"es":"Confirma herramienta y release.","en":"Confirm the tool and release."}}],"explanation":{"es":"ConfigMap contiene configuración no secreta; Secret requiere controles reales, no solo base64. Helm values parametrizan un chart si esa herramienta forma parte del despliegue soportado. Revisa render/overrides y referencias al ambiente; evita credenciales en Git o salidas de pipeline. Cambiar un recurso no garantiza recarga de la app: confirma cómo consume configuración y qué restart/rollout está autorizado.","en":"ConfigMap holds non-secret configuration; Secret needs actual controls, not just base64. Helm values parameterize a chart if that tool belongs to the supported deployment. Review rendered resources/overrides and environment references; keep credentials out of Git and pipeline output. A resource change does not guarantee application reload: confirm configuration consumption and authorized restart/rollout behavior."},"flow":{"es":"Values aprobados > Recursos renderizados > Config / Secret > App > Validación","en":"Approved values > Rendered resources > Config / Secret > App > Validation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué controles pondrías para no desplegar un endpoint PROD en QA?","en":"What checks would prevent deploying a production endpoint in QA?"}},{"id":"retail-cloudnative-09","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"intermediate","kind":"command","question":{"es":"¿Qué debería controlar GitLab CI para promover una imagen de aplicación?","en":"What should GitLab CI control when promoting an application image?"},"options":[{"text":{"es":"Tests, artefacto identificable, secretos protegidos y gate de deploy","en":"Tests, an identifiable artifact, protected secrets and a deployment gate"},"correct":true,"feedback":{"es":"Una pipeline separa validación, build y promoción según proceso. Registra digest, pruebas, revisión y ambiente. Una variable masked no protege contra un job malicioso que la exfiltra; revisa cambios y permisos. El YAML de práctica solo ilustra un job manual, no construye una pipeline de Retail completa. No almacenes passwords en el repositorio ni imprimas variables para depurar.","en":"A pipeline separates validation, build and promotion under the process. Record digest, tests, review and environment. A masked variable does not protect against a malicious job exfiltrating it; review changes and permissions. This practice YAML only illustrates a manual job, not a complete Retail pipeline. Do not store passwords in the repository or print variables for debugging."}},{"text":{"es":"Masked permite confiar en cualquier script","en":"Masked means any script is trustworthy"},"correct":false,"feedback":{"es":"La ejecución aún puede extraer secretos.","en":"Execution can still exfiltrate secrets."}},{"text":{"es":"Deploy verde elimina necesidad de smoke test","en":"A green deployment removes smoke testing"},"correct":false,"feedback":{"es":"Hay que probar el resultado de aplicación.","en":"The application result still needs testing."}}],"explanation":{"es":"Una pipeline separa validación, build y promoción según proceso. Registra digest, pruebas, revisión y ambiente. Una variable masked no protege contra un job malicioso que la exfiltra; revisa cambios y permisos. El YAML de práctica solo ilustra un job manual, no construye una pipeline de Retail completa. No almacenes passwords en el repositorio ni imprimas variables para depurar.","en":"A pipeline separates validation, build and promotion under the process. Record digest, tests, review and environment. A masked variable does not protect against a malicious job exfiltrating it; review changes and permissions. This practice YAML only illustrates a manual job, not a complete Retail pipeline. Do not store passwords in the repository or print variables for debugging."},"flow":{"es":"Commit revisado > Tests > Artefacto > Gate > Deploy autorizado > Smoke test","en":"Reviewed commit > Tests > Artifact > Gate > Authorized deploy > Smoke test"},"code":"stages: [validate, deploy]\nvalidate:\n  stage: validate\n  script:\n    - ./ci/check-config.sh\ndeploy_qa:\n  stage: deploy\n  script:\n    - ./ci/deploy-approved.sh qa\n  when: manual\n  environment: qa","output":{"es":"Requiere scripts reales y controles de acceso. El ejemplo no despliega ningún producto por sí mismo.","en":"Requires real scripts and access controls. This example deploys no product by itself."},"source":"https://docs.gitlab.com/ci/yaml/","retail":true,"followup":{"es":"Diseña el gate que exige validación QA y aprobación antes de PROD.","en":"Design the gate requiring QA validation and approval before production."}},{"id":"retail-cloudnative-10","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"basic","kind":"concept","question":{"es":"¿Qué es Object Storage y cómo se distingue de un filesystem compartido?","en":"What is Object Storage and how does it differ from a shared filesystem?"},"options":[{"text":{"es":"Almacena objetos por bucket/key mediante API; no es POSIX por defecto","en":"It stores objects by bucket/key through an API; it is not POSIX by default"},"correct":true,"feedback":{"es":"Puede contener archivos de intercambio, exports o artefactos según diseño. Confirma bucket, key/prefix, región, permisos, cifrado y lifecycle. Un objeto visible para ti no prueba acceso de la identidad del job. Tamaño y checksum ayudan a verificar transferencia; la entrega no implica procesamiento downstream. No uses un bucket público para simplificar errores de acceso.","en":"It may hold exchange files, exports or artifacts under the design. Confirm bucket, key/prefix, region, permissions, encryption and lifecycle. An object visible to you does not prove access for the job identity. Size and checksums help verify transfer; delivery does not imply downstream processing. Do not make a bucket public to simplify access errors."}},{"text":{"es":"Es un disco POSIX idéntico en todo cloud","en":"It is an identical POSIX disk in every cloud"},"correct":false,"feedback":{"es":"Acceso y semántica difieren.","en":"Access and semantics differ."}},{"text":{"es":"Dar acceso público es el primer diagnóstico","en":"Granting public access is the first diagnosis"},"correct":false,"feedback":{"es":"Expone datos y no valida la identidad correcta.","en":"This exposes data and does not validate the correct identity."}}],"explanation":{"es":"Puede contener archivos de intercambio, exports o artefactos según diseño. Confirma bucket, key/prefix, región, permisos, cifrado y lifecycle. Un objeto visible para ti no prueba acceso de la identidad del job. Tamaño y checksum ayudan a verificar transferencia; la entrega no implica procesamiento downstream. No uses un bucket público para simplificar errores de acceso.","en":"It may hold exchange files, exports or artifacts under the design. Confirm bucket, key/prefix, region, permissions, encryption and lifecycle. An object visible to you does not prove access for the job identity. Size and checksums help verify transfer; delivery does not imply downstream processing. Do not make a bucket public to simplify access errors."},"flow":{"es":"Identidad del job > Bucket / Key > Permiso > Objeto > Consumidor","en":"Job identity > Bucket / Key > Permission > Object > Consumer"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Cómo separarías objeto inexistente de autorización denegada?","en":"How would you separate a missing object from denied authorization?"}},{"id":"retail-cloudnative-11","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"advanced","kind":"scenario","question":{"es":"¿Cómo investigarías un rollout Retail que no alcanza disponibilidad?","en":"How would you investigate a Retail rollout that never reaches availability?"},"options":[{"text":{"es":"Comparar nueva revisión, eventos, readiness y dependencias antes de revertir","en":"Compare the new revision, events, readiness and dependencies before reverting"},"correct":true,"feedback":{"es":"Revisa image digest, configuración, scheduling, pulls, logs y probes. La nueva instancia puede no arrancar por secreto, schema o dependencia. Rollback de Kubernetes no revierte automáticamente migraciones de BD ni efectos externos. Evalúa compatibilidad y usa un procedimiento soportado. Evita forzar escalado/restarts sin saber si quedan instancias sanas y cuánto tráfico pueden soportar.","en":"Check image digest, configuration, scheduling, pulls, logs and probes. A new instance may fail startup because of a secret, schema or dependency. Kubernetes rollback does not automatically revert DB migrations or external effects. Assess compatibility and use a supported procedure. Avoid forced scaling/restarts without knowing whether healthy instances remain and how much traffic they can handle."}},{"text":{"es":"Undo revierte todos los datos también","en":"Undo also reverts all data"},"correct":false,"feedback":{"es":"El estado de BD y servicios externos tiene otro lifecycle.","en":"DB and external-service state have separate lifecycles."}},{"text":{"es":"Eliminar instancias sanas para acelerar","en":"Delete healthy instances to speed things up"},"correct":false,"feedback":{"es":"Reduce capacidad y disponibilidad.","en":"This reduces capacity and availability."}}],"explanation":{"es":"Revisa image digest, configuración, scheduling, pulls, logs y probes. La nueva instancia puede no arrancar por secreto, schema o dependencia. Rollback de Kubernetes no revierte automáticamente migraciones de BD ni efectos externos. Evalúa compatibilidad y usa un procedimiento soportado. Evita forzar escalado/restarts sin saber si quedan instancias sanas y cuánto tráfico pueden soportar.","en":"Check image digest, configuration, scheduling, pulls, logs and probes. A new instance may fail startup because of a secret, schema or dependency. Kubernetes rollback does not automatically revert DB migrations or external effects. Assess compatibility and use a supported procedure. Avoid forced scaling/restarts without knowing whether healthy instances remain and how much traffic they can handle."},"flow":{"es":"Nueva revisión > Eventos / Logs > Readiness > Compatibilidad > Rollback o fix","en":"New revision > Events / Logs > Readiness > Compatibility > Rollback or fix"},"code":"","output":null,"source":"https://kubernetes.io/docs/tasks/debug/debug-application/","retail":true,"followup":{"es":"¿Qué impediría un rollout undo seguro aunque la imagen previa esté disponible?","en":"What could prevent a safe rollout undo even if the previous image is available?"},"evidence":{"es":"Caso hipotético: revisión nueva no pasa readiness por nombre JDBC incorrecto; revisión anterior aún atiende.","en":"Hypothetical case: the new revision fails readiness due to a wrong JDBC name; the previous revision still serves."}},{"id":"retail-cloudnative-12","section":"retail-cloudnative","sectionLabel":{"es":"Retail · Cloud y CNE","en":"Retail · Cloud and CNE"},"level":"advanced","kind":"concept","question":{"es":"¿Cómo se reparten HA y DR entre Retail app, BD, mensajería y cloud?","en":"How are HA and DR divided across Retail app, DB, messaging and cloud?"},"options":[{"text":{"es":"Cada capa necesita objetivos, mecanismo y pruebas coordinadas","en":"Each layer needs objectives, a mechanism and coordinated testing"},"correct":true,"feedback":{"es":"HA busca continuidad ante fallas locales; DR recupera ante eventos mayores dentro de RPO/RTO. Dos pods no restauran BD ni replican automáticamente un store JMS. Mapea zonas, storage, backups, identidades, DNS y dependencias. Prueba failover y retorno con reconciliación. Una arquitectura de referencia orienta, pero la certificación y permisos del producto determinan qué puedes implementar.","en":"HA targets continuity through local failures; DR recovers from larger events within RPO/RTO. Two pods neither restore the DB nor automatically replicate a JMS store. Map zones, storage, backups, identities, DNS and dependencies. Test failover and failback with reconciliation. Reference architecture provides guidance, but product certification and permissions determine what you can implement."}},{"text":{"es":"Multi-cloud por sí solo garantiza DR","en":"Multi-cloud alone guarantees DR"},"correct":false,"feedback":{"es":"Faltan consistencia, operación y pruebas.","en":"Consistency, operations and tests are still needed."}},{"text":{"es":"HA app elimina necesidad de recovery BD","en":"Application HA removes DB recovery needs"},"correct":false,"feedback":{"es":"La aplicación depende de datos recuperables.","en":"The app depends on recoverable data."}}],"explanation":{"es":"HA busca continuidad ante fallas locales; DR recupera ante eventos mayores dentro de RPO/RTO. Dos pods no restauran BD ni replican automáticamente un store JMS. Mapea zonas, storage, backups, identidades, DNS y dependencias. Prueba failover y retorno con reconciliación. Una arquitectura de referencia orienta, pero la certificación y permisos del producto determinan qué puedes implementar.","en":"HA targets continuity through local failures; DR recovers from larger events within RPO/RTO. Two pods neither restore the DB nor automatically replicate a JMS store. Map zones, storage, backups, identities, DNS and dependencies. Test failover and failback with reconciliation. Reference architecture provides guidance, but product certification and permissions determine what you can implement."},"flow":{"es":"Objetivos RPO / RTO > Capas > Mecanismos > Ensayo > Reconciliación","en":"RPO / RTO targets > Layers > Mechanisms > Drill > Reconciliation"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Explica cómo tu experiencia HADR ayuda, sin equiparar comandos con Oracle DR.","en":"Explain how your HADR experience helps without equating commands with Oracle DR."},"diagram":"topology"},{"id":"retail-operations-01","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué diferencias hay entre patch, upgrade y cambio de configuración?","en":"What differs between patching, upgrading and changing configuration?"},"options":[{"text":{"es":"Patch corrige un alcance; upgrade cambia release; configuración cambia parámetros","en":"A patch fixes a scope; an upgrade changes release; configuration changes parameters"},"correct":true,"feedback":{"es":"Cada cambio puede afectar binarios, JDK, runtime, schema o integraciones. Lee README/release notes y matriz de soporte; no asumas que patch es inocuo ni que upgrade solo cambia UI. Define pruebas, backups y rollback por capa. La herramienta puede variar según versión; OPatch no es una receta universal para todo WebLogic histórico o servicio SaaS.","en":"Each change can affect binaries, JDK, runtime, schema or integrations. Read README/release notes and the support matrix; a patch is not automatically harmless and an upgrade is not just a UI change. Define tests, backups and rollback per layer. Tooling varies by version; OPatch is not a universal recipe for all historical WebLogic releases or SaaS services."}},{"text":{"es":"Patch nunca requiere pruebas","en":"A patch never needs testing"},"correct":false,"feedback":{"es":"Puede cambiar comportamiento y dependencias.","en":"It may change behavior and dependencies."}},{"text":{"es":"OPatch aplica a todos los productos/versiones","en":"OPatch applies to every product/version"},"correct":false,"feedback":{"es":"La herramienta depende del stack certificado.","en":"The tool depends on the certified stack."}}],"explanation":{"es":"Cada cambio puede afectar binarios, JDK, runtime, schema o integraciones. Lee README/release notes y matriz de soporte; no asumas que patch es inocuo ni que upgrade solo cambia UI. Define pruebas, backups y rollback por capa. La herramienta puede variar según versión; OPatch no es una receta universal para todo WebLogic histórico o servicio SaaS.","en":"Each change can affect binaries, JDK, runtime, schema or integrations. Read README/release notes and the support matrix; a patch is not automatically harmless and an upgrade is not just a UI change. Define tests, backups and rollback per layer. Tooling varies by version; OPatch is not a universal recipe for all historical WebLogic releases or SaaS services."},"flow":{"es":"Alcance del cambio > Compatibilidad > Ensayo QA > Ventana > Validación","en":"Change scope > Compatibility > QA rehearsal > Window > Validation"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E73210_01/OPTCH/GUID-B4E408A8-C217-4BE1-B193-15F58D5B5355.htm","retail":true,"followup":{"es":"Clasifica actualización JDK, parche de seguridad y migración de schema.","en":"Classify a JDK update, security patch and schema migration."},"diagram":"deployment"},{"id":"retail-operations-02","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"command","question":{"es":"¿Qué aporta opatch lsinventory cuando corresponde al stack?","en":"What does opatch lsinventory provide when applicable to the stack?"},"options":[{"text":{"es":"Evidencia del inventario de parches del software home consultado","en":"Evidence of patch inventory for the queried software home"},"correct":true,"feedback":{"es":"Primero confirma herramienta/version, ORACLE_HOME y permisos de lectura. lsinventory ayuda a registrar estado antes/después donde OPatch es el mecanismo soportado. No prueba que todos los nodos o homes estén iguales ni que la aplicación haya pasado tests. Conserva output sanitizado y contrasta con README y change record. No uses apply/rollback ni force durante una consulta de inventario.","en":"First confirm tool/version, ORACLE_HOME and read permissions. lsinventory records before/after state where OPatch is the supported mechanism. It does not prove every node/home matches or that the application passed tests. Retain sanitized output and compare with the README and change record. Do not run apply/rollback or force during an inventory query."}},{"text":{"es":"Ejecutar apply para averiguar versión","en":"Run apply to find the version"},"correct":false,"feedback":{"es":"Es modificación, no inventario.","en":"That modifies software rather than inventories it."}},{"text":{"es":"Un home representa siempre todos los hosts","en":"One home always represents every host"},"correct":false,"feedback":{"es":"Puede haber homes/instancias independientes.","en":"Independent homes/instances may exist."}}],"explanation":{"es":"Primero confirma herramienta/version, ORACLE_HOME y permisos de lectura. lsinventory ayuda a registrar estado antes/después donde OPatch es el mecanismo soportado. No prueba que todos los nodos o homes estén iguales ni que la aplicación haya pasado tests. Conserva output sanitizado y contrasta con README y change record. No uses apply/rollback ni force durante una consulta de inventario.","en":"First confirm tool/version, ORACLE_HOME and read permissions. lsinventory records before/after state where OPatch is the supported mechanism. It does not prove every node/home matches or that the application passed tests. Retain sanitized output and compare with the README and change record. Do not run apply/rollback or force during an inventory query."},"flow":{"es":"Home confirmado > Herramienta compatible > Inventario > Comparación > Change record","en":"Confirmed home > Compatible tool > Inventory > Comparison > Change record"},"code":"# Only where OPatch is supported and ORACLE_HOME is verified:\n\"$ORACLE_HOME/OPatch/opatch\" version\n\"$ORACLE_HOME/OPatch/opatch\" lsinventory","output":{"es":"Inventario del home consultado. Repite según runbook para cada home relevante; no aplicas parches.","en":"Inventory for the queried home. Repeat under the runbook for relevant homes; no patches are applied."},"source":"https://docs.oracle.com/cd/E73210_01/OPTCH/GUID-B4E408A8-C217-4BE1-B193-15F58D5B5355.htm","retail":true,"followup":{"es":"¿Qué falta comprobar si inventario cambió pero una instancia sigue usando binarios viejos?","en":"What still needs checking if inventory changed but an instance uses old binaries?"}},{"id":"retail-operations-03","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"advanced","kind":"concept","question":{"es":"¿Qué condiciones hacen seguro o inseguro un rolling patch?","en":"What conditions make rolling patching safe or unsafe?"},"options":[{"text":{"es":"Soporte explícito, compatibilidad mixta, drenado y capacidad restante","en":"Explicit support, mixed-version compatibility, draining and remaining capacity"},"correct":true,"feedback":{"es":"Rolling significa cambiar instancias por etapas manteniendo servicio donde el producto lo permite. No es válido automáticamente para cambios de schema o protocolos incompatibles. Confirma README, sesiones/JMS, salud de nodos y capacidad con uno fuera. Define gate entre pasos y plan de abortar. Un deployment con dos nodos puede no soportar operar versiones diferentes temporalmente.","en":"Rolling means changing instances in stages while maintaining service where the product allows. It is not automatically valid for incompatible schema or protocol changes. Confirm README, sessions/JMS, node health and capacity with one out. Define a gate between steps and an abort plan. A two-node deployment may not support temporarily mixed versions."}},{"text":{"es":"Dos nodos garantizan cualquier patch online","en":"Two nodes guarantee any online patch"},"correct":false,"feedback":{"es":"Compatibilidad y estado pueden requerir downtime.","en":"Compatibility and state may require downtime."}},{"text":{"es":"Ignorar capacidad porque existe cluster","en":"Ignore capacity because a cluster exists"},"correct":false,"feedback":{"es":"El nodo restante puede saturarse.","en":"The remaining node can become saturated."}}],"explanation":{"es":"Rolling significa cambiar instancias por etapas manteniendo servicio donde el producto lo permite. No es válido automáticamente para cambios de schema o protocolos incompatibles. Confirma README, sesiones/JMS, salud de nodos y capacidad con uno fuera. Define gate entre pasos y plan de abortar. Un deployment con dos nodos puede no soportar operar versiones diferentes temporalmente.","en":"Rolling means changing instances in stages while maintaining service where the product allows. It is not automatically valid for incompatible schema or protocol changes. Confirm README, sessions/JMS, node health and capacity with one out. Define a gate between steps and an abort plan. A two-node deployment may not support temporarily mixed versions."},"flow":{"es":"Soporte rolling > Drenar nodo > Patch > Smoke test > Siguiente o abortar","en":"Rolling support > Drain node > Patch > Smoke test > Next or abort"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué evidencia necesitarías antes de prometer cero downtime al cliente?","en":"What evidence would you need before promising zero downtime to the customer?"},"diagram":"deployment"},{"id":"retail-operations-04","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"advanced","kind":"concept","question":{"es":"¿Por qué rollback de binarios no siempre revierte un upgrade Retail?","en":"Why does binary rollback not always reverse a Retail upgrade?"},"options":[{"text":{"es":"Schema, datos y efectos externos pueden haber cambiado","en":"Schema, data and external effects may have changed"},"correct":true,"feedback":{"es":"Un upgrade puede modificar estructura/semántica de datos y publicar eventos. Reponer EAR o imagen previa no deshace esas modificaciones. Define compatibilidad hacia atrás, restore/migración soportada y reconciliación con DBA e integraciones. Ensaya en QA y declara punto de no retorno cuando aplique. No improvises downgrade ni restore parcial de objetos de producto.","en":"An upgrade can change data structure/meaning and publish events. Restoring an old EAR or image does not undo those modifications. Define backward compatibility, supported restore/migration and reconciliation with the DBA and integration teams. Rehearse in QA and declare a point of no return where applicable. Do not improvise downgrades or partial restores of product objects."}},{"text":{"es":"Imagen previa restaura automáticamente stock","en":"The old image automatically restores stock"},"correct":false,"feedback":{"es":"El estado comercial está fuera del artefacto.","en":"Business state lives outside the artifact."}},{"text":{"es":"Un backup viejo siempre puede sustituir solo una tabla","en":"An old backup can always replace one table"},"correct":false,"feedback":{"es":"Puede romper consistencia y relaciones del producto.","en":"This can break product consistency and relationships."}}],"explanation":{"es":"Un upgrade puede modificar estructura/semántica de datos y publicar eventos. Reponer EAR o imagen previa no deshace esas modificaciones. Define compatibilidad hacia atrás, restore/migración soportada y reconciliación con DBA e integraciones. Ensaya en QA y declara punto de no retorno cuando aplique. No improvises downgrade ni restore parcial de objetos de producto.","en":"An upgrade can change data structure/meaning and publish events. Restoring an old EAR or image does not undo those modifications. Define backward compatibility, supported restore/migration and reconciliation with the DBA and integration teams. Rehearse in QA and declare a point of no return where applicable. Do not improvise downgrades or partial restores of product objects."},"flow":{"es":"Upgrade > Binarios + Schema + Eventos > Compatibilidad > Recovery plan > Validación","en":"Upgrade > Binaries + Schema + Events > Compatibility > Recovery plan > Validation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Diseña tres decisiones de go/no-go para un cambio con migración de datos.","en":"Design three go/no-go decisions for a data-migration change."}},{"id":"retail-operations-05","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"command","question":{"es":"¿Cómo investigarías filesystem lleno versus inodos agotados?","en":"How would you investigate a full filesystem versus exhausted inodes?"},"options":[{"text":{"es":"Comparar df -h y df -i y localizar consumo con alcance limitado","en":"Compare df -h and df -i and locate consumption with bounded scope"},"correct":true,"feedback":{"es":"Bytes e inodos son límites diferentes: muchos archivos pequeños pueden agotar inodos aunque queden GB. Consulta ruta afectada y crecimiento; du -x evita cruzar filesystems pero puede ser costoso. Un archivo borrado y todavía abierto puede explicar diferencia df/du; revísalo con herramientas y permisos autorizados. No borres stores JMS, backups ni archivos de producto. Aplica retención/drenado aprobado y verifica escritura.","en":"Bytes and inodes are different limits: many small files can exhaust inodes despite free GB. Inspect the affected path and growth; du -x avoids crossing filesystems but can be expensive. A deleted yet open file can explain a df/du difference; investigate with authorized tools/permissions. Do not delete JMS stores, backups or product files. Apply approved retention/draining and verify writes."}},{"text":{"es":"rm -rf sobre el directorio Oracle","en":"Run rm -rf over the Oracle directory"},"correct":false,"feedback":{"es":"Destruye software o estado.","en":"This destroys software or state."}},{"text":{"es":"df -h cubre siempre inodos","en":"df -h always covers inodes"},"correct":false,"feedback":{"es":"df -i muestra ese recurso por separado.","en":"df -i reports that resource separately."}}],"explanation":{"es":"Bytes e inodos son límites diferentes: muchos archivos pequeños pueden agotar inodos aunque queden GB. Consulta ruta afectada y crecimiento; du -x evita cruzar filesystems pero puede ser costoso. Un archivo borrado y todavía abierto puede explicar diferencia df/du; revísalo con herramientas y permisos autorizados. No borres stores JMS, backups ni archivos de producto. Aplica retención/drenado aprobado y verifica escritura.","en":"Bytes and inodes are different limits: many small files can exhaust inodes despite free GB. Inspect the affected path and growth; du -x avoids crossing filesystems but can be expensive. A deleted yet open file can explain a df/du difference; investigate with authorized tools/permissions. Do not delete JMS stores, backups or product files. Apply approved retention/draining and verify writes."},"flow":{"es":"Error de escritura > Bytes / Inodos > Consumo > Retención aprobada > Escritura validada","en":"Write error > Bytes / Inodes > Consumption > Approved retention > Validated write"},"code":"df -h /authorized/path\ndf -i /authorized/path\ndu -xhd1 /authorized/path","output":{"es":"Identifica el recurso agotado; du puede tardar. Ningún comando elimina datos.","en":"Identify the exhausted resource; du may take time. None of these commands deletes data."},"source":"","retail":true,"followup":{"es":"Quedan 30 GB pero no se crean logs: qué comprobarías.","en":"There are 30 GB free but logs cannot be created: what would you check?"}},{"id":"retail-operations-06","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"command","question":{"es":"¿Cómo diferenciarías CPU alta, I/O wait y presión de memoria en Linux?","en":"How would you distinguish high CPU, I/O wait and memory pressure on Linux?"},"options":[{"text":{"es":"Tomar muestras temporales y correlacionarlas con procesos y latencia","en":"Take time-based samples and correlate with processes and latency"},"correct":true,"feedback":{"es":"Load average no equivale a porcentaje CPU; incluye tareas ejecutables y ciertas esperas. vmstat ayuda con runnable, memoria y swapping; iostat con actividad de dispositivos si está instalado. Compara intervalos, cores, CPU user/system y latencia. No diagnostiques disco defectuoso solo por wa ni fuga solo por memoria cacheada. Correlaciona host de app y host de BD según el síntoma.","en":"Load average is not CPU percentage; it includes runnable tasks and some waits. vmstat helps with runnable tasks, memory and swapping; iostat with device activity if installed. Compare intervals, cores, user/system CPU and latency. Do not diagnose a broken disk solely from wa or a leak from cached memory. Correlate application and DB hosts under the symptom."}},{"text":{"es":"Load 20 siempre significa CPU al 20%","en":"Load 20 always means 20% CPU"},"correct":false,"feedback":{"es":"Son medidas diferentes.","en":"They are different measurements."}},{"text":{"es":"Vaciar caches es el primer paso","en":"Dropping caches is the first step"},"correct":false,"feedback":{"es":"Modifica rendimiento y no demuestra causa.","en":"It changes performance and does not establish the cause."}}],"explanation":{"es":"Load average no equivale a porcentaje CPU; incluye tareas ejecutables y ciertas esperas. vmstat ayuda con runnable, memoria y swapping; iostat con actividad de dispositivos si está instalado. Compara intervalos, cores, CPU user/system y latencia. No diagnostiques disco defectuoso solo por wa ni fuga solo por memoria cacheada. Correlaciona host de app y host de BD según el síntoma.","en":"Load average is not CPU percentage; it includes runnable tasks and some waits. vmstat helps with runnable tasks, memory and swapping; iostat with device activity if installed. Compare intervals, cores, user/system CPU and latency. Do not diagnose a broken disk solely from wa or a leak from cached memory. Correlate application and DB hosts under the symptom."},"flow":{"es":"Síntoma > Muestras > CPU / Memoria / I/O > Proceso > Correlación","en":"Symptom > Samples > CPU / Memory / I/O > Process > Correlation"},"code":"uptime\nvmstat 1 5\niostat -xz 1 5\nps -eo pid,comm,%cpu,%mem --sort=-%cpu","output":{"es":"Compara muestras, no solo promedios desde boot. iostat depende del paquete sysstat instalado.","en":"Compare samples, not just since-boot averages. iostat depends on the installed sysstat package."},"source":"","retail":true,"followup":{"es":"Load 20 en 4 cores y CPU baja: por qué podría ser espera de I/O.","en":"Load 20 on 4 cores and low CPU: why might it indicate I/O waits?"}},{"id":"retail-operations-07","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué significa triage de hardware/OS cuando no eres dueño de infraestructura?","en":"What does hardware/OS triage mean when you do not own infrastructure?"},"options":[{"text":{"es":"Aislar evidencia e impacto y escalar al dueño sin atribución prematura","en":"Isolate evidence and impact and escalate to the owner without premature attribution"},"correct":true,"feedback":{"es":"Reúne host, ventana, errores kernel/dispositivo, métricas y comparación sana bajo permisos. Un timeout de aplicación no demuestra falla física. En cloud puede corresponder revisar salud de instancia/proveedor y abrir caso; en on-prem, eventos de hardware con sysadmin. Conserva evidencia, usa mitigación reversible autorizada y evita reboot global sin coordinación.","en":"Gather host, time window, kernel/device errors, metrics and healthy comparisons under your permissions. An application timeout does not prove physical failure. In cloud inspect instance/provider health and open a case as appropriate; on-prem coordinate hardware events with sysadmin. Preserve evidence, use authorized reversible mitigation and avoid uncoordinated global reboot."}},{"text":{"es":"Atribuir todo timeout a hardware","en":"Attribute every timeout to hardware"},"correct":false,"feedback":{"es":"Puede ser configuración, app o dependencia.","en":"It can be configuration, app or a dependency."}},{"text":{"es":"Reboot todos los hosts sin aviso","en":"Reboot all hosts without notice"},"correct":false,"feedback":{"es":"Aumenta impacto y pierde evidencia.","en":"This increases impact and loses evidence."}}],"explanation":{"es":"Reúne host, ventana, errores kernel/dispositivo, métricas y comparación sana bajo permisos. Un timeout de aplicación no demuestra falla física. En cloud puede corresponder revisar salud de instancia/proveedor y abrir caso; en on-prem, eventos de hardware con sysadmin. Conserva evidencia, usa mitigación reversible autorizada y evita reboot global sin coordinación.","en":"Gather host, time window, kernel/device errors, metrics and healthy comparisons under your permissions. An application timeout does not prove physical failure. In cloud inspect instance/provider health and open a case as appropriate; on-prem coordinate hardware events with sysadmin. Preserve evidence, use authorized reversible mitigation and avoid uncoordinated global reboot."},"flow":{"es":"Síntoma > Evidencia OS > Correlación > Dueño infraestructura > Mitigación","en":"Symptom > OS evidence > Correlation > Infrastructure owner > Mitigation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Prepara un escalamiento con host, hora, error, impacto y pruebas ya realizadas.","en":"Prepare an escalation with host, time, error, impact and completed tests."}},{"id":"retail-operations-08","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"command","question":{"es":"¿Cómo automatizarías un health report Bash sin cambiar el sistema?","en":"How would you automate a Bash health report without modifying the system?"},"options":[{"text":{"es":"Validar inputs, limitar consultas y fallar con mensajes útiles","en":"Validate inputs, bound queries and fail with useful messages"},"correct":true,"feedback":{"es":"Un reporte de lectura acelera triage y mantiene evidencia comparable. Valida ruta, dependencias y alcance; cita variables y evita eval. set -euo pipefail ayuda pero no sustituye manejo explícito de errores ni rollback. Registra timestamp y resultado sin secretos. Prueba datos inesperados, rutas con espacios y dependencia ausente antes de usarlo en guardia.","en":"A read-only report accelerates triage and maintains comparable evidence. Validate path, dependencies and scope; quote variables and avoid eval. set -euo pipefail helps but does not replace explicit error handling or rollback. Record timestamps and outcomes without secrets. Test unexpected input, paths with spaces and missing dependencies before on-call use."}},{"text":{"es":"eval permite cualquier ruta segura automáticamente","en":"eval automatically makes any path safe"},"correct":false,"feedback":{"es":"Interpreta texto como código y añade riesgo.","en":"It interprets text as code and adds risk."}},{"text":{"es":"set -e garantiza rollback completo","en":"set -e guarantees complete rollback"},"correct":false,"feedback":{"es":"No revierte efectos previamente ejecutados.","en":"It does not undo previously executed effects."}}],"explanation":{"es":"Un reporte de lectura acelera triage y mantiene evidencia comparable. Valida ruta, dependencias y alcance; cita variables y evita eval. set -euo pipefail ayuda pero no sustituye manejo explícito de errores ni rollback. Registra timestamp y resultado sin secretos. Prueba datos inesperados, rutas con espacios y dependencia ausente antes de usarlo en guardia.","en":"A read-only report accelerates triage and maintains comparable evidence. Validate path, dependencies and scope; quote variables and avoid eval. set -euo pipefail helps but does not replace explicit error handling or rollback. Record timestamps and outcomes without secrets. Test unexpected input, paths with spaces and missing dependencies before on-call use."},"flow":{"es":"Input validado > Consultas limitadas > Estado > Reporte sanitizado > Decisión","en":"Validated input > Bounded queries > Status > Sanitized report > Decision"},"code":"#!/usr/bin/env bash\nset -euo pipefail\npath=${1:?Usage: health-report.sh PATH}\n[[ -d \"$path\" ]] || { printf \"Invalid path\\n\" >&2; exit 2; }\ndate -u +%FT%TZ\ndf -h -- \"$path\"\ndf -i -- \"$path\"\nprintf \"Listening TCP sockets\\n\"\nss -lnt","output":{"es":"Reporte de lectura de la ruta y sockets; no cambia configuración ni ejecuta recovery.","en":"Read-only path/socket report; no configuration change or recovery execution."},"source":"","retail":true,"followup":{"es":"Añade validación de comandos y explica por qué no incluirías passwords.","en":"Add command validation and explain why you would not include passwords."}},{"id":"retail-operations-09","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"intermediate","kind":"command","question":{"es":"¿Cómo podría Python resumir un inventario sin inventar tu experiencia en ese lenguaje?","en":"How could Python summarize an inventory without inventing your language experience?"},"options":[{"text":{"es":"Como laboratorio de JSON estructurado y validación explícita","en":"As a lab in structured JSON and explicit validation"},"correct":true,"feedback":{"es":"Python es útil para APIs, parsing y automatización. Practica leer JSON con json.load en vez de regex sobre documentos estructurados. Valida shape/tipos y conserva errores visibles. Este ejemplo espera un inventario ficticio y no conecta a Oracle. Puedes decir que tu experiencia fuerte es Bash y estás aprendiendo Python con ejercicios; no lo presentes como un script productivo pasado.","en":"Python is useful for APIs, parsing and automation. Practice reading JSON with json.load rather than regex on structured documents. Validate shape/types and preserve visible errors. This example expects fictional inventory and does not connect to Oracle. State that Bash is your strongest scripting experience and you are learning Python through exercises; do not present this as a past production script."}},{"text":{"es":"Regex sobre JSON siempre reemplaza al parser","en":"Regex on JSON always replaces a parser"},"correct":false,"feedback":{"es":"Estructura, escaping y nesting requieren un parser.","en":"Structure, escaping and nesting need a parser."}},{"text":{"es":"Decir que un lab equivale a años de Python","en":"Say a lab equals years of Python"},"correct":false,"feedback":{"es":"No es evidencia de experiencia laboral.","en":"It is not evidence of work experience."}}],"explanation":{"es":"Python es útil para APIs, parsing y automatización. Practica leer JSON con json.load en vez de regex sobre documentos estructurados. Valida shape/tipos y conserva errores visibles. Este ejemplo espera un inventario ficticio y no conecta a Oracle. Puedes decir que tu experiencia fuerte es Bash y estás aprendiendo Python con ejercicios; no lo presentes como un script productivo pasado.","en":"Python is useful for APIs, parsing and automation. Practice reading JSON with json.load rather than regex on structured documents. Validate shape/types and preserve visible errors. This example expects fictional inventory and does not connect to Oracle. State that Bash is your strongest scripting experience and you are learning Python through exercises; do not present this as a past production script."},"flow":{"es":"JSON lab > Parser > Validación > Resumen > Prueba","en":"Lab JSON > Parser > Validation > Summary > Test"},"code":"import json\nfrom collections import Counter\nwith open('lab_inventory.json', encoding='utf-8') as f:\n    rows = json.load(f)\nif not isinstance(rows, list):\n    raise ValueError('Expected a list')\nfor row in rows:\n    if not isinstance(row, dict) or not isinstance(row.get('environment'), str):\n        raise ValueError('Missing environment')\nprint(dict(Counter(row['environment'] for row in rows)))","output":{"es":"Con [{\"environment\":\"QA\"},{\"environment\":\"QA\"},{\"environment\":\"PROD\"}]: {'QA': 2, 'PROD': 1}.","en":"With [{\"environment\":\"QA\"},{\"environment\":\"QA\"},{\"environment\":\"PROD\"}]: {'QA': 2, 'PROD': 1}."},"source":"","retail":true,"followup":{"es":"Prueba input válido y un registro sin environment; define un error útil.","en":"Test valid input and a record missing environment; define a useful error."}},{"id":"retail-operations-10","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"basic","kind":"command","question":{"es":"¿Cómo leerías un one-liner Perl de conteo en scripts heredados?","en":"How would you read a Perl counting one-liner in inherited scripts?"},"options":[{"text":{"es":"Identificar condición, variable y bloque END antes de ejecutarlo","en":"Identify the condition, variable and END block before executing"},"correct":true,"feedback":{"es":"El JD menciona Perl porque pueden existir herramientas heredadas. -n recorre líneas; la condición regex incrementa un contador; END imprime el total. Este ejercicio cuenta líneas con el token ERROR, no incidentes únicos ni errores semánticos. No añade un skill productivo a tu CV. Revisa permisos/input y compara con grep para entender el resultado antes de modificar un script real.","en":"The JD mentions Perl because inherited tooling may exist. -n loops over lines; a regex condition increments a counter; END prints the total. This exercise counts lines containing ERROR, not unique incidents or semantic errors. It does not add a production skill to your CV. Review permissions/input and compare with grep before modifying an actual script."}},{"text":{"es":"Cada línea ERROR es siempre un incidente nuevo","en":"Every ERROR line is always a new incident"},"correct":false,"feedback":{"es":"Un incidente puede producir múltiples líneas.","en":"One incident can produce many lines."}},{"text":{"es":"Modificar Perl heredado sin tests","en":"Modify inherited Perl without tests"},"correct":false,"feedback":{"es":"Puedes cambiar semántica y afectar batch.","en":"You can change semantics and affect batch."}}],"explanation":{"es":"El JD menciona Perl porque pueden existir herramientas heredadas. -n recorre líneas; la condición regex incrementa un contador; END imprime el total. Este ejercicio cuenta líneas con el token ERROR, no incidentes únicos ni errores semánticos. No añade un skill productivo a tu CV. Revisa permisos/input y compara con grep para entender el resultado antes de modificar un script real.","en":"The JD mentions Perl because inherited tooling may exist. -n loops over lines; a regex condition increments a counter; END prints the total. This exercise counts lines containing ERROR, not unique incidents or semantic errors. It does not add a production skill to your CV. Review permissions/input and compare with grep before modifying an actual script."},"flow":{"es":"Línea > Regex ERROR > Contador > END > Total interpretado","en":"Line > ERROR regex > Counter > END > Interpreted total"},"code":"perl -ne '$n++ if /\\bERROR\\b/; END { print 0+($n // 0), \"\\n\" }' lab.log","output":{"es":"Tres líneas con ERROR producen 3; no mide incidentes únicos.","en":"Three lines containing ERROR produce 3; this does not count unique incidents."},"source":"","retail":true,"followup":{"es":"¿Qué diferencia hay entre contar líneas ERROR y contar incidentes por request ID?","en":"What differs between counting ERROR lines and incidents by request ID?"}},{"id":"retail-operations-11","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"advanced","kind":"concept","question":{"es":"¿Qué mejorarías en tus scripts previos antes de usarlos como modelo para Retail?","en":"What would you improve in your previous scripts before modeling Retail automation on them?"},"options":[{"text":{"es":"Parsing estructurado, validación previa, scope, secretos y recuperación","en":"Structured parsing, pre-validation, scope, secrets and recovery"},"correct":true,"feedback":{"es":"Tus scripts muestran automatización de manifest/dependencias y flujo Git/build. Como práctica revisa reemplazos sed globales, selección ambigua, commit/push antes de completar validación, git add -A y secretos persistidos. No afirmes que ya tienen rollback o métricas no medidas. En Retail añadirías dry-run, límites, checkpoints, parser apropiado y aprobación; una modificación masiva necesita revisión y recuperación específica.","en":"Your scripts demonstrate manifest/dependency automation and Git/build flow. As practice review global sed replacements, ambiguous selection, commit/push before complete validation, git add -A and persisted secrets. Do not claim existing rollback or unmeasured metrics. For Retail add dry-run, boundaries, checkpoints, appropriate parsing and approval; bulk modification requires review and specific recovery."}},{"text":{"es":"Decir que set -e revierte Git y todos los archivos","en":"Say set -e reverts Git and every file"},"correct":false,"feedback":{"es":"No tiene esa semántica.","en":"It does not have that behavior."}},{"text":{"es":"Usar cambios globales sin diff ni scope","en":"Use global changes without diff or scope"},"correct":false,"feedback":{"es":"Puede modificar dependencias o ambientes no deseados.","en":"It can modify unintended dependencies or environments."}}],"explanation":{"es":"Tus scripts muestran automatización de manifest/dependencias y flujo Git/build. Como práctica revisa reemplazos sed globales, selección ambigua, commit/push antes de completar validación, git add -A y secretos persistidos. No afirmes que ya tienen rollback o métricas no medidas. En Retail añadirías dry-run, límites, checkpoints, parser apropiado y aprobación; una modificación masiva necesita revisión y recuperación específica.","en":"Your scripts demonstrate manifest/dependency automation and Git/build flow. As practice review global sed replacements, ambiguous selection, commit/push before complete validation, git add -A and persisted secrets. Do not claim existing rollback or unmeasured metrics. For Retail add dry-run, boundaries, checkpoints, appropriate parsing and approval; bulk modification requires review and specific recovery."},"flow":{"es":"Script existente > Riesgos observados > Tests / Dry-run > Gate > Ejecución acotada","en":"Existing script > Observed risks > Tests / Dry-run > Gate > Bounded execution"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Cuenta una historia STAR separando lo implementado, lo aprendido y lo que mejorarías.","en":"Tell a STAR story separating implementation, learning and future improvements."}},{"id":"retail-operations-12","section":"retail-operations","sectionLabel":{"es":"Retail · Parches, Linux y scripts","en":"Retail · Patching, Linux and scripts"},"level":"advanced","kind":"concept","question":{"es":"¿Cómo controlarías dos ejecuciones simultáneas de un job de mantenimiento?","en":"How would you control two simultaneous maintenance-job executions?"},"options":[{"text":{"es":"Usar coordinación soportada y detectar ejecución activa antes de iniciar","en":"Use supported coordination and detect active execution before starting"},"correct":true,"feedback":{"es":"Dos copias pueden competir por archivos, locks o producir efectos duplicados. El scheduler/producto puede tener control nativo: úsalo primero. flock sirve para ciertos locks locales, pero no coordina automáticamente hosts/pods distintos ni todos los filesystems. Registra owner, inicio y política de stale locks; no borres un lock sin verificar proceso. Diseña idempotencia y estado recuperable para fallas.","en":"Two copies may compete for files/locks or create duplicate effects. Prefer native scheduler/product controls where available. flock supports some local locks but does not automatically coordinate different hosts/pods or every filesystem. Record owner, start and stale-lock policy; do not delete a lock without checking the process. Design idempotency and recoverable state for failures."}},{"text":{"es":"Borrar cualquier lock que tenga más de un minuto","en":"Delete every lock older than one minute"},"correct":false,"feedback":{"es":"El proceso puede seguir legítimamente activo.","en":"The process may legitimately still be active."}},{"text":{"es":"flock local garantiza coordinación global","en":"Local flock guarantees global coordination"},"correct":false,"feedback":{"es":"Depende de hosts y almacenamiento y no es universal.","en":"It depends on hosts/storage and is not universal."}}],"explanation":{"es":"Dos copias pueden competir por archivos, locks o producir efectos duplicados. El scheduler/producto puede tener control nativo: úsalo primero. flock sirve para ciertos locks locales, pero no coordina automáticamente hosts/pods distintos ni todos los filesystems. Registra owner, inicio y política de stale locks; no borres un lock sin verificar proceso. Diseña idempotencia y estado recuperable para fallas.","en":"Two copies may compete for files/locks or create duplicate effects. Prefer native scheduler/product controls where available. flock supports some local locks but does not automatically coordinate different hosts/pods or every filesystem. Record owner, start and stale-lock policy; do not delete a lock without checking the process. Design idempotency and recoverable state for failures."},"flow":{"es":"Solicitud > Coordinación > ¿Activo? > Ejecutar o rechazar > Estado recuperable","en":"Request > Coordination > Active? > Execute or reject > Recoverable state"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Por qué un lock local no basta para un job ejecutado en tres pods?","en":"Why is a local lock insufficient for a job running across three pods?"}},{"id":"retail-cases-01","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso Retail: ninguna tienda recibe precios de mañana. ¿Cómo empiezas?","en":"Retail case: no store receives tomorrow’s prices. How do you start?"},"options":[{"text":{"es":"Confirmar aprobación, vigencia y etapa de distribución antes del cutoff","en":"Confirm approval, effective time and distribution stage before cutoff"},"correct":true,"feedback":{"es":"Define tiendas/SKUs afectados y hora límite. Si los eventos siguen pendientes de aprobación, coordina negocio; si están aprobados, sigue export/publicación, integración y recepción por muestra. Compara con un evento sano y última ejecución correcta. Captura evidencia y comunica riesgo de apertura. Mitiga por procedimiento aprobado sin editar precio directamente en la BD ni reinyectar duplicados. Cierra cuando destino confirme precio/vigencia correctos.","en":"Define affected stores/SKUs and the deadline. If events await approval, coordinate with business; if approved, follow export/publication, integration and receipt through a sample. Compare a healthy event and the last successful run. Preserve evidence and communicate opening risk. Mitigate through the approved process without direct DB price edits or duplicate reinjection. Close when the destination confirms correct price/effective time."}},{"text":{"es":"Actualizar precio por SQL en todas las tiendas","en":"Update prices with SQL at every store"},"correct":false,"feedback":{"es":"Evita controles y puede dejar fuentes inconsistentes.","en":"This bypasses controls and can leave inconsistent sources."}},{"text":{"es":"Reiniciar todos los servidores de inmediato","en":"Immediately restart every server"},"correct":false,"feedback":{"es":"No discrimina aprobación, batch o integración.","en":"This does not distinguish approval, batch or integration."}}],"explanation":{"es":"Define tiendas/SKUs afectados y hora límite. Si los eventos siguen pendientes de aprobación, coordina negocio; si están aprobados, sigue export/publicación, integración y recepción por muestra. Compara con un evento sano y última ejecución correcta. Captura evidencia y comunica riesgo de apertura. Mitiga por procedimiento aprobado sin editar precio directamente en la BD ni reinyectar duplicados. Cierra cuando destino confirme precio/vigencia correctos.","en":"Define affected stores/SKUs and the deadline. If events await approval, coordinate with business; if approved, follow export/publication, integration and receipt through a sample. Compare a healthy event and the last successful run. Preserve evidence and communicate opening risk. Mitigate through the approved process without direct DB price edits or duplicate reinjection. Close when the destination confirms correct price/effective time."},"flow":{"es":"Cutoff > Aprobación / Vigencia > Export > Interface > Recepción > Precio validado","en":"Cutoff > Approval / Effective time > Export > Interface > Receipt > Validated price"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-pricing-cloud/latest/pcsog/introduction.htm","retail":true,"followup":{"es":"Presenta un update al cliente y el siguiente paso si export sí existe pero recepción no.","en":"Give a customer update and the next step if export exists but receipt does not."},"evidence":{"es":"Hipotético: 80 tiendas, 1200 SKUs; eventos aprobados; último export terminó ayer; tiendas abren en 90 minutos.","en":"Hypothetical: 80 stores, 1200 SKUs; approved events; last export finished yesterday; stores open in 90 minutes."},"check":{"es":"Compara una muestra de item/tienda/precio/fecha en destino y concilia la población pendiente.","en":"Compare a sample of item/store/price/date in the destination and reconcile the pending population."},"diagram":"incident"},{"id":"retail-cases-02","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso ReSA: archivo recibido, pero una tienda no puede cerrar. ¿Qué revisas?","en":"ReSA case: a file arrived but one store cannot close. What do you check?"},"options":[{"text":{"es":"Etapa de importación, errores y balance del store/day afectado","en":"Import stage, errors and balance for the affected store/day"},"correct":true,"feedback":{"es":"Confirma checksum/conteo y día comercial; después carga, validación y excepciones. Si el archivo está rechazado por formato, escala al productor con error; si cargó y totals no balancean, colabora con negocio. No fuerces cierre ni cambies ventas para cuadrar. Evita reenviar el archivo sin confirmar duplicados y mecanismo soportado. Valida resolución de excepciones, totales y export posterior.","en":"Confirm checksum/count and business day, then loading, validation and exceptions. If format rejection occurred, escalate the error to the producer; if loading succeeded but totals do not balance, collaborate with business. Do not force close or alter sales to balance totals. Avoid resending without checking duplicates and supported handling. Validate resolved exceptions, totals and downstream export."}},{"text":{"es":"Cambiar totales hasta que quede verde","en":"Change totals until the dashboard turns green"},"correct":false,"feedback":{"es":"Falsea datos y elimina evidencia.","en":"This falsifies data and removes evidence."}},{"text":{"es":"Archivo existente garantiza auditoría terminada","en":"An existing file guarantees audit completion"},"correct":false,"feedback":{"es":"Entrega, carga y auditoría son etapas distintas.","en":"Delivery, loading and audit are separate stages."}}],"explanation":{"es":"Confirma checksum/conteo y día comercial; después carga, validación y excepciones. Si el archivo está rechazado por formato, escala al productor con error; si cargó y totals no balancean, colabora con negocio. No fuerces cierre ni cambies ventas para cuadrar. Evita reenviar el archivo sin confirmar duplicados y mecanismo soportado. Valida resolución de excepciones, totales y export posterior.","en":"Confirm checksum/count and business day, then loading, validation and exceptions. If format rejection occurred, escalate the error to the producer; if loading succeeded but totals do not balance, collaborate with business. Do not force close or alter sales to balance totals. Avoid resending without checking duplicates and supported handling. Validate resolved exceptions, totals and downstream export."},"flow":{"es":"Archivo > Store/day > Import / Rechazo > Totales > Excepciones > Cierre aprobado","en":"File > Store/day > Import / Rejection > Totals > Exceptions > Approved close"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/24.0.101.0/rsaat/sales-audit-overview.htm","retail":true,"followup":{"es":"Distingue un rechazo de formato de un faltante de efectivo en tu explicación oral.","en":"Distinguish a format rejection from a cash shortage in your spoken explanation."},"evidence":{"es":"Hipotético: tienda 25, business date 2026-09-29; archivo presente, import aceptado, excepción de total pendiente.","en":"Hypothetical: store 25, business date 2026-09-29; file present, import accepted, unresolved total exception."},"check":{"es":"Confirmación funcional de balance/excepciones y estado downstream, no solo filesystem.","en":"Functional confirmation of balance/exceptions and downstream status, not just the filesystem."},"diagram":"incident"},{"id":"retail-cases-03","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso ReIM: factura de 100 unidades y recepción de 90. ¿Es una caída?","en":"ReIM case: an invoice has 100 units and receipt has 90. Is this an outage?"},"options":[{"text":{"es":"Primero tratarlo como discrepancia documental y validar reglas/evidencia","en":"First treat it as a document discrepancy and validate rules/evidence"},"correct":true,"feedback":{"es":"Verifica relación PO/receipt/invoice, unidad, moneda, parcialidades y otras recepciones pendientes. Si la factura no se cargó, investiga interface; si cargó y difiere, consulta tolerancia y dueño de resolución. No amplíes tolerancia ni inventes una recepción. Comunica que el sistema puede estar detectando una diferencia válida. La solución comercial y el cierre deben quedar autorizados y trazables.","en":"Verify PO/receipt/invoice relationship, unit, currency, partial deliveries and other pending receipts. If the invoice did not load, investigate the interface; if it loaded and differs, consult tolerance and resolution ownership. Do not increase tolerance or invent a receipt. Explain that the system may be detecting a valid discrepancy. Business resolution and closure need authorization and traceability."}},{"text":{"es":"Reiniciar WebLogic corrige las diez unidades","en":"Restarting WebLogic fixes the ten units"},"correct":false,"feedback":{"es":"La discrepancia puede ser real y requiere documentos.","en":"The discrepancy may be real and needs documentation."}},{"text":{"es":"Insertar diez unidades directamente","en":"Insert ten units directly"},"correct":false,"feedback":{"es":"Puede inventar existencia y evadir reglas.","en":"This may invent stock and bypass rules."}}],"explanation":{"es":"Verifica relación PO/receipt/invoice, unidad, moneda, parcialidades y otras recepciones pendientes. Si la factura no se cargó, investiga interface; si cargó y difiere, consulta tolerancia y dueño de resolución. No amplíes tolerancia ni inventes una recepción. Comunica que el sistema puede estar detectando una diferencia válida. La solución comercial y el cierre deben quedar autorizados y trazables.","en":"Verify PO/receipt/invoice relationship, unit, currency, partial deliveries and other pending receipts. If the invoice did not load, investigate the interface; if it loaded and differs, consult tolerance and resolution ownership. Do not increase tolerance or invent a receipt. Explain that the system may be detecting a valid discrepancy. Business resolution and closure need authorization and traceability."},"flow":{"es":"Documentos > Unidades / Parciales > Diferencia > Regla > Dueño > Resolución","en":"Documents > Units / Partial receipts > Difference > Rule > Owner > Resolution"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-invoice-matching-cloud/latest/rimog/integration.htm","retail":true,"followup":{"es":"¿Qué evidencia separa entrega parcial real de recepción no integrada?","en":"What evidence separates a real partial delivery from a non-integrated receipt?"},"evidence":{"es":"Hipotético: PO 100, receipt registrado 90, invoice cargada 100; no hay error técnico observado.","en":"Hypothetical: PO 100, recorded receipt 90, loaded invoice 100; no observed technical error."},"diagram":"invoice"},{"id":"retail-cases-04","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso Allocation: una tienda recibe cero aunque reporta alta demanda. ¿Cómo lo investigas?","en":"Allocation case: a store receives zero despite high reported demand. How do you investigate?"},"options":[{"text":{"es":"Comparar inputs, necesidad neta, elegibilidad y restricciones de política","en":"Compare inputs, net need, eligibility and policy restrictions"},"correct":true,"feedback":{"es":"Confirma SKU, horizonte y ubicación; revisa demanda, inventario aplicable, disponibilidad y reglas de elegibilidad. Si el cálculo no ejecutó, analiza job/runtime; si ejecutó, explica los inputs y restricciones con negocio. Un valor cero puede ser correcto por stock existente o una exclusión. Usa snapshot y cálculo controlado en QA; no cambies políticas para obtener el número que alguien esperaba.","en":"Confirm SKU, horizon and location; inspect demand, applicable inventory, availability and eligibility rules. If c
