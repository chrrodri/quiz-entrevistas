correct":false,"feedback":{"es":"No hay suficiente evidencia.","en":"There is insufficient evidence."}}],"explanation":{"es":"Pregunta: \"¿Todos los usuarios? ¿Desde cuándo? ¿Qué error?\" Luego propone una prueba discriminante y explica cómo cada resultado cambia el siguiente paso.","en":"Ask: \"All users? Since when? What error?\" Then propose a discriminating test and explain how each result changes the next step."},"flow":{"es":"Aclarar > Hipótesis > Prueba > Resultado A/B > Siguiente paso","en":"Clarify > Hypothesis > Test > Result A/B > Next step"},"code":"","output":null,"source":"","followup":{"es":"Responde en 60–90 segundos. ¿Qué hiciste tú, por qué elegiste esa acción y qué resultado real puedes respaldar?","en":"Answer in 60–90 seconds. What did you do, why did you choose that action, and what actual outcome can you support?"},"evidence":null},{"id":"interview-12","section":"interview","sectionLabel":{"es":"Entrevista, liderazgo y perfil","en":"Interview, leadership and profile"},"level":"intermediate","kind":"behavioral","question":{"es":"¿Qué preguntarías al entrevistador para entender el puesto?","en":"What would you ask the interviewer to understand the role?"},"options":[{"text":{"es":"Stack, guardias, incidentes frecuentes, autonomía y éxito a 90 días","en":"Stack, on-call, common incidents, autonomy and 90-day success"},"correct":true,"feedback":{"es":"Pregunta qué separa L2/L3 allí, tooling de observabilidad y capacidad de cambiar producción. Relaciona necesidad con una fortaleza real; reconoce brechas con plan de aprendizaje.","en":"Ask what separates L2/L3 there, observability tooling and production-change authority. Connect their need to a real strength; acknowledge gaps with a learning plan."}},{"text":{"es":"Solo qué tan fácil es el trabajo","en":"Only how easy the job is"},"correct":false,"feedback":{"es":"No revela necesidades concretas del equipo.","en":"It does not reveal concrete team needs."}},{"text":{"es":"Prometer arreglar cualquier incidente de inmediato","en":"Promise to fix any incident immediately"},"correct":false,"feedback":{"es":"No conoces arquitectura ni límites todavía.","en":"You do not know architecture or boundaries yet."}}],"explanation":{"es":"Pregunta qué separa L2/L3 allí, tooling de observabilidad y capacidad de cambiar producción. Relaciona necesidad con una fortaleza real; reconoce brechas con plan de aprendizaje.","en":"Ask what separates L2/L3 there, observability tooling and production-change authority. Connect their need to a real strength; acknowledge gaps with a learning plan."},"flow":{"es":"Necesidad del equipo > Alcance > Autonomía > Fortalezas > Plan de entrada","en":"Team need > Scope > Autonomy > Strengths > Ramp-up plan"},"code":"","output":null,"source":"","followup":{"es":"Responde en 60–90 segundos. ¿Qué hiciste tú, por qué elegiste esa acción y qué resultado real puedes respaldar?","en":"Answer in 60–90 seconds. What did you do, why did you choose that action, and what actual outcome can you support?"},"evidence":null},{"id":"retail-foundations-01","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Oracle Retail es una sola aplicación o un ecosistema?","en":"Is Oracle Retail one application or an ecosystem?"},"options":[{"text":{"es":"Un conjunto de productos conectados para procesos de venta minorista","en":"A connected set of products for retail business processes"},"correct":true,"feedback":{"es":"Retail significa comercio minorista: comprar mercancía, distribuirla, venderla y conciliarla. Oracle Retail agrupa aplicaciones especializadas; no es un único servidor ni otro nombre para Fusion ERP. Tu mapa inicial debe identificar productos, versiones, responsables, interfaces y datos compartidos. Un precio incorrecto puede empezar en Pricing y manifestarse en una caja, aunque ambos sistemas estén encendidos.","en":"Retail means selling goods to consumers: buying merchandise, distributing it, selling it and reconciling it. Oracle Retail groups specialized applications; it is not one server or another name for Fusion ERP. Your first map should identify products, versions, owners, interfaces and shared data. A wrong price can start in Pricing and surface at a register even when both systems are running."}},{"text":{"es":"Es solamente la base Oracle de una tienda","en":"It is only a store Oracle database"},"correct":false,"feedback":{"es":"La BD es una capa técnica, no todo el conjunto funcional.","en":"The DB is a technical layer, not the whole functional ecosystem."}},{"text":{"es":"Es Fusion ERP con otro nombre","en":"It is Fusion ERP with another name"},"correct":false,"feedback":{"es":"Comparten fundamentos enterprise, pero productos y procesos no son equivalentes.","en":"They share enterprise foundations, but products and processes are not equivalent."}}],"explanation":{"es":"Retail significa comercio minorista: comprar mercancía, distribuirla, venderla y conciliarla. Oracle Retail agrupa aplicaciones especializadas; no es un único servidor ni otro nombre para Fusion ERP. Tu mapa inicial debe identificar productos, versiones, responsables, interfaces y datos compartidos. Un precio incorrecto puede empezar en Pricing y manifestarse en una caja, aunque ambos sistemas estén encendidos.","en":"Retail means selling goods to consumers: buying merchandise, distributing it, selling it and reconciling it. Oracle Retail groups specialized applications; it is not one server or another name for Fusion ERP. Your first map should identify products, versions, owners, interfaces and shared data. A wrong price can start in Pricing and surface at a register even when both systems are running."},"flow":{"es":"Compra > Inventario > Precio > Venta > Conciliación","en":"Purchase > Inventory > Price > Sale > Reconciliation"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Dibuja qué sistemas participarían en vender una camiseta y qué dato intercambian.","en":"Draw the systems involved in selling a shirt and the data they exchange."},"job":{"es":"Mantendrás los componentes y sus conexiones, no necesariamente definirás políticas comerciales.","en":"You will maintain components and their connections, not necessarily define merchandising policies."},"diagram":"business"},{"id":"retail-foundations-02","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Qué significa soporte técnico de Retail frente a consultoría funcional?","en":"What does technical Retail support mean compared with functional consulting?"},"options":[{"text":{"es":"Operar la plataforma y diagnosticar fallas entendiendo el proceso comercial","en":"Operate the platform and diagnose failures while understanding the business process"},"correct":true,"feedback":{"es":"El consultor funcional configura reglas de negocio y valida resultados comerciales. El soporte técnico instala, monitorea, automatiza y diagnostica infraestructura, runtime, interfaces y datos con sus responsables. Hay colaboración y solapamiento, pero no debes decidir tolerancias de factura o descuentos sin el dueño funcional. El JD sugiere un rol de aplicaciones/plataforma; confirma alcance, permisos y escalaciones.","en":"A functional consultant configures business rules and validates commercial outcomes. Technical support installs, monitors, automates and diagnoses infrastructure, runtime, interfaces and data with their owners. There is overlap, but you should not decide invoice tolerances or discounts without the functional owner. The JD suggests an application/platform role; confirm scope, permissions and escalation paths."}},{"text":{"es":"Cambiar reglas comerciales libremente","en":"Change business rules freely"},"correct":false,"feedback":{"es":"La responsabilidad técnica no implica autoridad sobre políticas comerciales.","en":"Technical responsibility does not imply authority over business policies."}},{"text":{"es":"Ignorar negocio y revisar solo CPU","en":"Ignore business and check CPU only"},"correct":false,"feedback":{"es":"Sin proceso e impacto podrías restaurar un servidor sin restaurar ventas.","en":"Without process and impact you might restore a server without restoring sales."}}],"explanation":{"es":"El consultor funcional configura reglas de negocio y valida resultados comerciales. El soporte técnico instala, monitorea, automatiza y diagnostica infraestructura, runtime, interfaces y datos con sus responsables. Hay colaboración y solapamiento, pero no debes decidir tolerancias de factura o descuentos sin el dueño funcional. El JD sugiere un rol de aplicaciones/plataforma; confirma alcance, permisos y escalaciones.","en":"A functional consultant configures business rules and validates commercial outcomes. Technical support installs, monitors, automates and diagnoses infrastructure, runtime, interfaces and data with their owners. There is overlap, but you should not decide invoice tolerances or discounts without the functional owner. The JD suggests an application/platform role; confirm scope, permissions and escalation paths."},"flow":{"es":"Síntoma comercial > Dueño funcional > Evidencia técnica > Corrección aprobada","en":"Business symptom > Functional owner > Technical evidence > Approved correction"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Clasifica cinco tareas del JD entre negocio, plataforma y colaboración.","en":"Classify five JD duties as business, platform or collaboration."}},{"id":"retail-foundations-03","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Cómo se diferencia SKU de código de barras y estilo?","en":"How does an SKU differ from a barcode and a style?"},"options":[{"text":{"es":"SKU identifica una unidad comercial; estilo agrupa variantes y barcode ayuda a escanear","en":"SKU identifies a stock unit; style groups variants and a barcode supports scanning"},"correct":true,"feedback":{"es":"Una camisa puede tener estilo, color y talla; una combinación vendible puede ser un SKU. Un barcode es un identificador de escaneo asociado mediante el modelo de artículos. La jerarquía exacta depende de configuración y producto. En soporte, confundir identificadores provoca búsquedas vacías o mensajes mal relacionados. Confirma item ID, variante, unidad de medida, ubicación y vigencia antes de investigar stock o precio.","en":"A shirt can have a style, color and size; a sellable combination may be an SKU. A barcode is a scanning identifier associated through the item model. The exact hierarchy depends on configuration and product. In support, confusing identifiers causes empty searches or mismatched messages. Confirm item ID, variant, unit of measure, location and effective time before investigating stock or price."}},{"text":{"es":"Los tres identificadores siempre son iguales","en":"All three identifiers are always identical"},"correct":false,"feedback":{"es":"Su equivalencia depende del modelo y no debe asumirse.","en":"Equivalence depends on the model and must not be assumed."}},{"text":{"es":"SKU identifica al proveedor","en":"SKU identifies the supplier"},"correct":false,"feedback":{"es":"El proveedor es otra entidad maestra.","en":"The supplier is a separate master entity."}}],"explanation":{"es":"Una camisa puede tener estilo, color y talla; una combinación vendible puede ser un SKU. Un barcode es un identificador de escaneo asociado mediante el modelo de artículos. La jerarquía exacta depende de configuración y producto. En soporte, confundir identificadores provoca búsquedas vacías o mensajes mal relacionados. Confirma item ID, variante, unidad de medida, ubicación y vigencia antes de investigar stock o precio.","en":"A shirt can have a style, color and size; a sellable combination may be an SKU. A barcode is a scanning identifier associated through the item model. The exact hierarchy depends on configuration and product. In support, confusing identifiers causes empty searches or mismatched messages. Confirm item ID, variant, unit of measure, location and effective time before investigating stock or price."},"flow":{"es":"Estilo > Variante SKU > Barcode > Venta identificada","en":"Style > SKU variant > Barcode > Identified sale"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/latest/ritug/item-overview.htm","retail":true,"followup":{"es":"Usa camiseta roja talla M como ejemplo y distingue los tres identificadores.","en":"Use a red medium shirt to distinguish the three identifiers."}},{"id":"retail-foundations-04","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Qué datos maestros necesita un entorno Retail para funcionar?","en":"What master data does a Retail environment need?"},"options":[{"text":{"es":"Artículos, ubicaciones, proveedores y jerarquías consistentes","en":"Consistent items, locations, suppliers and hierarchies"},"correct":true,"feedback":{"es":"Datos maestros son entidades relativamente estables que las transacciones referencian. Una compra usa proveedor y artículo; una transferencia usa origen y destino; un precio usa artículo y ubicación. Que la aplicación arranque no prueba que estas referencias existan y estén aprobadas. En implementación valida carga, calidad, mapeo de códigos y sincronización antes de probar transacciones dependientes.","en":"Master data are relatively stable entities referenced by transactions. A purchase uses a supplier and item; a transfer uses origin and destination; a price uses an item and location. Application startup does not prove these references exist and are approved. During implementation validate loading, quality, code mapping and synchronization before testing dependent transactions."}},{"text":{"es":"Solo usuarios y contraseñas","en":"Only users and passwords"},"correct":false,"feedback":{"es":"Habilitan acceso pero no los datos comerciales necesarios.","en":"They enable access but not the required business data."}},{"text":{"es":"Solo ventas históricas","en":"Only historical sales"},"correct":false,"feedback":{"es":"Las ventas dependen de maestros y no los sustituyen.","en":"Sales depend on master data and do not replace it."}}],"explanation":{"es":"Datos maestros son entidades relativamente estables que las transacciones referencian. Una compra usa proveedor y artículo; una transferencia usa origen y destino; un precio usa artículo y ubicación. Que la aplicación arranque no prueba que estas referencias existan y estén aprobadas. En implementación valida carga, calidad, mapeo de códigos y sincronización antes de probar transacciones dependientes.","en":"Master data are relatively stable entities referenced by transactions. A purchase uses a supplier and item; a transfer uses origin and destination; a price uses an item and location. Application startup does not prove these references exist and are approved. During implementation validate loading, quality, code mapping and synchronization before testing dependent transactions."},"flow":{"es":"Maestros aprobados > Referencias válidas > Transacción > Integración","en":"Approved masters > Valid references > Transaction > Integration"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/latest/ritug/item-overview.htm","retail":true,"followup":{"es":"Explica por qué cargar una venta antes del artículo puede fallar.","en":"Explain why loading a sale before its item can fail."}},{"id":"retail-foundations-05","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Qué recorrido tiene la mercancía desde compra hasta factura?","en":"What journey does merchandise follow from purchasing to invoicing?"},"options":[{"text":{"es":"Orden de compra, recepción, inventario e invoice matching","en":"Purchase order, receipt, inventory and invoice matching"},"correct":true,"feedback":{"es":"La PO registra lo pedido; la recepción registra lo recibido; inventario refleja movimientos según las reglas; la factura indica lo que el proveedor cobra. No son eventos idénticos ni necesariamente simultáneos. Para un problema de conciliación reúne claves, cantidades, costos, moneda y fechas de los documentos. Una recepción pendiente puede explicar una factura sin match, sin que exista caída técnica.","en":"A PO records what was ordered; a receipt records what arrived; inventory reflects movements under the rules; an invoice records what the supplier charges. These events are not identical or necessarily simultaneous. For a reconciliation problem gather document keys, quantities, costs, currency and dates. A pending receipt can explain an unmatched invoice without a technical outage."}},{"text":{"es":"La factura demuestra recepción completa","en":"The invoice proves full receipt"},"correct":false,"feedback":{"es":"Cobro y recepción deben conciliarse, no asumirse iguales.","en":"Billing and receipt must be reconciled, not assumed identical."}},{"text":{"es":"Un ping exitoso garantiza el match","en":"A successful ping guarantees matching"},"correct":false,"feedback":{"es":"Conectividad no valida reglas ni documentos.","en":"Connectivity does not validate rules or documents."}}],"explanation":{"es":"La PO registra lo pedido; la recepción registra lo recibido; inventario refleja movimientos según las reglas; la factura indica lo que el proveedor cobra. No son eventos idénticos ni necesariamente simultáneos. Para un problema de conciliación reúne claves, cantidades, costos, moneda y fechas de los documentos. Una recepción pendiente puede explicar una factura sin match, sin que exista caída técnica.","en":"A PO records what was ordered; a receipt records what arrived; inventory reflects movements under the rules; an invoice records what the supplier charges. These events are not identical or necessarily simultaneous. For a reconciliation problem gather document keys, quantities, costs, currency and dates. A pending receipt can explain an unmatched invoice without a technical outage."},"flow":{"es":"PO > Recepción > Inventario > Factura > Match o discrepancia","en":"PO > Receipt > Inventory > Invoice > Match or discrepancy"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-invoice-matching-cloud/latest/rimog/integration.htm","retail":true,"followup":{"es":"Pedido 100, recibido 90, facturado 100: identifica qué comparar y a quién consultar.","en":"Ordered 100, received 90, invoiced 100: identify comparisons and owners."},"diagram":"invoice"},{"id":"retail-foundations-06","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Qué significa SOH y por qué no equivale a stock disponible para prometer?","en":"What does SOH mean and why is it not the same as available-to-promise stock?"},"options":[{"text":{"es":"Stock on hand es existencia; la disponibilidad considera reservas y restricciones","en":"Stock on hand is inventory held; availability considers reservations and constraints"},"correct":true,"feedback":{"es":"SOH representa existencia registrada. Disponibilidad para una venta puede descontar reservas, mercancía dañada o stock de seguridad, y considerar latencia de interfaces. No inventes una fórmula universal: identifica la regla del producto. Para una queja de stock compara mismo SKU/ubicación/hora, movimientos recientes, reservas y última actualización. Diferencias entre pantallas pueden ser desfase temporal o conceptos distintos.","en":"SOH represents recorded stock on hand. Availability for a sale may deduct reservations, damaged goods or safety stock, and reflect interface latency. Do not invent a universal formula: identify the product rule. For a stock complaint compare the same SKU/location/time, recent movements, reservations and last update. Different screens may show timing differences or different concepts."}},{"text":{"es":"SOH siempre puede venderse completo","en":"All SOH can always be sold"},"correct":false,"feedback":{"es":"Puede haber reservas o restricciones.","en":"There can be reservations or constraints."}},{"text":{"es":"Stock solo cambia al cerrar el día","en":"Stock only changes at day close"},"correct":false,"feedback":{"es":"Movimientos y actualizaciones dependen del flujo configurado.","en":"Movements and updates depend on the configured flow."}}],"explanation":{"es":"SOH representa existencia registrada. Disponibilidad para una venta puede descontar reservas, mercancía dañada o stock de seguridad, y considerar latencia de interfaces. No inventes una fórmula universal: identifica la regla del producto. Para una queja de stock compara mismo SKU/ubicación/hora, movimientos recientes, reservas y última actualización. Diferencias entre pantallas pueden ser desfase temporal o conceptos distintos.","en":"SOH represents recorded stock on hand. Availability for a sale may deduct reservations, damaged goods or safety stock, and reflect interface latency. Do not invent a universal formula: identify the product rule. For a stock complaint compare the same SKU/location/time, recent movements, reservations and last update. Different screens may show timing differences or different concepts."},"flow":{"es":"SOH > Reservas y restricciones > Disponibilidad calculada > Promesa","en":"SOH > Reservations and constraints > Calculated availability > Promise"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-order-broker-cloud/21.0/roboh/Locate_overview.htm","retail":true,"followup":{"es":"Con SOH 10 y 3 reservadas, propone una disponibilidad ilustrativa y declara supuestos.","en":"With SOH 10 and 3 reserved, propose illustrative availability and state assumptions."}},{"id":"retail-foundations-07","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"intermediate","kind":"concept","question":{"es":"¿Por qué la fecha comercial puede diferir de la fecha del sistema?","en":"Why can the business date differ from the system date?"},"options":[{"text":{"es":"El cierre comercial y las zonas horarias pueden agrupar ventas de otra forma","en":"Business close and time zones can group sales differently"},"correct":true,"feedback":{"es":"Una venta después de medianoche puede pertenecer al día comercial previo según operación. Compara timestamp con zona horaria, business date y ventana de cierre. Un archivo aparentemente faltante puede estar asociado a otro store/day. NTP sincroniza relojes técnicos pero no define el calendario comercial. No cambies fechas ni reabres días sin aprobación funcional y control de conciliación.","en":"A sale after midnight may belong to the prior business day under store operations. Compare the timestamp with its time zone, business date and closing window. An apparently missing file may belong to another store/day. NTP synchronizes technical clocks but does not define the business calendar. Do not change dates or reopen days without functional approval and reconciliation control."}},{"text":{"es":"Ambas fechas son siempre iguales","en":"Both dates are always identical"},"correct":false,"feedback":{"es":"El calendario comercial puede ser diferente.","en":"The business calendar can differ."}},{"text":{"es":"Cambiar el reloj del servidor corrige el cierre","en":"Changing the server clock fixes close"},"correct":false,"feedback":{"es":"Introduce más inconsistencias y no modifica una regla comercial correctamente.","en":"It adds inconsistencies and does not properly change a business rule."}}],"explanation":{"es":"Una venta después de medianoche puede pertenecer al día comercial previo según operación. Compara timestamp con zona horaria, business date y ventana de cierre. Un archivo aparentemente faltante puede estar asociado a otro store/day. NTP sincroniza relojes técnicos pero no define el calendario comercial. No cambies fechas ni reabres días sin aprobación funcional y control de conciliación.","en":"A sale after midnight may belong to the prior business day under store operations. Compare the timestamp with its time zone, business date and closing window. An apparently missing file may belong to another store/day. NTP synchronizes technical clocks but does not define the business calendar. Do not change dates or reopen days without functional approval and reconciliation control."},"flow":{"es":"Timestamp y zona > Business date > Store/day > Cierre validado","en":"Timestamp and zone > Business date > Store/day > Validated close"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/24.0.101.0/rsaat/sales-audit-overview.htm","retail":true,"followup":{"es":"Explica cómo buscarías una venta de las 00:15 sin asumir que pertenece al día nuevo.","en":"Explain how you would search for a 00:15 sale without assuming a new business day."}},{"id":"retail-foundations-08","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué es un batch window en Retail?","en":"What is a batch window in Retail?"},"options":[{"text":{"es":"Una ventana para ejecutar trabajos con dependencias y hora límite comercial","en":"A window for jobs with dependencies and a business deadline"},"correct":true,"feedback":{"es":"Batch procesa conjuntos de datos: ventas, precios, conciliaciones o interfaces. Algunos trabajos son secuenciales y otros pueden ejecutarse en paralelo de forma autorizada. Registra inicio, duración, filas/archivos, predecesores y deadline. CPU baja no significa avance: un trabajo puede esperar locks o archivos. El éxito técnico debe acompañarse de controles de cantidades y proceso posterior.","en":"Batch processes datasets such as sales, prices, reconciliations or interfaces. Some jobs are sequential; others can run in approved parallel groups. Record start time, duration, rows/files, predecessors and deadline. Low CPU does not mean progress: a job may wait for locks or files. Technical success must be accompanied by quantity checks and downstream completion."}},{"text":{"es":"Todos los jobs pueden reiniciarse juntos","en":"All jobs can be restarted together"},"correct":false,"feedback":{"es":"Puedes duplicar efectos o romper dependencias.","en":"You can duplicate effects or break dependencies."}},{"text":{"es":"Exit code 0 prueba conciliación perfecta","en":"Exit code 0 proves perfect reconciliation"},"correct":false,"feedback":{"es":"Se requieren controles del resultado comercial.","en":"Business-result checks are required."}}],"explanation":{"es":"Batch procesa conjuntos de datos: ventas, precios, conciliaciones o interfaces. Algunos trabajos son secuenciales y otros pueden ejecutarse en paralelo de forma autorizada. Registra inicio, duración, filas/archivos, predecesores y deadline. CPU baja no significa avance: un trabajo puede esperar locks o archivos. El éxito técnico debe acompañarse de controles de cantidades y proceso posterior.","en":"Batch processes datasets such as sales, prices, reconciliations or interfaces. Some jobs are sequential; others can run in approved parallel groups. Record start time, duration, rows/files, predecessors and deadline. Low CPU does not mean progress: a job may wait for locks or files. Technical success must be accompanied by quantity checks and downstream completion."},"flow":{"es":"Dependencias listas > Batch > Control de conteos > Downstream > Deadline","en":"Dependencies ready > Batch > Count checks > Downstream > Deadline"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Diseña una cadena de tres jobs y explica qué no ejecutarías si el primero falla.","en":"Design a three-job chain and explain what you would not run if the first fails."}},{"id":"retail-foundations-09","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué diferencia hay entre integridad técnica e integridad comercial?","en":"What is the difference between technical and business integrity?"},"options":[{"text":{"es":"Un commit correcto no garantiza que cantidades, precios y documentos sean correctos","en":"A successful commit does not guarantee correct quantities, prices and documents"},"correct":true,"feedback":{"es":"La BD puede preservar claves y transacciones mientras un mapeo aplica el precio a otra tienda. Integridad comercial exige validar unidades, monedas, impuestos, vigencias y significado del dato. Tu prueba debe cubrir transporte, procesamiento y resultado. Usa una transacción representativa y compara origen/destino con claves y controles; no basta observar HTTP 200 o un archivo generado.","en":"The DB can preserve keys and transactions while a mapping applies a price to the wrong store. Business integrity requires checking units, currencies, taxes, effective dates and data meaning. Your test must cover transport, processing and outcome. Use a representative transaction and compare source/destination keys and controls; HTTP 200 or a generated file is not enough."}},{"text":{"es":"HTTP 200 demuestra precio correcto","en":"HTTP 200 proves the price is correct"},"correct":false,"feedback":{"es":"Solo indica éxito según la semántica HTTP del endpoint.","en":"It only indicates success under the endpoint HTTP semantics."}},{"text":{"es":"Solo deben probarse claves primarias","en":"Only primary keys need testing"},"correct":false,"feedback":{"es":"No cubren todo el significado comercial.","en":"They do not cover all business meaning."}}],"explanation":{"es":"La BD puede preservar claves y transacciones mientras un mapeo aplica el precio a otra tienda. Integridad comercial exige validar unidades, monedas, impuestos, vigencias y significado del dato. Tu prueba debe cubrir transporte, procesamiento y resultado. Usa una transacción representativa y compara origen/destino con claves y controles; no basta observar HTTP 200 o un archivo generado.","en":"The DB can preserve keys and transactions while a mapping applies a price to the wrong store. Business integrity requires checking units, currencies, taxes, effective dates and data meaning. Your test must cover transport, processing and outcome. Use a representative transaction and compare source/destination keys and controls; HTTP 200 or a generated file is not enough."},"flow":{"es":"Transporte correcto > Commit > Regla comercial > Conciliación","en":"Correct transport > Commit > Business rule > Reconciliation"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Enumera controles para demostrar que un precio de 99 llegó a la tienda correcta.","en":"List checks proving that a price of 99 reached the correct store."}},{"id":"retail-foundations-10","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"basic","kind":"concept","question":{"es":"¿Cómo cambia tu trabajo entre Retail autogestionado y SaaS?","en":"How does your job differ between self-managed Retail and SaaS?"},"options":[{"text":{"es":"Depende de quién opera la plataforma y de tus permisos contratados","en":"It depends on who operates the platform and your contracted permissions"},"correct":true,"feedback":{"es":"En autogestionado podrías administrar Linux, WebLogic y despliegues. En SaaS el cliente suele configurar y consumir servicios mientras el proveedor opera parte de la plataforma; un operador del proveedor puede tener otras responsabilidades. Confirma RACI, contrato, consolas disponibles, acceso a logs, parches y procedimiento de SR. No asumas que soporte significa acceso SSH, SYSDBA o kubectl.","en":"In self-managed environments you may administer Linux, WebLogic and deployments. In SaaS the customer generally configures and consumes services while the provider operates part of the platform; a provider operator may have different duties. Confirm the RACI, contract, available consoles, log access, patches and SR procedure. Support does not automatically imply SSH, SYSDBA or kubectl access."}},{"text":{"es":"Todo SaaS permite SSH a producción","en":"Every SaaS allows production SSH"},"correct":false,"feedback":{"es":"El acceso puede estar restringido al proveedor.","en":"Access may be restricted to the provider."}},{"text":{"es":"SaaS elimina necesidad de troubleshooting","en":"SaaS removes the need for troubleshooting"},"correct":false,"feedback":{"es":"Persisten configuración, datos, interfaces e incidentes.","en":"Configuration, data, interfaces and incidents remain."}}],"explanation":{"es":"En autogestionado podrías administrar Linux, WebLogic y despliegues. En SaaS el cliente suele configurar y consumir servicios mientras el proveedor opera parte de la plataforma; un operador del proveedor puede tener otras responsabilidades. Confirma RACI, contrato, consolas disponibles, acceso a logs, parches y procedimiento de SR. No asumas que soporte significa acceso SSH, SYSDBA o kubectl.","en":"In self-managed environments you may administer Linux, WebLogic and deployments. In SaaS the customer generally configures and consumes services while the provider operates part of the platform; a provider operator may have different duties. Confirm the RACI, contract, available consoles, log access, patches and SR procedure. Support does not automatically imply SSH, SYSDBA or kubectl access."},"flow":{"es":"Modelo de servicio > RACI > Permisos > Runbook > Acción autorizada","en":"Service model > RACI > Permissions > Runbook > Authorized action"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Pregunta al hiring manager qué tareas hace su equipo y cuáles Oracle o el cliente.","en":"Ask the hiring manager which tasks their team performs versus Oracle or the customer."},"diagram":"topology"},{"id":"retail-foundations-11","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué debes preguntar antes de estudiar una versión concreta de Retail?","en":"What should you ask before studying a specific Retail version?"},"options":[{"text":{"es":"Producto, release, despliegue, integraciones y límites operativos","en":"Product, release, deployment, integrations and operating boundaries"},"correct":true,"feedback":{"es":"RMS y nombres modernos de servicios no garantizan la misma arquitectura. Pide inventario: releases, JDK, WebLogic o runtime, Oracle DB, cloud, scheduler y componentes de integración. Confirma soporte/certificación en documentación de ese release. El término CNE del JD no identifica por sí solo una distribución Kubernetes y no equivale automáticamente a Oracle Linux OCNE ni a Oracle Communications CNE.","en":"RMS and modern service names do not guarantee identical architecture. Request an inventory: releases, JDK, WebLogic or runtime, Oracle DB, cloud, scheduler and integration components. Confirm support/certification in documentation for that release. The JD term CNE alone does not identify a Kubernetes distribution and does not automatically mean Oracle Linux OCNE or Oracle Communications CNE."}},{"text":{"es":"Elegir siempre la versión más nueva del JDK","en":"Always choose the newest JDK"},"correct":false,"feedback":{"es":"Podría no estar certificada para ese release.","en":"It may not be certified for that release."}},{"text":{"es":"Usar cualquier guía que diga Oracle","en":"Use any guide mentioning Oracle"},"correct":false,"feedback":{"es":"Los procedimientos no son intercambiables entre productos.","en":"Procedures are not interchangeable across products."}}],"explanation":{"es":"RMS y nombres modernos de servicios no garantizan la misma arquitectura. Pide inventario: releases, JDK, WebLogic o runtime, Oracle DB, cloud, scheduler y componentes de integración. Confirma soporte/certificación en documentación de ese release. El término CNE del JD no identifica por sí solo una distribución Kubernetes y no equivale automáticamente a Oracle Linux OCNE ni a Oracle Communications CNE.","en":"RMS and modern service names do not guarantee identical architecture. Request an inventory: releases, JDK, WebLogic or runtime, Oracle DB, cloud, scheduler and integration components. Confirm support/certification in documentation for that release. The JD term CNE alone does not identify a Kubernetes distribution and does not automatically mean Oracle Linux OCNE or Oracle Communications CNE."},"flow":{"es":"Inventario > Release exacto > Documentación > Matriz certificada > Plan","en":"Inventory > Exact release > Documentation > Certified matrix > Plan"},"code":"","output":null,"source":"https://docs.oracle.com/cd/E12448_01/rms/pdf/160/html/installation_guide/rms-160-ig.html","retail":true,"followup":{"es":"Prepara un correo en inglés solicitando versiones y topología sin asumir nada.","en":"Prepare an English email requesting versions and topology without assumptions."}},{"id":"retail-foundations-12","section":"retail-foundations","sectionLabel":{"es":"Retail · Bases y negocio","en":"Retail · Foundations and business"},"level":"intermediate","kind":"behavioral","question":{"es":"¿Cómo conectarías tu perfil con este JD sin inventar experiencia Retail?","en":"How would you connect your profile to this JD without inventing Retail experience?"},"options":[{"text":{"es":"Relacionar WebLogic, Linux, OCI, releases y Bash; declarar Retail como aprendizaje","en":"Relate WebLogic, Linux, OCI, releases and Bash; state Retail as a learning area"},"correct":true,"feedback":{"es":"Tu CV aporta soporte L2/L3, WebLogic, OCI, coordinación de releases y automatización Bash en Oracle; DB2 LUW, HADR, recuperación y performance en IBM. Es transferible al diagnóstico por capas, control de cambios y operación crítica. No demuestra dominio de RMS, ReSA o ReIM. Respuesta honesta: conozco los fundamentos de la plataforma y estoy aprendiendo sus flujos comerciales, versiones e interfaces mediante documentación y laboratorios.","en":"Your CV brings L2/L3 support, WebLogic, OCI, release coordination and Bash automation at Oracle; DB2 LUW, HADR, recovery and performance at IBM. This transfers to layered diagnosis, change control and critical operations. It does not prove mastery of RMS, ReSA or ReIM. An honest answer is: I know the platform foundations and am learning its business flows, versions and interfaces through documentation and labs."}},{"text":{"es":"Decir que Fusion equivale a administrar RMS","en":"Say that Fusion equals administering RMS"},"correct":false,"feedback":{"es":"Son experiencias distintas aunque compartan conceptos.","en":"They are different experiences despite shared concepts."}},{"text":{"es":"Ocultar toda experiencia DB2 por no ser Oracle DB","en":"Hide all DB2 experience because it is not Oracle DB"},"correct":false,"feedback":{"es":"Diagnóstico y HA transfieren, aunque sintaxis y herramientas deben aprenderse.","en":"Diagnosis and HA transfer, although syntax and tools need learning."}}],"explanation":{"es":"Tu CV aporta soporte L2/L3, WebLogic, OCI, coordinación de releases y automatización Bash en Oracle; DB2 LUW, HADR, recuperación y performance en IBM. Es transferible al diagnóstico por capas, control de cambios y operación crítica. No demuestra dominio de RMS, ReSA o ReIM. Respuesta honesta: conozco los fundamentos de la plataforma y estoy aprendiendo sus flujos comerciales, versiones e interfaces mediante documentación y laboratorios.","en":"Your CV brings L2/L3 support, WebLogic, OCI, release coordination and Bash automation at Oracle; DB2 LUW, HADR, recovery and performance at IBM. This transfers to layered diagnosis, change control and critical operations. It does not prove mastery of RMS, ReSA or ReIM. An honest answer is: I know the platform foundations and am learning its business flows, versions and interfaces through documentation and labs."},"flow":{"es":"Experiencia comprobada > Fundamento transferible > Brecha Retail > Laboratorio > Evidencia","en":"Verified experience > Transferable foundation > Retail gap > Lab > Evidence"},"code":"","output":null,"source":"https://docs.oracle.com/en/solutions/learn-implement-rms-on-oci/plan-your-deployment1.html","retail":true,"followup":{"es":"Graba una respuesta de 60 segundos: dos fortalezas, una brecha y un plan concreto.","en":"Record a 60-second answer: two strengths, one gap and a concrete plan."}},{"id":"retail-products-01","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué proceso central cubre RMS / Merchandising?","en":"What core process does RMS / Merchandising cover?"},"options":[{"text":{"es":"Gestionar información y transacciones de mercancía a lo largo de su ciclo","en":"Manage merchandise information and transactions across its lifecycle"},"correct":true,"feedback":{"es":"Merchandising organiza artículos, proveedores, ubicaciones y operaciones de mercancía. RMS es un nombre habitual en entornos tradicionales; servicios cloud usan otros nombres según release. Aprende cómo una entidad maestra habilita compras y movimientos. En soporte verificarás errores, interfaces, batch y rendimiento con el responsable funcional; no necesitas empezar memorizando todas las tablas del producto.","en":"Merchandising organizes items, suppliers, locations and merchandise operations. RMS is a familiar traditional name; cloud services use other names depending on release. Learn how a master entity enables purchases and movements. In support you will check errors, interfaces, batch and performance with the functional owner; you do not need to start by memorizing every product table."}},{"text":{"es":"Gestiona únicamente perfiles de clientes","en":"It only manages customer profiles"},"correct":false,"feedback":{"es":"Esa responsabilidad se asocia a Customer Engagement.","en":"That responsibility relates to Customer Engagement."}},{"text":{"es":"Es exclusivamente el servidor WebLogic","en":"It is exclusively the WebLogic server"},"correct":false,"feedback":{"es":"WebLogic es runtime; Merchandising es aplicación de negocio.","en":"WebLogic is a runtime; Merchandising is a business application."}}],"explanation":{"es":"Merchandising organiza artículos, proveedores, ubicaciones y operaciones de mercancía. RMS es un nombre habitual en entornos tradicionales; servicios cloud usan otros nombres según release. Aprende cómo una entidad maestra habilita compras y movimientos. En soporte verificarás errores, interfaces, batch y rendimiento con el responsable funcional; no necesitas empezar memorizando todas las tablas del producto.","en":"Merchandising organizes items, suppliers, locations and merchandise operations. RMS is a familiar traditional name; cloud services use other names depending on release. Learn how a master entity enables purchases and movements. In support you will check errors, interfaces, batch and performance with the functional owner; you do not need to start by memorizing every product table."},"flow":{"es":"Artículo > Proveedor > Compra > Movimiento > Existencia","en":"Item > Supplier > Purchase > Movement > Stock"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/latest/ritug/item-overview.htm","retail":true,"followup":{"es":"Identifica tres procesos que dependen de que un artículo esté configurado correctamente.","en":"Identify three processes that require a correctly configured item."},"diagram":"business"},{"id":"retail-products-02","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué hace ReSA / Sales Audit con datos de ventas?","en":"What does ReSA / Sales Audit do with sales data?"},"options":[{"text":{"es":"Validar y conciliar ventas antes de distribuir resultados confiables","en":"Validate and reconcile sales before distributing reliable results"},"correct":true,"feedback":{"es":"ReSA es Retail Sales Audit. Revisa información de ventas, totales y excepciones del día de tienda para detectar inconsistencias antes de su consumo posterior. No es simplemente una caja de cobro. Un incidente puede ser técnico, como archivo no cargado, o funcional, como totales que no balancean. Distingue recepción, validación, auditoría y exportación para ubicar la etapa detenida.","en":"ReSA means Retail Sales Audit. It checks sales information, totals and store-day exceptions to identify inconsistencies before downstream consumption. It is not simply a checkout register. An incident may be technical, such as an unloaded file, or functional, such as totals that do not balance. Separate receipt, validation, audit and export to locate the stalled stage."}},{"text":{"es":"Captura todos los pagos del cliente en tiempo real","en":"It captures every customer payment in real time"},"correct":false,"feedback":{"es":"Auditar ventas y autorizar pagos son funciones diferentes.","en":"Auditing sales and authorizing payments are different functions."}},{"text":{"es":"Solo monitorea CPU","en":"It only monitors CPU"},"correct":false,"feedback":{"es":"Tiene reglas y controles comerciales.","en":"It has business rules and controls."}}],"explanation":{"es":"ReSA es Retail Sales Audit. Revisa información de ventas, totales y excepciones del día de tienda para detectar inconsistencias antes de su consumo posterior. No es simplemente una caja de cobro. Un incidente puede ser técnico, como archivo no cargado, o funcional, como totales que no balancean. Distingue recepción, validación, auditoría y exportación para ubicar la etapa detenida.","en":"ReSA means Retail Sales Audit. It checks sales information, totals and store-day exceptions to identify inconsistencies before downstream consumption. It is not simply a checkout register. An incident may be technical, such as an unloaded file, or functional, such as totals that do not balance. Separate receipt, validation, audit and export to locate the stalled stage."},"flow":{"es":"POS / OMS > Ventas recibidas > Validación > Auditoría > Exportación","en":"POS / OMS > Sales received > Validation > Audit > Export"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/24.0.101.0/rsaat/sales-audit-overview.htm","retail":true,"followup":{"es":"Un día no cierra: explica cómo distingues archivo faltante de excepción comercial.","en":"A day will not close: explain how to distinguish a missing file from a business exception."}},{"id":"retail-products-03","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué representa RTLOG en el flujo de Sales Audit?","en":"What does RTLOG represent in the Sales Audit flow?"},"options":[{"text":{"es":"Un formato de intercambio de transacciones retail usado por el flujo compatible","en":"A retail transaction exchange format used by the compatible flow"},"correct":true,"feedback":{"es":"En flujos documentados, RTLOG lleva ventas de POS/OMS hacia Sales Audit. Su presencia no demuestra procesamiento ni conciliación. Para diagnosticar confirma especificación del release, naming, entrega, formato, tienda/día, conteos y errores del importador. No asumas que toda instalación usa el mismo transporte o idéntico layout; puede haber transformaciones y contratos particulares.","en":"In documented flows, RTLOG carries POS/OMS sales into Sales Audit. Its presence does not prove processing or reconciliation. Diagnose against the release specification: naming, delivery, format, store/day, counts and importer errors. Do not assume every installation uses the same transport or layout; transformations and specific contracts may exist."}},{"text":{"es":"Es el log técnico de garbage collection","en":"It is the garbage-collection technical log"},"correct":false,"feedback":{"es":"No equivale al GC log de la JVM.","en":"It is not the JVM GC log."}},{"text":{"es":"Archivo recibido significa día balanceado","en":"A received file means a balanced day"},"correct":false,"feedback":{"es":"Aún faltan carga y reglas de auditoría.","en":"Loading and audit rules still need validation."}}],"explanation":{"es":"En flujos documentados, RTLOG lleva ventas de POS/OMS hacia Sales Audit. Su presencia no demuestra procesamiento ni conciliación. Para diagnosticar confirma especificación del release, naming, entrega, formato, tienda/día, conteos y errores del importador. No asumas que toda instalación usa el mismo transporte o idéntico layout; puede haber transformaciones y contratos particulares.","en":"In documented flows, RTLOG carries POS/OMS sales into Sales Audit. Its presence does not prove processing or reconciliation. Diagnose against the release specification: naming, delivery, format, store/day, counts and importer errors. Do not assume every installation uses the same transport or layout; transformations and specific contracts may exist."},"flow":{"es":"Transacciones > RTLOG > Entrega > Importación > Controles","en":"Transactions > RTLOG > Delivery > Import > Controls"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-merchandising-foundation-cloud/24.0.101.0/rsaat/sales-audit-overview.htm","retail":true,"followup":{"es":"Archivo existe pero no hay ventas visibles: enumera cuatro pruebas y su resultado esperado.","en":"A file exists but sales are not visible: list four tests and expected results."}},{"id":"retail-products-04","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué diferencias hay entre precio regular, clearance y promoción en RPM / Pricing?","en":"What differs between regular price, clearance and promotions in RPM / Pricing?"},"options":[{"text":{"es":"Precio base, rebaja de liquidación y oferta temporal según reglas","en":"Base price, clearance markdown and temporary offer under rules"},"correct":true,"feedback":{"es":"RPM significa Retail Price Management, un nombre tradicional; confirma el producto de Pricing de tu release. Los eventos usan artículos, ubicaciones y fechas. Precio regular cambia la base; clearance rebaja para liquidación; promoción es una oferta temporal. Para una queja recopila evento aprobado, vigencia, zona/tienda, timezone y evidencia downstream; un valor aislado no demuestra el precio final.","en":"RPM means Retail Price Management, a traditional name; confirm the Pricing product in your release. Events use items, locations and dates. Regular price changes affect the base; clearance marks down for liquidation; promotions are temporary offers. For a complaint gather the approved event, effective time, zone/store, time zone and downstream evidence; one isolated value does not prove the final price."}},{"text":{"es":"Los tres eventos son idénticos","en":"The three events are identical"},"correct":false,"feedback":{"es":"Intención, vigencia y reglas pueden diferir.","en":"Purpose, effective dates and rules can differ."}},{"text":{"es":"ReSA define cualquier precio aprobado","en":"ReSA defines every approved price"},"correct":false,"feedback":{"es":"Sales Audit revisa ventas; Pricing administra eventos de precio.","en":"Sales Audit checks sales; Pricing manages price events."}}],"explanation":{"es":"RPM significa Retail Price Management, un nombre tradicional; confirma el producto de Pricing de tu release. Los eventos usan artículos, ubicaciones y fechas. Precio regular cambia la base; clearance rebaja para liquidación; promoción es una oferta temporal. Para una queja recopila evento aprobado, vigencia, zona/tienda, timezone y evidencia downstream; un valor aislado no demuestra el precio final.","en":"RPM means Retail Price Management, a traditional name; confirm the Pricing product in your release. Events use items, locations and dates. Regular price changes affect the base; clearance marks down for liquidation; promotions are temporary offers. For a complaint gather the approved event, effective time, zone/store, time zone and downstream evidence; one isolated value does not prove the final price."},"flow":{"es":"Evento > Aprobación > Vigencia > Distribución > Precio efectivo","en":"Event > Approval > Effective time > Distribution > Effective price"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-pricing-cloud/latest/pcsog/introduction.htm","retail":true,"followup":{"es":"Propón qué revisarías para una promoción que sigue activa después de terminar.","en":"Propose checks for a promotion that remains active after its end."}},{"id":"retail-products-05","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué intenta conciliar ReIM / Invoice Matching?","en":"What does ReIM / Invoice Matching reconcile?"},"options":[{"text":{"es":"Lo facturado por proveedor con documentos de compra y recepción aplicables","en":"Supplier invoices with applicable purchasing and receipt documents"},"correct":true,"feedback":{"es":"ReIM busca coincidencias bajo reglas y tolerancias, e identifica discrepancias para resolución. La factura, orden y recepción pueden diferir legítimamente por entregas parciales o costos. Revisa referencia documental, cantidad, costo, moneda y estado antes de culpar al sistema. No fuerces un match con SQL ni aumentes tolerancias como arreglo técnico sin autorización del negocio.","en":"ReIM seeks matches under rules and tolerances and identifies discrepancies for resolution. An invoice, order and receipt may legitimately differ because of partial deliveries or costs. Check document references, quantity, cost, currency and status before blaming the system. Do not force a match with SQL or increase tolerances as a technical fix without business authorization."}},{"text":{"es":"Empareja solo usuarios con roles","en":"It only matches users to roles"},"correct":false,"feedback":{"es":"Su función central es conciliación de facturas.","en":"Its core function is invoice matching."}},{"text":{"es":"Siempre debe pagar aunque falte recepción","en":"It must always pay even without a receipt"},"correct":false,"feedback":{"es":"El resultado depende de reglas y aprobación, no de una suposición del operador.","en":"The outcome depends on rules and approval, not an operator assumption."}}],"explanation":{"es":"ReIM busca coincidencias bajo reglas y tolerancias, e identifica discrepancias para resolución. La factura, orden y recepción pueden diferir legítimamente por entregas parciales o costos. Revisa referencia documental, cantidad, costo, moneda y estado antes de culpar al sistema. No fuerces un match con SQL ni aumentes tolerancias como arreglo técnico sin autorización del negocio.","en":"ReIM seeks matches under rules and tolerances and identifies discrepancies for resolution. An invoice, order and receipt may legitimately differ because of partial deliveries or costs. Check document references, quantity, cost, currency and status before blaming the system. Do not force a match with SQL or increase tolerances as a technical fix without business authorization."},"flow":{"es":"Factura > PO / Recepción > Comparación > Match o discrepancia > Resolución","en":"Invoice > PO / Receipt > Comparison > Match or discrepancy > Resolution"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-invoice-matching-cloud/latest/rimog/integration.htm","retail":true,"followup":{"es":"Explica por qué una discrepancia de costo no se arregla reiniciando WebLogic.","en":"Explain why restarting WebLogic does not fix a cost discrepancy."},"diagram":"invoice"},{"id":"retail-products-06","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué decisión ayuda a tomar Allocation?","en":"What decision does Allocation help make?"},"options":[{"text":{"es":"Cómo distribuir mercancía disponible entre destinos según necesidad y reglas","en":"How to distribute available merchandise among destinations based on need and rules"},"correct":true,"feedback":{"es":"Allocation combina disponibilidad, demanda/necesidad y restricciones para proponer distribución. La necesidad bruta y neta no son iguales: esta última considera inventario aplicable según política. Para un resultado extraño valida datos de entrada, unidades, destinos, horizonte y política con negocio. Un cálculo completado puede ser técnicamente sano y comercialmente inesperado por configuración.","en":"Allocation combines availability, demand/need and constraints to propose distribution. Gross and net need differ: net need considers applicable inventory under policy. For an unexpected result validate inputs, units, destinations, horizon and policy with the business. A completed calculation may be technically healthy yet commercially unexpected because of configuration."}},{"text":{"es":"Es un balanceador HTTP","en":"It is an HTTP load balancer"},"correct":false,"feedback":{"es":"Distribuye mercancía, no peticiones web.","en":"It distributes merchandise, not web requests."}},{"text":{"es":"Siempre reparte cantidades iguales","en":"It always distributes equal quantities"},"correct":false,"feedback":{"es":"Depende de políticas y necesidades.","en":"It depends on policies and needs."}}],"explanation":{"es":"Allocation combina disponibilidad, demanda/necesidad y restricciones para proponer distribución. La necesidad bruta y neta no son iguales: esta última considera inventario aplicable según política. Para un resultado extraño valida datos de entrada, unidades, destinos, horizonte y política con negocio. Un cálculo completado puede ser técnicamente sano y comercialmente inesperado por configuración.","en":"Allocation combines availability, demand/need and constraints to propose distribution. Gross and net need differ: net need considers applicable inventory under policy. For an unexpected result validate inputs, units, destinations, horizon and policy with the business. A completed calculation may be technically healthy yet commercially unexpected because of configuration."},"flow":{"es":"Demanda > Inventario aplicable > Necesidad neta > Disponibilidad > Asignación","en":"Demand > Applicable inventory > Net need > Availability > Allocation"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-allocation-cloud/latest/ralim/allocation-overview.htm","retail":true,"followup":{"es":"Dos tiendas necesitan stock y solo hay 50 unidades: qué datos pedirías antes de distribuirlas.","en":"Two stores need stock and only 50 units exist: which data would you request first?"}},{"id":"retail-products-07","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué significa Planning y qué papel tiene RPAS / RPASCE?","en":"What does Planning mean and what is the role of RPAS / RPASCE?"},"options":[{"text":{"es":"Planear decisiones con medidas, dimensiones y reglas en soluciones compatibles","en":"Plan decisions using measures, dimensions and rules in compatible solutions"},"correct":true,"feedback":{"es":"Planning estima y organiza necesidades futuras: inventario, compras o surtido según solución. RPAS significa Retail Predictive Application Server; RPASCE es Cloud Edition. Las soluciones usan dimensiones y medidas, por ejemplo ventas por producto/tienda/semana, y reglas de cálculo. Soporte verifica carga, ejecución, accesos y rendimiento; validar un forecast exige también conocimiento funcional y de datos.","en":"Planning estimates and organizes future needs such as inventory, buying or assortment depending on the solution. RPAS means Retail Predictive Application Server; RPASCE is Cloud Edition. Solutions use dimensions and measures, for example sales by product/store/week, and calculation rules. Support checks loading, execution, access and performance; validating a forecast also requires functional and data knowledge."}},{"text":{"es":"Es únicamente seguimiento de pedidos en vivo","en":"It is only live order tracking"},"correct":false,"feedback":{"es":"Planning y ejecución de pedidos tienen objetivos distintos.","en":"Planning and order execution have different goals."}},{"text":{"es":"Todo Planning utiliza exactamente la misma plataforma","en":"All Planning uses exactly the same platform"},"correct":false,"feedback":{"es":"Confirma solución y arquitectura del release.","en":"Confirm the solution and release architecture."}}],"explanation":{"es":"Planning estima y organiza necesidades futuras: inventario, compras o surtido según solución. RPAS significa Retail Predictive Application Server; RPASCE es Cloud Edition. Las soluciones usan dimensiones y medidas, por ejemplo ventas por producto/tienda/semana, y reglas de cálculo. Soporte verifica carga, ejecución, accesos y rendimiento; validar un forecast exige también conocimiento funcional y de datos.","en":"Planning estimates and organizes future needs such as inventory, buying or assortment depending on the solution. RPAS means Retail Predictive Application Server; RPASCE is Cloud Edition. Solutions use dimensions and measures, for example sales by product/store/week, and calculation rules. Support checks loading, execution, access and performance; validating a forecast also requires functional and data knowledge."},"flow":{"es":"Histórico > Dimensiones y medidas > Reglas > Plan > Aprobación","en":"History > Dimensions and measures > Rules > Plan > Approval"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-predictive-application-server-cloud-edition/24.2.401.0/rcmss/solutions.htm","retail":true,"followup":{"es":"Distingue problema de dato faltante, cálculo fallido y forecast comercial inesperado.","en":"Distinguish missing data, a failed calculation and an unexpected business forecast."}},{"id":"retail-products-08","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué etapas operativas tiene Order Management?","en":"What operational stages does Order Management have?"},"options":[{"text":{"es":"Captura, validación, asignación, fulfillment y seguimiento según integración","en":"Capture, validation, assignment, fulfillment and tracking depending on integration"},"correct":true,"feedback":{"es":"Un pedido conecta cliente, artículos, pago, disponibilidad y entrega. Soporte correlaciona order ID y estados entre componentes, incluyendo reintentos y compensaciones. La suite actual documenta Order Administration como nombre antes usado para OMS Cloud y Order Orchestration para Order Broker Cloud; instalaciones anteriores conservan su nomenclatura. Confirma release y no sustituyas nombres o APIs en un runbook sin validarlos.","en":"An order connects the customer, items, payment, availability and delivery. Support correlates order IDs and states across components, including retries and compensation. The current suite documents Order Administration as the former OMS Cloud name and Order Orchestration as the former Order Broker Cloud name; older installations retain their terminology. Confirm the release and do not replace runbook names or APIs without validation."}},{"text":{"es":"HTTP 200 demuestra entrega física","en":"HTTP 200 proves physical delivery"},"correct":false,"feedback":{"es":"La entrega es una etapa posterior con evidencia propia.","en":"Delivery is a downstream stage with its own evidence."}},{"text":{"es":"Es lo mismo que auditoría diaria de ventas","en":"It is the same as daily sales audit"},"correct":false,"feedback":{"es":"Pueden integrarse pero ejecutan funciones distintas.","en":"They may integrate but perform different functions."}}],"explanation":{"es":"Un pedido conecta cliente, artículos, pago, disponibilidad y entrega. Soporte correlaciona order ID y estados entre componentes, incluyendo reintentos y compensaciones. La suite actual documenta Order Administration como nombre antes usado para OMS Cloud y Order Orchestration para Order Broker Cloud; instalaciones anteriores conservan su nomenclatura. Confirma release y no sustituyas nombres o APIs en un runbook sin validarlos.","en":"An order connects the customer, items, payment, availability and delivery. Support correlates order IDs and states across components, including retries and compensation. The current suite documents Order Administration as the former OMS Cloud name and Order Orchestration as the former Order Broker Cloud name; older installations retain their terminology. Confirm the release and do not replace runbook names or APIs without validation."},"flow":{"es":"Pedido > Validación > Asignación > Fulfillment > Estado final","en":"Order > Validation > Assignment > Fulfillment > Final state"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-oms-suite-cloud/26.1.101.0/","retail":true,"followup":{"es":"Un pedido pagado no fue enviado: dibuja estados y dueños que consultarías.","en":"A paid order was not shipped: draw the states and owners you would check."}},{"id":"retail-products-09","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Para qué sirve Order Broker / Order Orchestration?","en":"What is Order Broker / Order Orchestration used for?"},"options":[{"text":{"es":"Visibilidad y enrutamiento hacia ubicaciones de fulfillment según configuración","en":"Visibility and routing to fulfillment locations under configured rules"},"correct":true,"feedback":{"es":"En flujos de omnicanal, el cliente compra por un canal y recibe o recoge desde otro. El broker usa disponibilidad y reglas para localizar opciones de fulfillment. Para un enrutamiento inesperado revisa inventario publicado, elegibilidad de tienda, prioridades, horarios y actualización. No significa que el broker registre cada movimiento físico ni que su disponibilidad sea instantánea.","en":"In omnichannel flows a customer buys through one channel and receives or collects through another. The broker uses availability and rules to locate fulfillment options. For unexpected routing check published inventory, store eligibility, priorities, hours and freshness. This does not mean the broker records every physical movement or that availability is instantaneous."}},{"text":{"es":"Su única función es generar facturas de proveedor","en":"Its only function is supplier invoicing"},"correct":false,"feedback":{"es":"Eso corresponde a otro proceso.","en":"That belongs to a different process."}},{"text":{"es":"Garantiza que el stock publicado nunca esté atrasado","en":"It guarantees published stock is never stale"},"correct":false,"feedback":{"es":"La latencia de integración debe medirse.","en":"Integration latency must be measured."}}],"explanation":{"es":"En flujos de omnicanal, el cliente compra por un canal y recibe o recoge desde otro. El broker usa disponibilidad y reglas para localizar opciones de fulfillment. Para un enrutamiento inesperado revisa inventario publicado, elegibilidad de tienda, prioridades, horarios y actualización. No significa que el broker registre cada movimiento físico ni que su disponibilidad sea instantánea.","en":"In omnichannel flows a customer buys through one channel and receives or collects through another. The broker uses availability and rules to locate fulfillment options. For unexpected routing check published inventory, store eligibility, priorities, hours and freshness. This does not mean the broker records every physical movement or that availability is instantaneous."},"flow":{"es":"Pedido omnicanal > Disponibilidad > Reglas > Ubicación elegida > Fulfillment","en":"Omnichannel order > Availability > Rules > Selected location > Fulfillment"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-order-broker-cloud/21.0/roboh/Locate_overview.htm","retail":true,"followup":{"es":"Explica BOPIS y qué verificarías si una tienda no aparece para recoger un pedido.","en":"Explain BOPIS and what to check if a store is unavailable for pickup."}},{"id":"retail-products-10","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"basic","kind":"concept","question":{"es":"¿Qué gestiona Oracle Retail Customer Engagement?","en":"What does Oracle Retail Customer Engagement manage?"},"options":[{"text":{"es":"Información y relación con clientes, con capacidades de fidelización según módulos","en":"Customer information and relationships, including loyalty capabilities by module"},"correct":true,"feedback":{"es":"Customer Engagement puede incluir perfiles, segmentación, campañas, lealtad y otros módulos según contrato/release. Una falla de beneficios puede provenir de identificación, regla de campaña o integración, no necesariamente del POS. Protege datos personales: usa IDs de prueba, minimiza logs y aplica permisos. Investiga un beneficio por cliente/evento/hora y confirma elegibilidad con el dueño funcional.","en":"Customer Engagement can include profiles, segmentation, campaigns, loyalty and other modules depending on contract/release. A benefit failure may come from identification, campaign rules or integration rather than the POS. Protect personal data: use test IDs, minimize logs and enforce permissions. Investigate benefits by customer/event/time and confirm eligibility with the functional owner."}},{"text":{"es":"Gestiona solamente stock de almacén","en":"It only manages warehouse stock"},"correct":false,"feedback":{"es":"Ese no es su propósito central.","en":"That is not its core purpose."}},{"text":{"es":"Permite compartir PII sin controles para depurar","en":"It allows uncontrolled PII sharing for debugging"},"correct":false,"feedback":{"es":"Soporte no elimina obligaciones de privacidad.","en":"Support does not remove privacy obligations."}}],"explanation":{"es":"Customer Engagement puede incluir perfiles, segmentación, campañas, lealtad y otros módulos según contrato/release. Una falla de beneficios puede provenir de identificación, regla de campaña o integración, no necesariamente del POS. Protege datos personales: usa IDs de prueba, minimiza logs y aplica permisos. Investiga un beneficio por cliente/evento/hora y confirma elegibilidad con el dueño funcional.","en":"Customer Engagement can include profiles, segmentation, campaigns, loyalty and other modules depending on contract/release. A benefit failure may come from identification, campaign rules or integration rather than the POS. Protect personal data: use test IDs, minimize logs and enforce permissions. Investigate benefits by customer/event/time and confirm eligibility with the functional owner."},"flow":{"es":"Cliente identificado > Regla de beneficio > Evento > Integración > Resultado","en":"Identified customer > Benefit rule > Event > Integration > Outcome"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-customer-engagement/19.0/index.html","retail":true,"followup":{"es":"Diseña una prueba de puntos de lealtad que no exponga datos de un cliente real.","en":"Design a loyalty-point test that does not expose real customer data."}},{"id":"retail-products-11","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué sistemas pueden rodear a Retail sin ser el mismo producto?","en":"What systems can surround Retail without being the same product?"},"options":[{"text":{"es":"POS, ecommerce, WMS, pagos y ERP financiero mediante interfaces","en":"POS, ecommerce, WMS, payments and financial ERP through interfaces"},"correct":true,"feedback":{"es":"POS registra ventas, WMS ejecuta operaciones de almacén y sistemas financieros reciben información contable según diseño. Ecommerce y pagos agregan dependencias. Dibuja contratos y responsables por frontera. No asumas que Oracle Retail cubre cada componente o que todos comparten BD. Un mapa permite dirigir una evidencia concreta al equipo correcto y probar el recorrido completo.","en":"POS records sales, WMS executes warehouse operations and financial systems receive accounting information under the design. Ecommerce and payments add dependencies. Draw contracts and owners at each boundary. Do not assume Oracle Retail covers every component or that they share one DB. A map routes concrete evidence to the right team and supports end-to-end testing."}},{"text":{"es":"Todos están siempre en el mismo schema","en":"They always share one schema"},"correct":false,"feedback":{"es":"La arquitectura real puede ser distribuida.","en":"The actual architecture may be distributed."}},{"text":{"es":"El mismo equipo debe modificar todos los sistemas","en":"One team must modify every system"},"correct":false,"feedback":{"es":"Hay límites de propiedad y autorización.","en":"Ownership and authorization boundaries exist."}}],"explanation":{"es":"POS registra ventas, WMS ejecuta operaciones de almacén y sistemas financieros reciben información contable según diseño. Ecommerce y pagos agregan dependencias. Dibuja contratos y responsables por frontera. No asumas que Oracle Retail cubre cada componente o que todos comparten BD. Un mapa permite dirigir una evidencia concreta al equipo correcto y probar el recorrido completo.","en":"POS records sales, WMS executes warehouse operations and financial systems receive accounting information under the design. Ecommerce and payments add dependencies. Draw contracts and owners at each boundary. Do not assume Oracle Retail covers every component or that they share one DB. A map routes concrete evidence to the right team and supports end-to-end testing."},"flow":{"es":"Canal > Retail > Almacén / Fulfillment > Finanzas > Conciliación","en":"Channel > Retail > Warehouse / Fulfillment > Finance > Reconciliation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Marca fuentes de verdad y responsables para venta, stock, envío y contabilidad.","en":"Mark systems of record and owners for sales, stock, shipment and accounting."},"diagram":"business"},{"id":"retail-products-12","section":"retail-products","sectionLabel":{"es":"Retail · Productos y recorridos","en":"Retail · Products and journeys"},"level":"intermediate","kind":"scenario","question":{"es":"¿Cómo seguirías una venta hasta sus efectos de inventario y finanzas?","en":"How would you follow a sale into inventory and financial effects?"},"options":[{"text":{"es":"Correlacionar claves y etapas con controles de cantidades e importes","en":"Correlate keys and stages with quantity and amount controls"},"correct":true,"feedback":{"es":"Parte de transaction ID, tienda, día comercial e item. Confirma captura, entrega, validación y publicación según el flujo del entorno; después contrasta movimientos y totales downstream. Conserva estados e IDs de mensaje para separar retraso de rechazo. No reproceses una venta sin comprobar efectos previos e idempotencia: duplicar stock o contabilidad puede ser peor que el retraso original.","en":"Start with transaction ID, store, business day and item. Confirm capture, delivery, validation and publication under the environment flow, then compare downstream movements and totals. Preserve states and message IDs to distinguish delay from rejection. Do not reprocess a sale without checking prior effects and idempotency: duplicating stock or accounting may be worse than the initial delay."}},{"text":{"es":"Reenviar hasta que aparezca sin buscar duplicados","en":"Resend until it appears without checking duplicates"},"correct":false,"feedback":{"es":"Puede duplicar efectos comerciales.","en":"It can duplicate business effects."}},{"text":{"es":"Comparar únicamente CPU de ambos servidores","en":"Compare only CPU on both servers"},"correct":false,"feedback":{"es":"No ubica la transacción ni verifica su resultado.","en":"It neither locates the transaction nor verifies its outcome."}}],"explanation":{"es":"Parte de transaction ID, tienda, día comercial e item. Confirma captura, entrega, validación y publicación según el flujo del entorno; después contrasta movimientos y totales downstream. Conserva estados e IDs de mensaje para separar retraso de rechazo. No reproceses una venta sin comprobar efectos previos e idempotencia: duplicar stock o contabilidad puede ser peor que el retraso original.","en":"Start with transaction ID, store, business day and item. Confirm capture, delivery, validation and publication under the environment flow, then compare downstream movements and totals. Preserve states and message IDs to distinguish delay from rejection. Do not reprocess a sale without checking prior effects and idempotency: duplicating stock or accounting may be worse than the initial delay."},"flow":{"es":"Venta capturada > Interface > Validación > Inventario > Finanzas conciliadas","en":"Captured sale > Interface > Validation > Inventory > Reconciled finance"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Enumera las evidencias mínimas para pedir a otro equipo que investigue una venta.","en":"List the minimum evidence for asking another team to investigate a sale."},"evidence":{"es":"Caso hipotético: POS confirma venta V-42; destino no muestra movimiento y falta confirmar aceptación de interface.","en":"Hypothetical case: POS confirms sale V-42; the destination has no movement and interface acceptance remains unconfirmed."}},{"id":"retail-environments-01","section":"retail-environments","sectionLabel":{"es":"Retail · Instalación y ambientes","en":"Retail · Installation and environments"},"level":"basic","kind":"concept","question":{"es":"¿Cuál es la primera tarea antes de instalar Retail?","en":"What is the first task before installing Retail?"},"options":[{"text":{"es":"Construir un inventario y comprobar prerrequisitos del release","en":"Build an inventory and check release prerequisites"},"correct":true,"feedback":{"es":"Identifica producto/release, OS, JDK, runtime, BD, parches requeridos, licencias y modelo de despliegue. La matriz certificada importa más que instalar componentes recientes al azar. Valida recursos, red, cuentas y ventana con responsables. Produce una checklist con evidencia y bloqueadores; una guía de RMS 16 sirve para ese release, no como receta universal de un servicio cloud.","en":"Identify product/
