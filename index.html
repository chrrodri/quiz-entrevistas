let retailTopology='classic';
function retailGraph(c){
  if(!c.diagram)return '';if(c.diagram.startsWith('sql-'))return retailSQLVisual(c.diagram);
  const key=c.diagram==='topology'?retailTopology:c.diagram,d=RETAIL.diagrams[key];if(!d)return '';
  const byId=new Map(d.nodes.map(n=>[n.id,n])),w=195,h=80,palette=['#e6f1e9','#e9f1f8','#fff1d5'];
  const bottom=Math.max(...d.nodes.map(n=>n.y))+h+45;
  // Route between rows or beside skipped nodes so connectors do not imply intermediate hops.
  const edges=d.edges.map(([from,to])=>{
    const a=byId.get(from),b=byId.get(to),ax=a.x+w/2,bx=b.x+w/2;let path;
    if(a.id==='admin'){path='M'+a.x+' '+(a.y+h/2)+'H8V8H'+bx+'V'+(b.y-5);}
    else if(a.y===b.y&&Math.abs(a.x-b.x)<=235){const forward=b.x>a.x;path=forward?'M'+(a.x+w)+' '+(a.y+h/2)+'H'+(b.x-5):'M'+a.x+' '+(a.y+h/2)+'H'+(b.x+w+5);}
    else if(a.y===b.y){const gap=a.y+h+22;path='M'+ax+' '+(a.y+h)+'V'+gap+'H'+bx+'V'+(b.y+h+5);}
    else if(a.x===b.x&&Math.abs(b.y-a.y)>160){const bend=a.x+w+18,down=b.y>a.y,gap=down?b.y-20:b.y+h+20,ey=down?b.y-5:b.y+h+5;path='M'+(a.x+w)+' '+(a.y+h/2)+'H'+bend+'V'+gap+'H'+bx+'V'+ey;}
    else{const down=b.y>a.y,sy=down?a.y+h:a.y,ey=down?b.y-5:b.y+h+5,gap=down?(a.y+h+b.y)/2:(b.y+h+a.y)/2;path='M'+ax+' '+sy+'V'+gap+'H'+bx+'V'+ey;}
    return '<path d="'+path+'" fill="none" stroke="#708f81" stroke-width="2" '+(a.id==='admin'?'stroke-dasharray="5 4" ':'')+'marker-end="url(#retail-arrow)"/>';
  }).join('');
  const svg='<svg viewBox="0 0 705 '+bottom+'" role="img" aria-label="'+esc(l(d.title))+'"><title>'+esc(l(d.title))+'</title><defs><marker id="retail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#708f81"/></marker></defs>'+edges+d.nodes.map(n=>'<g><rect x="'+n.x+'" y="'+n.y+'" width="'+w+'" height="'+h+'" rx="5" fill="'+palette[n.tone]+'" stroke="#a9bfb2"/><text x="'+(n.x+w/2)+'" text-anchor="middle" fill="#263f34">'+l(n.label).split('\n').map((line,i)=>'<tspan x="'+(n.x+w/2)+'" y="'+(n.y+31+i*23)+'" font-size="'+(i?13:15)+'" font-weight="'+(i?400:700)+'">'+esc(line)+'</tspan>').join('')+'</text></g>').join('')+'</svg>';
  const compact='<div class="graph-mobile">'+d.edges.map(([a,b])=>'<div class="graph-edge"><span>'+esc(l(byId.get(a).label).replace('\n',' · '))+'</span>'+icon('ArrowRight')+'<span>'+esc(l(byId.get(b).label).replace('\n',' · '))+'</span></div>').join('')+'</div>';
  const controls=c.diagram==='topology'?'<div class="segmented diagram-switch"><button data-topology="classic" aria-pressed="'+(retailTopology==='classic')+'">'+(state.lang==='es'?'Clásico · WebLogic':'Classic · WebLogic')+'</button><button data-topology="cne" aria-pressed="'+(retailTopology==='cne')+'">CNE · Kubernetes</button></div>':'';
  return controls+'<figure class="figure-frame retail-graph"><div class="graph-title">'+esc(l(d.title))+'</div>'+svg+compact+'<figcaption>'+esc(l(d.caption))+'</figcaption></figure>';
}
function retailSQLVisual(type){const missing=type==='sql-missing';const head=missing?['receipt_id','invoice?']:['order_id','store_id','status'];const rows=missing?[[1,'yes'],[2,'no'],[3,'yes']]:[[1,10,'FAILED'],[2,10,'FAILED'],[3,20,'FAILED'],[4,20,'PAID']];const out=missing?[[2]]:[[10,2],[20,1]];const draw=(headers,data)=>'<table class="data-table diagram-table"><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+data.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';return '<h3>'+tr('dataExample')+' · lab_*</h3>'+draw(head,rows)+'<div class="flow">'+icon('ArrowRight')+'<strong>'+esc(missing?'NOT EXISTS':'WHERE + GROUP BY')+'</strong></div><h3>'+tr('queryResult')+'</h3>'+draw(missing?['receipt_id']:['store_id','failed_rows'],out)+'<p>'+esc(state.lang==='es'?'Modelo ficticio para practicar SQL; no representa tablas oficiales de Oracle Retail.':'Fictional SQL practice model; not official Oracle Retail tables.')+'</p>';}
function glossary(c){if(!c.retail)return '';const text=[l(c.question),l(c.explanation),l(c.flow),c.code].join(' ');const keys=Object.keys(RETAIL.glossary).filter(k=>{const rx=new RegExp('(^|[^a-zA-Z0-9_])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-zA-Z0-9_]|$)','i');return rx.test(text);});return keys.length?'<section class="glossary"><h3>'+esc(state.lang==='es'?'Siglas y vocabulario':'Acronyms and vocabulary')+'</h3>'+keys.map(k=>'<details><summary>'+esc(k)+'</summary><p>'+esc(l(RETAIL.glossary[k]))+'</p></details>').join('')+'</section>':'';}
function retailExtras(c){return (c.job?'<h3>'+esc(state.lang==='es'?'Cómo lo usarás en el puesto':'How you will use it in the role')+'</h3><p class="job-note">'+hi(l(c.job))+'</p>':'')+(c.check?'<h3>'+esc(state.lang==='es'?'Criterio de verificación':'Verification criterion')+'</h3><p>'+hi(l(c.check))+'</p>':'')+glossary(c);}
function visualization(c){let extra='';if(c.id==='architecture-01')extra=appDiagram();if(c.id==='observability-03'||c.id==='observability-04')extra=traceDiagram();if(c.id==='observability-05')extra=percentileDiagram();if(['sql-01','sql-02','sql-07','sql-08'].includes(c.id))extra=tableVisual(c);return extra+retailGraph(c)+flow(c,true)+(c.retail?'<h3>'+tr('exercise')+'</h3><p>'+hi(l(c.followup))+'</p>':'');}
function codeBlock(c){return c.code?'<div class="code-head"><span>'+tr('code')+'</span>'+button('copy-code','Copy',tr('copy'))+'</div><pre class="code">'+esc(c.code)+'</pre>'+(c.output?'<div class="output"><b>'+tr('expected')+': </b>'+esc(l(c.output))+'</div>':''):'';}
function checkAnswer(){const c=current();if(!selected.length){toast(tr('noSelection'));return;}const correctIndices=c.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0),correct=correctIndices.length===selected.length&&correctIndices.every(i=>selected.includes(i));const prior=state.records[c.id];state.records[c.id]={correct,firstCorrect:prior?prior.firstCorrect:correct&&!peeked,aided:peeked,selected:[...selected],attempts:(prior?.attempts||0)+1,at:new Date().toISOString()};if(!(c.id in state.round)){state.round[c.id]=true;state.roundCorrect[c.id]=correct&&!peeked;}checked=true;revealed=true;persist();render();if(peeked)toast(state.lang==='es'?'Práctica con ayuda: no cuenta como acierto inicial.':'Assisted practice: not counted as a first-attempt success.');}
function renderQuestion(c){const multi=c.options.filter(o=>o.correct).length>1,record=state.records[c.id],isCorrect=checked&&record?.correct;let html='<div class="meta"><span>'+esc(l(c.sectionLabel))+'</span><span class="tag level">'+tr(c.level)+'</span>'+(c.kind==='scenario'?'<span class="tag scenario">'+tr('scenarioPath')+'</span>':'')+'</div><div class="question-count">'+tr('question')+' '+(state.index+1)+' <span style="color:var(--muted);font-weight:500"> / '+state.session.length+' · '+tr(multi?'multi':'single')+'</span></div><h2 class="question" id="question-title">'+hi(l(c.question))+'</h2>'+(c.evidence?'<div class="evidence"><div class="mini-label">'+(state.lang==='es'?'Evidencia del escenario':'Scenario evidence')+'</div>'+hi(l(c.evidence))+'</div>':'');
if(state.mode==='quiz'){const order=options(c);html+='<div class="choices" role="group" aria-label="'+esc(tr(multi?'multi':'single'))+'">'+order.map((index,position)=>{const o=c.options[index],picked=selected.includes(index);let cls=picked?'selected':'';if(checked)cls=o.correct?(picked?'correct':'missed'):(picked?'wrong':'');return '<button class="choice '+cls+'" data-option="'+index+'" aria-pressed="'+picked+'" '+(checked?'disabled':'')+'><span class="letter">'+(checked&&o.correct?icon('Check'):checked&&picked?icon('X'):String.fromCharCode(65+position))+'</span><span>'+hi(l(o.text))+'</span></button>';}).join('')+'</div>';
if(checked)html+='<div class="feedback '+(isCorrect?'':'bad')+'" role="status"><strong>'+tr(isCorrect?'correct':'incorrect')+'</strong><br>'+esc(tr('technical'))+'</div>';
html+='<div class="question-actions">'+(!checked?textButton('check','CheckCheck',tr('check')):'')+textButton('reveal','NotebookPen',tr(revealed?'hide':'reveal'))+'</div>';
}else if(state.mode==='oral'){html+='<p class="meter-label">'+esc(tr('oralPrompt'))+'</p><div class="question-actions">'+textButton('timer-toggle','Timer',tr('timer'))+'<span id="timer-display" class="text-btn" role="timer">'+timeLabel()+'</span></div><label class="notes-label" for="draft">'+tr('own')+'</label><textarea class="reflection" id="draft" placeholder="'+esc(tr('ownPlaceholder'))+'">'+esc(state.drafts[c.id]||'')+'</textarea><div class="rubric">'+['facts','evidence','decision','validation'].map((key,i)=>'<label><input type="checkbox" data-rubric="'+i+'" '+(state.selfChecks[c.id]?.includes(i)?'checked':'')+'>'+esc(tr(key))+'</label>').join('')+'</div><div class="question-actions">'+textButton('reveal','NotebookPen',tr(revealed?'hide':'reveal'))+'</div>';
}else{html+='<p class="meter-label">'+esc(tr('learnPrompt'))+'</p>'+flow(c)+'<label class="notes-label" for="draft">'+tr('own')+'</label><textarea class="reflection" id="draft" placeholder="'+esc(tr('ownPlaceholder'))+'">'+esc(state.drafts[c.id]||'')+'</textarea>';}
html+='<div class="sources">'+esc(tr(c.kind==='behavioral'?'profile':c.kind==='scenario'?'hypothetical':'followupText'))+'</div>';return html;}
function explanation(c){const correct=c.options.filter(o=>o.correct);return '<div class="mini-label">'+tr('best')+'</div>'+correct.map(o=>'<p class="definition">'+hi(l(o.text))+'</p>').join('')+flow(c)+'<h3>'+tr('why')+'</h3><p>'+hi(l(c.explanation))+'</p>'+retailExtras(c)+'<h3>'+tr('compare')+'</h3>'+c.options.filter(o=>!o.correct).map(o=>'<p class="trap"><b>'+esc(l(o.text))+': </b>'+hi(l(o.feedback))+'</p>').join('')+(c.source?'<div class="sources"><a href="'+esc(c.source)+'" target="_blank" rel="noopener noreferrer">'+tr('source')+'</a></div>':'');}
function practice(c){return '<h2>'+tr('exercise')+'</h2><p>'+hi(l(c.followup))+'</p>'+codeBlock(c)+(c.code?'':'<div class="checkpoint-list">'+['facts','evidence','decision','validation'].map(t=>'<label><input type="checkbox">'+esc(tr(t))+'</label>').join(''))+'<h3>'+tr('followup')+'</h3><p>'+esc(tr('followupText'))+'</p><label class="notes-label" for="notes">'+tr('notes')+'</label><textarea class="notes" id="notes" placeholder="'+esc(tr('notesPlaceholder'))+'">'+esc(state.notes[c.id]||'')+'</textarea>';}
function oralAnswer(c){const order=l(c.flow).split(' > ');return '<h2>'+tr('oralTemplate')+'</h2><p class="definition">'+hi(l(c.options.find(o=>o.correct).text))+'</p><p>'+hi(l(c.explanation))+'</p><h3>'+tr('relationship')+'</h3>'+flow(c)+'<h3>'+tr('followup')+'</h3><p>'+esc(tr('followupText'))+'</p><div class="sources">'+esc(tr(c.kind==='behavioral'?'profile':'hypothetical'))+'</div>'+(c.kind==='behavioral'?'<label class="notes-label" for="notes">'+tr('notes')+'</label><textarea class="notes" id="notes">'+esc(state.notes[c.id]||'')+'</textarea>':'');}
function renderAnswer(c){$('answer-tabs').innerHTML=['explain','visual','practice','wording'].map(key=>'<button role="tab" data-tab="'+key+'" aria-selected="'+(tab===key)+'" aria-controls="answer-body">'+tr(key)+'</button>').join('');const body=$('answer-body');if(!revealed){body.innerHTML='<div class="locked"><div class="mini-label">'+tr('bank')+'</div><h2>'+esc(tr(state.mode==='oral'?'oralPrompt':'learnPrompt'))+'</h2><p>'+esc(tr('followupText'))+'</p>'+textButton('unlock','NotebookPen',tr('reveal'))+'</div>';$('unlock').onclick=()=>{revealed=true;renderAnswer(c);};}else{body.innerHTML=tab==='explain'?explanation(c):tab==='visual'?visualization(c):tab==='practice'?practice(c):oralAnswer(c);bindAnswer(c);}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAnswer(c);body.scrollTop=0;if(revealed&&innerWidth<=680){$('content').classList.add('mobile-answer');$('content').scrollTop=0;}});document.querySelectorAll('[data-topology]').forEach(b=>b.onclick=()=>{retailTopology=b.dataset.topology;renderAnswer(c);});}
function bindAnswer(c){if($('copy-code'))$('copy-code').onclick=async()=>{try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(c.code);else{const t=document.createElement('textarea');t.value=c.code;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy failed');}toast(tr('copied'));}catch{toast(state.lang==='es'?'Selecciona el ejemplo para copiarlo.':'Select the example to copy it.');}};if($('notes'))$('notes').oninput=e=>{state.notes[c.id]=e.target.value;persist();};}
function renderContent(){const c=current();if(!c){$('content').innerHTML='<div class="empty"><h2>'+tr('empty')+'</h2><p>'+tr('emptyText')+'</p></div>';return;}$('content').innerHTML='<section class="question-pane" aria-labelledby="question-title">'+renderQuestion(c)+'</section><section class="answer-pane"><button class="back-question" id="back-question">'+icon('ArrowLeft')+esc(tr('question'))+'</button><div class="tabs" id="answer-tabs" role="tablist" aria-label="'+esc(tr('explain'))+'"></div><div class="answer-body" id="answer-body" role="tabpanel"></div></section>';
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.option),multi=c.options.filter(o=>o.correct).length>1;selected=multi?(selected.includes(index)?selected.filter(i=>i!==index):[...selected,index]):[index];renderContent();});if($('check')){$('check').classList.add('primary');$('check').onclick=checkAnswer;}if($('reveal'))$('reveal').onclick=()=>{revealed=!revealed;renderContent();};if($('draft'))$('draft').oninput=e=>{state.drafts[c.id]=e.target.value;persist();};document.querySelectorAll('[data-rubric]').forEach(input=>input.onchange=()=>{state.selfChecks[c.id]=[...document.querySelectorAll('[data-rubric]:checked')].map(x=>Number(x.dataset.rubric));persist();});if($('timer-toggle'))$('timer-toggle').onclick=toggleTimer;renderAnswer(c);}
function renderFooter(){const n=state.session.length;$('footer').innerHTML=textButton('previous','ArrowLeft',tr('previous'),state.index===0?'disabled':'')+'<span class="footer-middle">'+(state.mode==='oral'?'Impact → Evidence → Action → Validation':'Application Support · '+CARDS.length+' · ES / EN')+'</span>'+textButton('next','ArrowRight',tr(state.index>=n-1?'finish':'next'),n?'':'disabled');$('next').classList.add('primary');$('previous').onclick=()=>navigate(-1);$('next').onclick=()=>{if(state.index>=n-1){state.finished=true;persist();render();}else navigate(1);};}
function renderResults(){const ids=state.session,answered=Object.keys(state.round).filter(id=>ids.includes(id)),correct=answered.filter(id=>state.roundCorrect[id]).length;const scores=sections().map(([id,label])=>{const entries=answered.filter(cid=>CARD_MAP.get(cid).section===id);return {id,label,n:entries.length,correct:entries.filter(cid=>state.roundCorrect[cid]).length};}).filter(x=>x.n);$('content').innerHTML='<section class="finished" style="grid-column:1/-1"><div class="mini-label">'+tr('complete')+'</div><h2>'+tr('summary')+'</h2><p class="meter-label">'+tr('rate')+' · '+tr('sessionInfo')+'</p><div class="summary-grid"><div><strong>'+answered.length+' / '+ids.length+'</strong><small>'+tr('attempts')+'</small></div><div><strong>'+(answered.length?Math.round(correct/answered.length*100):0)+'%</strong><small>'+tr('rate')+'</small></div><div><strong>'+Math.max(0,ids.length-answered.length)+'</strong><small>'+tr('pending')+'</small></div></div><h3 style="font-size:14px;margin-top:24px">'+tr('weak')+'</h3><div class="results-list">'+scores.sort((a,b)=>a.correct/a.n-b.correct/b.n).map(x=>'<button data-result-topic="'+x.id+'"><span>'+esc(l(x.label))+'</span><b>'+x.correct+' / '+x.n+'</b></button>').join('')+'</div><div class="question-actions">'+textButton('review-errors','RotateCcw',tr('reviewErrors'))+textButton('restart-round','Shuffle',tr('restart'))+textButton('resume-round','ArrowLeft',tr('resume'))+'</div></section>';$('review-errors').onclick=()=>{const mistakes=ids.filter(id=>id in state.roundCorrect&&!state.roundCorrect[id]);if(!mistakes.length){toast(tr('emptyReview'));return;}state.session=mistakes;state.round={};state.roundCorrect={};state.index=0;state.finished=false;resetQuestion();persist();render();};$('restart-round').onclick=()=>{state.session=shuffled(ids);state.index=0;state.round={};state.roundCorrect={};state.finished=false;resetQuestion();persist();render();};$('resume-round').onclick=()=>{state.finished=false;resetQuestion();persist();render();};document.querySelectorAll('[data-result-topic]').forEach(b=>b.onclick=()=>{state.review='any';changeFilter('section',b.dataset.resultTopic);});$('footer').innerHTML=textButton('return-study','ArrowLeft',tr('continueStudy'));$('return-study').onclick=()=>{state.finished=false;resetQuestion();persist();render();};}
function render(){renderHeader();renderSidebar();renderBar();if(state.finished)renderResults();else{renderContent();renderFooter();}}
function navigate(delta){const n=state.session.length;if(!n)return;state.index=Math.max(0,Math.min(n-1,state.index+delta));state.finished=false;resetQuestion();persist();render();}
function timeLabel(){const secs=timerSeconds+(timerStarted?Math.floor((Date.now()-timerStarted)/1000):0);return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}
function resetTimer(){clearInterval(timerInterval);timerStarted=0;timerSeconds=0;timerInterval=null;}
function toggleTimer(){if(timerStarted){timerSeconds+=Math.floor((Date.now()-timerStarted)/1000);timerStarted=0;clearInterval(timerInterval);}else{timerStarted=Date.now();timerInterval=setInterval(()=>{if($('timer-display'))$('timer-display').textContent=timeLabel();},500);}if($('timer-display'))$('timer-display').textContent=timeLabel();}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='interview-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(tr('exported'));}
$('import-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('File too large');const parsed=migrateState(JSON.parse(await file.text()));if(!parsed)throw Error('Invalid state');if(confirm(tr('confirmImport'))){state=parsed;resetQuestion();persist();render();toast(tr('imported'));}}catch{toast(tr('badImport'));}finally{e.target.value='';}};
$('toggle-sidebar').onclick=()=>{$('app').classList.toggle('sidebar-hidden');renderHeader();};for(const lang of ['es','en'])$('lang-'+lang).onclick=()=>{state.lang=lang;window.speechSynthesis?.cancel();persist();render();};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'&&!state.finished){e.preventDefault();navigate(1);}if(e.key==='ArrowLeft'&&!state.finished){e.preventDefault();navigate(-1);}if(e.key==='Escape'&&innerWidth<=960){$('app').classList.add('sidebar-hidden');renderHeader();}});
document.addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(['reveal','unlock'].includes(id)&&revealed&&!checked)peeked=true;if(id==='back-question'){$('content').classList.remove('mobile-answer');$('content').scrollTop=0;}if(['check','reveal','unlock'].includes(id)&&revealed&&innerWidth<=680){$('content').classList.add('mobile-answer');$('content').scrollTop=0;}});
if(innerWidth>960)$('app').classList.remove('sidebar-hidden');
if(!state.session.length){state.session=eligible().slice(0,state.size==='all'?CARDS.length:Number(state.size));state.index=0;}
if(location.hash==='#retail'&&state.path!=='retail'){state.path='retail';state.section='all';state.level='all';state.review='any';state.query='';state.size='all';state.session=eligible();state.index=0;state.round={};state.roundCorrect={};state.finished=false;}
resetQuestion();render();persist();
</script>
</body></html>
