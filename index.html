alculation did not run, inspect job/runtime; if it did, review inputs and constraints with business. Zero can be correct because of existing stock or exclusion. Use a snapshot and controlled QA calculation; do not change policies merely to produce an expected number."}},{"text":{"es":"Declarar bug por cualquier cero","en":"Declare a bug for every zero"},"correct":false,"feedback":{"es":"Puede ser un resultado válido de reglas.","en":"It may be a valid rule outcome."}},{"text":{"es":"Editar cantidades sin revisar disponibilidad","en":"Edit quantities without reviewing availability"},"correct":false,"feedback":{"es":"Puede sobreasignar stock o violar políticas.","en":"This can overallocate stock or violate policies."}}],"explanation":{"es":"Confirma SKU, horizonte y ubicación; revisa demanda, inventario aplicable, disponibilidad y reglas de elegibilidad. Si el cálculo no ejecutó, analiza job/runtime; si ejecutó, explica los inputs y restricciones con negocio. Un valor cero puede ser correcto por stock existente o una exclusión. Usa snapshot y cálculo controlado en QA; no cambies políticas para obtener el número que alguien esperaba.","en":"Confirm SKU, horizon and location; inspect demand, applicable inventory, availability and eligibility rules. If calculation did not run, inspect job/runtime; if it did, review inputs and constraints with business. Zero can be correct because of existing stock or exclusion. Use a snapshot and controlled QA calculation; do not change policies merely to produce an expected number."},"flow":{"es":"SKU / Horizonte > Inputs > Elegibilidad > Necesidad neta > Cálculo > Validación","en":"SKU / Horizon > Inputs > Eligibility > Net need > Calculation > Validation"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-allocation-cloud/latest/ralim/allocation-overview.htm","retail":true,"followup":{"es":"¿Cómo demostrarías que el problema es input desactualizado y no motor de cálculo?","en":"How would you prove stale input rather than a calculation-engine problem?"},"evidence":{"es":"Hipotético: demanda 80, SOH reportado 100, tienda elegible; falta confirmar stock usable y regla neta.","en":"Hypothetical: demand 80, reported SOH 100, eligible store; usable stock and net-need rule remain unconfirmed."}},{"id":"retail-cases-05","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso omnicanal: web ofrece pickup pero la tienda rechaza por falta de stock. ¿Qué pruebas?","en":"Omnichannel case: the web offers pickup but the store rejects for no stock. What do you test?"},"options":[{"text":{"es":"Frescura de disponibilidad, reservas y routing para misma entidad/hora","en":"Availability freshness, reservations and routing for the same entity/time"},"correct":true,"feedback":{"es":"Relaciona order ID, SKU, tienda y hora. Compara stock físico/registrado, reservas y última publicación al broker/canal bajo sus reglas. Si hay desfase, identifica frontera y backlog; si datos coinciden, revisa elegibilidad y cálculo de disponibilidad. No canceles ni dupliques pedido sin dueño y compensación. Verifica flujo de reserva y opción de fulfillment con datos de prueba.","en":"Relate order ID, SKU, store and time. Compare physical/recorded stock, reservations and last publication to broker/channel under their rules. If stale, locate the boundary and backlog; if data matches, inspect eligibility and availability calculation. Do not cancel or duplicate the order without an owner and compensation. Verify reservation and fulfillment choice using test data."}},{"text":{"es":"Asumir que stock web siempre es en vivo","en":"Assume web stock is always live"},"correct":false,"feedback":{"es":"Puede depender de integración y cache.","en":"It may depend on integration and caching."}},{"text":{"es":"Crear otro pedido sin comprobar el primero","en":"Create another order without checking the first"},"correct":false,"feedback":{"es":"Puede duplicar reservas y pago.","en":"This can duplicate reservations and payment."}}],"explanation":{"es":"Relaciona order ID, SKU, tienda y hora. Compara stock físico/registrado, reservas y última publicación al broker/canal bajo sus reglas. Si hay desfase, identifica frontera y backlog; si datos coinciden, revisa elegibilidad y cálculo de disponibilidad. No canceles ni dupliques pedido sin dueño y compensación. Verifica flujo de reserva y opción de fulfillment con datos de prueba.","en":"Relate order ID, SKU, store and time. Compare physical/recorded stock, reservations and last publication to broker/channel under their rules. If stale, locate the boundary and backlog; if data matches, inspect eligibility and availability calculation. Do not cancel or duplicate the order without an owner and compensation. Verify reservation and fulfillment choice using test data."},"flow":{"es":"Order / SKU > Stock y reservas > Última publicación > Broker > Routing > Reserva","en":"Order / SKU > Stock and reservations > Last publication > Broker > Routing > Reservation"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-order-broker-cloud/21.0/roboh/Locate_overview.htm","retail":true,"followup":{"es":"Propón mitigación temporal y una alerta de frescura sin prometer stock inexistente.","en":"Propose a temporary mitigation and freshness alert without promising nonexistent stock."},"evidence":{"es":"Hipotético: canal muestra 3; tienda registra 0; última actualización de disponibilidad tiene 45 minutos.","en":"Hypothetical: the channel shows 3; the store records 0; the last availability update is 45 minutes old."},"diagram":"incident"},{"id":"retail-cases-06","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso Customer Engagement: compra válida no genera puntos. ¿Cómo separas causas?","en":"Customer Engagement case: a valid purchase generates no points. How do you separate causes?"},"options":[{"text":{"es":"Validar identificación, elegibilidad, entrega de evento y procesamiento","en":"Validate identification, eligibility, event delivery and processing"},"correct":true,"feedback":{"es":"Confirma ID de cliente sanitizado, transacción, campaña vigente y reglas aplicables. Si el cliente no fue identificado, revisa captura; si el evento no llegó, integración; si llegó y se rechazó, error/regla con funcional. No otorgues puntos por SQL ni publiques PII en el ticket. Usa una transacción de prueba para verificar y concilia la afectación real según procedimiento.","en":"Confirm sanitized customer ID, transaction, active campaign and applicable rules. If the customer was not identified, inspect capture; if the event did not arrive, inspect integration; if it arrived and was rejected, review the error/rule with business. Do not award points by SQL or publish PII in the ticket. Verify with a test transaction and reconcile actual impact under the procedure."}},{"text":{"es":"Sumar puntos manualmente en cualquier schema","en":"Manually add points in any schema"},"correct":false,"feedback":{"es":"Puede evadir controles y crear saldos inconsistentes.","en":"This can bypass controls and create inconsistent balances."}},{"text":{"es":"Adjuntar todos los datos personales","en":"Attach all personal data"},"correct":false,"feedback":{"es":"Expone información innecesaria.","en":"This exposes unnecessary information."}}],"explanation":{"es":"Confirma ID de cliente sanitizado, transacción, campaña vigente y reglas aplicables. Si el cliente no fue identificado, revisa captura; si el evento no llegó, integración; si llegó y se rechazó, error/regla con funcional. No otorgues puntos por SQL ni publiques PII en el ticket. Usa una transacción de prueba para verificar y concilia la afectación real según procedimiento.","en":"Confirm sanitized customer ID, transaction, active campaign and applicable rules. If the customer was not identified, inspect capture; if the event did not arrive, inspect integration; if it arrived and was rejected, review the error/rule with business. Do not award points by SQL or publish PII in the ticket. Verify with a test transaction and reconcile actual impact under the procedure."},"flow":{"es":"Identidad > Elegibilidad > Evento > Integración > Cálculo > Puntos","en":"Identity > Eligibility > Event > Integration > Calculation > Points"},"code":"","output":null,"source":"https://docs.oracle.com/en/industries/retail/retail-customer-engagement/19.0/index.html","retail":true,"followup":{"es":"¿Qué información puedes compartir y cuál debes sanitizar al escalar?","en":"What information can you share and what must be sanitized when escalating?"},"evidence":{"es":"Hipotético: compra T-12; cliente de prueba identificado; evento existe en origen, destino aún no confirmado.","en":"Hypothetical: purchase T-12; test customer identified; source event exists, destination unconfirmed."}},{"id":"retail-cases-07","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"advanced","kind":"scenario","question":{"es":"Caso WebLogic Retail: solo nodo B retorna 500 tras un release. ¿Qué haces?","en":"Retail WebLogic case: only node B returns 500 after a release. What do you do?"},"options":[{"text":{"es":"Aislar tráfico según runbook y comparar artefacto/configuración con nodo sano","en":"Isolate traffic under the runbook and compare artifact/configuration with the healthy node"},"correct":true,"feedback":{"es":"Correlaciona request IDs con instancia y confirma que A tiene capacidad para el tráfico. Captura logs de B y compara digest, targets, JNDI, truststore y endpoints. Si una diferencia explica error, aplica corrección aprobada o rollback compatible. No reinicies A para igualar condiciones ni pierdas la evidencia de B. Reintegra gradualmente y valida distribución, latencia y función Retail afectada.","en":"Correlate request IDs with instance and confirm A can handle the traffic. Capture B logs and compare digest, targets, JNDI, truststore and endpoints. If a difference explains the error, apply an approved correction or compatible rollback. Do not restart A to equalize conditions or lose B evidence. Reintroduce traffic gradually and verify distribution, latency and the affected Retail function."}},{"text":{"es":"Reiniciar ambos simultáneamente","en":"Restart both simultaneously"},"correct":false,"feedback":{"es":"Amplía downtime y elimina comparación sana.","en":"This expands downtime and removes the healthy comparison."}},{"text":{"es":"Modificar el LB sin verificar capacidad","en":"Change the LB without checking capacity"},"correct":false,"feedback":{"es":"Puedes saturar el nodo sano.","en":"You can saturate the healthy node."}}],"explanation":{"es":"Correlaciona request IDs con instancia y confirma que A tiene capacidad para el tráfico. Captura logs de B y compara digest, targets, JNDI, truststore y endpoints. Si una diferencia explica error, aplica corrección aprobada o rollback compatible. No reinicies A para igualar condiciones ni pierdas la evidencia de B. Reintegra gradualmente y valida distribución, latencia y función Retail afectada.","en":"Correlate request IDs with instance and confirm A can handle the traffic. Capture B logs and compare digest, targets, JNDI, truststore and endpoints. If a difference explains the error, apply an approved correction or compatible rollback. Do not restart A to equalize conditions or lose B evidence. Reintroduce traffic gradually and verify distribution, latency and the affected Retail function."},"flow":{"es":"Errores por nodo > Capacidad A > Drenar B > Comparación > Fix > Reintegración","en":"Errors by node > A capacity > Drain B > Comparison > Fix > Reintroduction"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué resultado cambiaría tu hipótesis de configuration drift?","en":"What result would change your configuration-drift hypothesis?"},"evidence":{"es":"Hipotético: 500 solo en B; A responde; B log registra lookup JNDI no encontrado.","en":"Hypothetical: 500 only on B; A responds; B logs a JNDI lookup not found."},"check":{"es":"Probar función en B antes de devolver tráfico y observar ambos nodos bajo carga.","en":"Test the function on B before restoring traffic and observe both nodes under load."},"diagram":"incident"},{"id":"retail-cases-08","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"advanced","kind":"scenario","question":{"es":"Caso batch Retail: duración pasa de 20 a 90 minutos sin cambios de código. ¿Qué comparas?","en":"Retail batch case: duration grows from 20 to 90 minutes with no code change. What do you compare?"},"options":[{"text":{"es":"Volumen, plan, waits, concurrencia y etapas frente a una ejecución sana","en":"Volume, plan, waits, concurrency and stages against a healthy run"},"correct":true,"feedback":{"es":"Sin cambio de código puede haber más datos, distribución distinta, estadísticas, storage o jobs solapados. Divide por etapas y compara throughput, SQL_ID/plan, waits y horario. Si predominan locks, identifica blocker; si CPU, carga/plan; si espera de archivo, interface. No crees índices ni cambies memoria indiscriminadamente. Evalúa cutoff y mitigación reversible, luego prueba la causa con carga comparable.","en":"Without a code change there may be more data, changed distribution, statistics, storage or overlapping jobs. Split stages and compare throughput, SQL_ID/plan, waits and timing. For locks identify the blocker; for CPU inspect workload/plan; for file waits inspect the interface. Do not add indexes or change memory indiscriminately. Assess cutoff and reversible mitigation, then test the cause under comparable load."}},{"text":{"es":"Sin deploy no puede ser problema de BD","en":"Without deployment it cannot be a DB issue"},"correct":false,"feedback":{"es":"Datos, planes y recursos cambian.","en":"Data, plans and resources can change."}},{"text":{"es":"Cancelar todos los jobs del ambiente","en":"Cancel every environment job"},"correct":false,"feedback":{"es":"Puede romper dependencias y ampliar impacto.","en":"This can break dependencies and expand impact."}}],"explanation":{"es":"Sin cambio de código puede haber más datos, distribución distinta, estadísticas, storage o jobs solapados. Divide por etapas y compara throughput, SQL_ID/plan, waits y horario. Si predominan locks, identifica blocker; si CPU, carga/plan; si espera de archivo, interface. No crees índices ni cambies memoria indiscriminadamente. Evalúa cutoff y mitigación reversible, luego prueba la causa con carga comparable.","en":"Without a code change there may be more data, changed distribution, statistics, storage or overlapping jobs. Split stages and compare throughput, SQL_ID/plan, waits and timing. For locks identify the blocker; for CPU inspect workload/plan; for file waits inspect the interface. Do not add indexes or change memory indiscriminately. Assess cutoff and reversible mitigation, then test the cause under comparable load."},"flow":{"es":"Baseline > Volumen / Etapas > SQL / Waits > Concurrencia > Prueba > Deadline","en":"Baseline > Volume / Stages > SQL / Waits > Concurrency > Test > Deadline"},"code":"","output":null,"source":"https://docs.oracle.com/en/database/oracle/oracle-database/18/arpls/DBMS_XPLAN.html","retail":true,"followup":{"es":"Un batch procesa cinco veces más filas: cómo cambia tu interpretación de 90 minutos.","en":"A batch processes five times more rows: how does that change your view of 90 minutes?"},"evidence":{"es":"Hipotético: volumen aumentó 10%; etapa SQL ahora consume 70 minutos; job de carga coincide por primera vez.","en":"Hypothetical: volume increased 10%; the SQL stage now takes 70 minutes; a loading job overlaps for the first time."},"diagram":"incident"},{"id":"retail-cases-09","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso TLS Retail: después de renovar certificado falla solo un cliente Java. ¿Qué comparas?","en":"Retail TLS case: after renewal only one Java client fails. What do you compare?"},"options":[{"text":{"es":"Cadena y hostname con truststore/JVM reales de ese cliente","en":"Chain and hostname against that client’s actual truststore/JVM"},"correct":true,"feedback":{"es":"Si otros clientes funcionan, segmenta cliente, CA confiable, chain enviada, SNI y configuración JVM. Reúne error de handshake y fecha; prueba desde host real con herramientas aprobadas. Un navegador puede confiar en otra CA store. Renueva/reconfigura confianza según política sin desactivar validación. Verifica reinicio/recarga requerida y retira certificados antiguos solo con plan de transición.","en":"If other clients work, segment the client, trusted CA, delivered chain, SNI and JVM configuration. Gather handshake error and time; test from the real host with approved tools. A browser may trust a different CA store. Renew/reconfigure trust under policy without disabling validation. Verify required restart/reload and remove old certificates only through a transition plan."}},{"text":{"es":"Desactivar validación para todo cliente","en":"Disable verification for every client"},"correct":false,"feedback":{"es":"Elimina autenticidad y aumenta riesgo.","en":"This removes authenticity and increases risk."}},{"text":{"es":"Navegador sano prueba todos los truststores","en":"A healthy browser proves every truststore"},"correct":false,"feedback":{"es":"Pueden usar repositorios de confianza distintos.","en":"They may use different trust repositories."}}],"explanation":{"es":"Si otros clientes funcionan, segmenta cliente, CA confiable, chain enviada, SNI y configuración JVM. Reúne error de handshake y fecha; prueba desde host real con herramientas aprobadas. Un navegador puede confiar en otra CA store. Renueva/reconfigura confianza según política sin desactivar validación. Verifica reinicio/recarga requerida y retira certificados antiguos solo con plan de transición.","en":"If other clients work, segment the client, trusted CA, delivered chain, SNI and JVM configuration. Gather handshake error and time; test from the real host with approved tools. A browser may trust a different CA store. Renew/reconfigure trust under policy without disabling validation. Verify required restart/reload and remove old certificates only through a transition plan."},"flow":{"es":"Cliente fallido > Error TLS > Chain / SAN > Truststore real > Corrección > Prueba","en":"Failing client > TLS error > Chain / SAN > Actual truststore > Correction > Test"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué demuestra openssl y qué no demuestra sobre Java?","en":"What does openssl prove and not prove about Java?"},"evidence":{"es":"Hipotético: browser sano; cliente Java registra PKIX path building failed tras cambio de CA intermedia.","en":"Hypothetical: the browser is healthy; a Java client reports PKIX path building failed after an intermediate CA change."},"diagram":"incident"},{"id":"retail-cases-10","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"intermediate","kind":"scenario","question":{"es":"Caso Linux Retail: aplicación no escribe y df muestra espacio libre. ¿Qué sigue?","en":"Retail Linux case: the application cannot write and df shows free space. What next?"},"options":[{"text":{"es":"Revisar inodos, permisos, mount y error exacto sobre la ruta usada","en":"Check inodes, permissions, mount state and the exact error for the used path"},"correct":true,"feedback":{"es":"Confirma la ruta real y usuario del proceso; libre en otro filesystem no ayuda. Comprueba df -i, ownership, permisos, filesystem readonly y políticas OS. Distingue no space left, permission denied y read-only filesystem. Si hay errores de storage, escala evidencia al dueño. Evita chmod global o borrar archivos sin clasificación; valida una escritura de prueba autorizada bajo la identidad correcta.","en":"Confirm the real path and process user; free space on another filesystem is irrelevant. Check df -i, ownership, permissions, read-only mounts and OS policies. Distinguish no space left, permission denied and read-only filesystem. For storage errors escalate evidence to the owner. Avoid global chmod or unclassified deletion; validate an authorized test write with the correct identity."}},{"text":{"es":"Borrar stores JMS porque son grandes","en":"Delete JMS stores because they are large"},"correct":false,"feedback":{"es":"Puede destruir mensajes y recuperación.","en":"This can destroy messages and recovery."}},{"text":{"es":"chmod 777 arregla todo error de escritura","en":"chmod 777 fixes every write error"},"correct":false,"feedback":{"es":"No resuelve inodos ni mount readonly y expone datos.","en":"It does not fix inodes or read-only mounts and exposes data."}}],"explanation":{"es":"Confirma la ruta real y usuario del proceso; libre en otro filesystem no ayuda. Comprueba df -i, ownership, permisos, filesystem readonly y políticas OS. Distingue no space left, permission denied y read-only filesystem. Si hay errores de storage, escala evidencia al dueño. Evita chmod global o borrar archivos sin clasificación; valida una escritura de prueba autorizada bajo la identidad correcta.","en":"Confirm the real path and process user; free space on another filesystem is irrelevant. Check df -i, ownership, permissions, read-only mounts and OS policies. Distinguish no space left, permission denied and read-only filesystem. For storage errors escalate evidence to the owner. Avoid global chmod or unclassified deletion; validate an authorized test write with the correct identity."},"flow":{"es":"Ruta / Usuario > Error exacto > Inodos / Permisos / Mount > Dueño > Prueba","en":"Path / User > Exact error > Inodes / Permissions / Mount > Owner > Test"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"¿Qué evidencia separa inodos agotados de un mount readonly?","en":"What evidence separates exhausted inodes from a read-only mount?"},"evidence":{"es":"Hipotético: df -h 60% usado, df -i 100%; creación de archivo falla con no space left.","en":"Hypothetical: df -h shows 60% used, df -i shows 100%; file creation fails with no space left."},"diagram":"incident"},{"id":"retail-cases-11","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"advanced","kind":"scenario","question":{"es":"Caso CNE Retail: después de deploy aparecen 503 y pods Running. ¿Cómo aislas?","en":"Retail CNE case: after deploy 503 errors appear and pods are Running. How do you isolate?"},"options":[{"text":{"es":"Inspeccionar readiness, Service endpoints y ruta LB/Ingress","en":"Inspect readiness, Service endpoints and the LB/Ingress route"},"correct":true,"feedback":{"es":"Running significa contenedores arrancados o arrancando, no necesariamente listos. Confirma namespace, revisión, selectors y endpoints elegibles. Si readiness falla, analiza su razón y dependencia; si está sana pero endpoints vacíos, labels/selector; si endpoints correctos, ruta/proxy/network. Mantén instancias sanas y evalúa rollback compatible. No cambies probes para ocultar que la función no está lista.","en":"Running means containers are started or starting, not necessarily ready. Confirm namespace, revision, selectors and eligible endpoints. If readiness fails, inspect its reason and dependency; if healthy but endpoints are empty, inspect labels/selectors; if endpoints are correct, investigate routing/proxy/network. Keep healthy instances and assess compatible rollback. Do not change probes to hide functional unreadiness."}},{"text":{"es":"Forzar Ready sin probar la app","en":"Force Ready without testing the app"},"correct":false,"feedback":{"es":"Envía tráfico a una instancia incapaz de atender.","en":"This sends traffic to an instance unable to serve."}},{"text":{"es":"Borrar todo namespace para recrear","en":"Delete the namespace to recreate it"},"correct":false,"feedback":{"es":"Es destructivo y amplía impacto.","en":"This is destructive and expands impact."}}],"explanation":{"es":"Running significa contenedores arrancados o arrancando, no necesariamente listos. Confirma namespace, revisión, selectors y endpoints elegibles. Si readiness falla, analiza su razón y dependencia; si está sana pero endpoints vacíos, labels/selector; si endpoints correctos, ruta/proxy/network. Mantén instancias sanas y evalúa rollback compatible. No cambies probes para ocultar que la función no está lista.","en":"Running means containers are started or starting, not necessarily ready. Confirm namespace, revision, selectors and eligible endpoints. If readiness fails, inspect its reason and dependency; if healthy but endpoints are empty, inspect labels/selectors; if endpoints are correct, investigate routing/proxy/network. Keep healthy instances and assess compatible rollback. Do not change probes to hide functional unreadiness."},"flow":{"es":"503 > Contexto > Readiness > Endpoint / Selector > Ruta > Fix verificado","en":"503 > Context > Readiness > Endpoint / Selector > Route > Verified fix"},"code":"","output":null,"source":"https://kubernetes.io/docs/tasks/debug/debug-application/","retail":true,"followup":{"es":"Nombra una prueba para cada rama sin modificar el cluster.","en":"Name one test for each branch without modifying the cluster."},"evidence":{"es":"Hipotético: pods Running 0/1 Ready; Service sin endpoints listos; readiness da error al conectar BD.","en":"Hypothetical: pods Running 0/1 Ready; Service has no ready endpoints; readiness errors when connecting to the DB."},"diagram":"incident"},{"id":"retail-cases-12","section":"retail-cases","sectionLabel":{"es":"Retail · Laboratorio de incidentes","en":"Retail · Incident lab"},"level":"advanced","kind":"scenario","question":{"es":"Caso cross-team Retail: tu interface da timeout pero proveedor dice que todo está bien. ¿Qué haces?","en":"Cross-team Retail case: your interface times out but the provider says everything is fine. What do you do?"},"options":[{"text":{"es":"Proponer prueba conjunta con IDs, hora, origen y frontera de aceptación","en":"Propose a joint test with IDs, time, origin and acceptance boundary"},"correct":true,"feedback":{"es":"Evita debatir culpables. Comparte un caso sanitizado, UTC, endpoint, timeout y correlación; pregunta si llegó y qué ocurrió después. Si no llegó, investiga frontera red/gateway; si llegó y tardó, revisa procesamiento y respuesta; si commit ocurrió, no repitas a ciegas. Acordad dueño por prueba y próxima actualización. Mantén impacto y mitigación al cliente sin declarar causa antes de evidencia.","en":"Avoid debating blame. Share one sanitized case, UTC, endpoint, timeout and correlation; ask whether it arrived and what happened afterward. If not, inspect network/gateway boundaries; if it arrived but was slow, inspect processing and response; if it committed, do not blindly repeat. Agree on an owner per test and the next update. Communicate impact and mitigation without declaring a cause before evidence."}},{"text":{"es":"Decir que el otro equipo miente","en":"Say the other team is lying"},"correct":false,"feedback":{"es":"Bloquea colaboración y no aporta pruebas.","en":"This blocks collaboration and provides no evidence."}},{"text":{"es":"Aceptar dashboard verde como prueba completa","en":"Accept a green dashboard as complete proof"},"correct":false,"feedback":{"es":"Puede medir otra ventana o ruta.","en":"It may measure another window or route."}}],"explanation":{"es":"Evita debatir culpables. Comparte un caso sanitizado, UTC, endpoint, timeout y correlación; pregunta si llegó y qué ocurrió después. Si no llegó, investiga frontera red/gateway; si llegó y tardó, revisa procesamiento y respuesta; si commit ocurrió, no repitas a ciegas. Acordad dueño por prueba y próxima actualización. Mantén impacto y mitigación al cliente sin declarar causa antes de evidencia.","en":"Avoid debating blame. Share one sanitized case, UTC, endpoint, timeout and correlation; ask whether it arrived and what happened afterward. If not, inspect network/gateway boundaries; if it arrived but was slow, inspect processing and response; if it committed, do not blindly repeat. Agree on an owner per test and the next update. Communicate impact and mitigation without declaring a cause before evidence."},"flow":{"es":"Caso correlacionado > ¿Llegó? > ¿Procesó? > ¿Respondió? > Prueba conjunta > Resultado","en":"Correlated case > Arrived? > Processed? > Responded? > Joint test > Outcome"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Da un update de 30 segundos en inglés sin culpar ni prometer una hora inventada.","en":"Give a 30-second English update without blame or an invented ETA."},"evidence":{"es":"Hipotético: request R-55 14:02 UTC, timeout 30s desde nodo B; proveedor solo reporta salud global.","en":"Hypothetical: request R-55 at 14:02 UTC, 30s timeout from node B; the provider reports only global health."},"diagram":"incident"},{"id":"retail-role-01","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"basic","kind":"concept","question":{"es":"¿Cómo se traduce el JD a un día normal de trabajo?","en":"How does the JD translate into a typical working day?"},"options":[{"text":{"es":"Revisar salud, incidentes, cambios, ambientes y documentación según prioridades","en":"Review health, incidents, changes, environments and documentation by priority"},"correct":true,"feedback":{"es":"Un día puede empezar con handover de guardia y batch/cutoffs, seguir con incidentes y solicitudes DEV/QA, y dedicar ventana aprobada a instalación o patch. Scripts y documentación reducen trabajo repetitivo y dependencia. No significa que todos los días hagas todo ni que seas dueño funcional de cada producto. Confirma productos asignados, SLA, horarios, volumen y autoridad operativa.","en":"A day may begin with on-call handover and batch/cutoffs, continue with incidents and DEV/QA requests, then use an approved window for installation or patching. Scripts and documentation reduce repetition and dependency. You will not necessarily do everything daily or own each product functionally. Confirm assigned products, SLA, hours, volume and operating authority."}},{"text":{"es":"Priorizar siempre instalación sobre clientes afectados","en":"Always prioritize installation over affected customers"},"correct":false,"feedback":{"es":"El impacto y urgencia guían prioridad.","en":"Impact and urgency guide priority."}},{"text":{"es":"Todo soporte debe configurar descuentos","en":"Every support role must configure discounts"},"correct":false,"feedback":{"es":"Depende del alcance funcional contratado.","en":"It depends on the contracted functional scope."}}],"explanation":{"es":"Un día puede empezar con handover de guardia y batch/cutoffs, seguir con incidentes y solicitudes DEV/QA, y dedicar ventana aprobada a instalación o patch. Scripts y documentación reducen trabajo repetitivo y dependencia. No significa que todos los días hagas todo ni que seas dueño funcional de cada producto. Confirma productos asignados, SLA, horarios, volumen y autoridad operativa.","en":"A day may begin with on-call handover and batch/cutoffs, continue with incidents and DEV/QA requests, then use an approved window for installation or patching. Scripts and documentation reduce repetition and dependency. You will not necessarily do everything daily or own each product functionally. Confirm assigned products, SLA, hours, volume and operating authority."},"flow":{"es":"Handover > Salud / Cutoffs > Prioridad incidentes > Cambios > Documentación","en":"Handover > Health / Cutoffs > Incident priorities > Changes > Documentation"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Ordena cinco tareas de una mañana donde un incidente compite con un deploy planificado.","en":"Prioritize five morning tasks when an incident competes with a planned deployment."},"diagram":"jd"},{"id":"retail-role-02","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué preguntas harías para aclarar cada responsabilidad del JD?","en":"What questions would you ask to clarify JD responsibilities?"},"options":[{"text":{"es":"Pedir alcance, herramientas, permisos, frecuencia y criterio de éxito","en":"Ask for scope, tools, permissions, frequency and success criteria"},"correct":true,"feedback":{"es":"Para install/patch pregunta productos, versiones y dueño. Para debug pide incidentes frecuentes y acceso a logs. Para OS/cloud pide límites RACI. Para scripting pregunta repositorio, reviews y lenguajes. Para documentación pregunta plataforma y revisión. Para on-call pregunta rotación, compensación, escalación y handover. Una respuesta concreta evita estudiar una plataforma equivocada o asumir autoridad que no tendrás.","en":"For installation/patching ask about products, versions and ownership. For debugging ask about frequent incidents and log access. For OS/cloud ask about RACI boundaries. For scripting ask about repositories, reviews and languages. For documentation ask about platform and review. For on-call ask about rotation, compensation, escalation and handover. Concrete answers prevent studying the wrong platform or assuming authority you will not have."}},{"text":{"es":"No preguntar para parecer experto","en":"Avoid questions to appear expert"},"correct":false,"feedback":{"es":"La ambigüedad aumenta riesgo operativo.","en":"Ambiguity increases operating risk."}},{"text":{"es":"Asumir acceso admin a todo","en":"Assume admin access to everything"},"correct":false,"feedback":{"es":"El JD no concede permisos técnicos.","en":"The JD does not grant technical permissions."}}],"explanation":{"es":"Para install/patch pregunta productos, versiones y dueño. Para debug pide incidentes frecuentes y acceso a logs. Para OS/cloud pide límites RACI. Para scripting pregunta repositorio, reviews y lenguajes. Para documentación pregunta plataforma y revisión. Para on-call pregunta rotación, compensación, escalación y handover. Una respuesta concreta evita estudiar una plataforma equivocada o asumir autoridad que no tendrás.","en":"For installation/patching ask about products, versions and ownership. For debugging ask about frequent incidents and log access. For OS/cloud ask about RACI boundaries. For scripting ask about repositories, reviews and languages. For documentation ask about platform and review. For on-call ask about rotation, compensation, escalation and handover. Concrete answers prevent studying the wrong platform or assuming authority you will not have."},"flow":{"es":"Responsabilidad > Alcance > Herramientas / Permisos > Frecuencia > Éxito medible","en":"Responsibility > Scope > Tools / Permissions > Frequency > Measurable success"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Elige tres preguntas que harías al manager antes de tu primer día.","en":"Choose three questions you would ask the manager before your first day."},"diagram":"jd"},{"id":"retail-role-03","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué cambia entre implementación de cliente y soporte post go-live?","en":"What changes between customer implementation and post-go-live support?"},"options":[{"text":{"es":"Preparación/pruebas de readiness frente a operación real y control de cambios","en":"Readiness preparation/testing versus live operations and change control"},"correct":true,"feedback":{"es":"Implementación incluye ambientes, configuración, migración, interfaces, UAT y ensayo de cutover según alcance. Post go-live añade incidentes reales, monitoreo, batch, cambios y reconciliación. Ambos necesitan evidencias y comunicación. Distingue defectos, solicitudes y cambios de alcance para no parchear improvisadamente. Aprende el calendario del cliente: apertura, cierres y picos determinan impacto y ventanas.","en":"Implementation includes environments, configuration, migration, interfaces, UAT and cutover rehearsal under the scope. Post-go-live adds real incidents, monitoring, batch, changes and reconciliation. Both need evidence and communication. Distinguish defects, requests and scope changes to avoid improvised patches. Learn the customer calendar: opening, closing and peaks determine impact and windows."}},{"text":{"es":"Go-live termina toda responsabilidad técnica","en":"Go-live ends every technical responsibility"},"correct":false,"feedback":{"es":"Comienza operación y soporte real.","en":"Live operations and support begin."}},{"text":{"es":"UAT reemplaza monitoreo productivo","en":"UAT replaces production monitoring"},"correct":false,"feedback":{"es":"No reproduce todas las condiciones reales.","en":"It does not reproduce all live conditions."}}],"explanation":{"es":"Implementación incluye ambientes, configuración, migración, interfaces, UAT y ensayo de cutover según alcance. Post go-live añade incidentes reales, monitoreo, batch, cambios y reconciliación. Ambos necesitan evidencias y comunicación. Distingue defectos, solicitudes y cambios de alcance para no parchear improvisadamente. Aprende el calendario del cliente: apertura, cierres y picos determinan impacto y ventanas.","en":"Implementation includes environments, configuration, migration, interfaces, UAT and cutover rehearsal under the scope. Post-go-live adds real incidents, monitoring, batch, changes and reconciliation. Both need evidence and communication. Distinguish defects, requests and scope changes to avoid improvised patches. Learn the customer calendar: opening, closing and peaks determine impact and windows."},"flow":{"es":"Implementación > UAT > Cutover > Hypercare > Operación estable","en":"Implementation > UAT > Cutover > Hypercare > Stable operations"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Explica qué evidencia pedirías antes de aceptar una fecha de go-live.","en":"Explain what evidence you would request before accepting a go-live date."},"diagram":"deployment"},{"id":"retail-role-04","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"advanced","kind":"concept","question":{"es":"¿Qué contendría un checklist go/no-go de Retail?","en":"What would a Retail go/no-go checklist contain?"},"options":[{"text":{"es":"Readiness funcional/técnica, recovery, monitoreo y dueños de decisión","en":"Functional/technical readiness, recovery, monitoring and decision owners"},"correct":true,"feedback":{"es":"Confirma defectos críticos, maestros/migración conciliados, interfaces y batch probados, capacidad, seguridad, backups/recovery y soporte listo. Define umbrales y hora límite para abortar; negocio y tecnología aceptan riesgos explícitos. Un requisito pendiente no se convierte en listo por presión de fecha. Documenta decisión, responsables y plan de hypercare con cobertura y escalación.","en":"Confirm critical defects, reconciled master data/migration, tested interfaces and batch, capacity, security, backups/recovery and support readiness. Define thresholds and an abort deadline; business and technology explicitly accept risks. A pending requirement does not become ready under date pressure. Record the decision, owners and hypercare plan with coverage and escalation."}},{"text":{"es":"Login exitoso basta para go-live","en":"Successful login is enough for go-live"},"correct":false,"feedback":{"es":"Faltan negocio, datos e interfaces.","en":"Business, data and interfaces remain unverified."}},{"text":{"es":"Quitar criterios para cumplir fecha","en":"Remove criteria to meet the date"},"correct":false,"feedback":{"es":"Oculta riesgo en lugar de aceptarlo explícitamente.","en":"This hides risk instead of explicitly accepting it."}}],"explanation":{"es":"Confirma defectos críticos, maestros/migración conciliados, interfaces y batch probados, capacidad, seguridad, backups/recovery y soporte listo. Define umbrales y hora límite para abortar; negocio y tecnología aceptan riesgos explícitos. Un requisito pendiente no se convierte en listo por presión de fecha. Documenta decisión, responsables y plan de hypercare con cobertura y escalación.","en":"Confirm critical defects, reconciled master data/migration, tested interfaces and batch, capacity, security, backups/recovery and support readiness. Define thresholds and an abort deadline; business and technology explicitly accept risks. A pending requirement does not become ready under date pressure. Record the decision, owners and hypercare plan with coverage and escalation."},"flow":{"es":"Checklist > Evidencia > Riesgos > Decisión autorizada > Cutover / Abort","en":"Checklist > Evidence > Risks > Authorized decision > Cutover / Abort"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Prepara tres criterios que impedirían go-live y explica impacto al negocio.","en":"Prepare three criteria blocking go-live and explain their business impact."},"diagram":"deployment"},{"id":"retail-role-05","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo organizarías la primera respuesta de guardia fuera de horario?","en":"How would you organize an after-hours on-call first response?"},"options":[{"text":{"es":"Confirmar impacto, scope y deadline; capturar evidencia y usar runbook/escalación","en":"Confirm impact, scope and deadline; capture evidence and use runbook/escalation"},"correct":true,"feedback":{"es":"Distingue alerta falsa de afectación: usuario/proceso, tiendas, inicio y cambios. Establece ticket/bridge y próximo update; realiza pruebas de lectura acotadas. Si hay mitigación reversible aprobada, evalúa riesgo y ejecuta con permisos. Escala cuando superas límites o necesitas dueños. No prometas resolver solo ni esperes indefinidamente si se aproxima un cutoff comercial.","en":"Distinguish a false alert from impact: user/process, stores, start and changes. Establish a ticket/bridge and next update; perform bounded read-only tests. If approved reversible mitigation exists, assess risk and execute within permissions. Escalate when beyond limits or when owners are needed. Do not promise solo resolution or wait indefinitely near a business cutoff."}},{"text":{"es":"Esperar a horario normal en todo incidente","en":"Always wait until business hours"},"correct":false,"feedback":{"es":"Puede violar cobertura e impacto crítico.","en":"This may breach coverage and critical impact handling."}},{"text":{"es":"Ejecutar cualquier comando admin para ganar tiempo","en":"Run any admin command to save time"},"correct":false,"feedback":{"es":"Puede ampliar daño y violar autoridad.","en":"This can expand harm and violate authority."}}],"explanation":{"es":"Distingue alerta falsa de afectación: usuario/proceso, tiendas, inicio y cambios. Establece ticket/bridge y próximo update; realiza pruebas de lectura acotadas. Si hay mitigación reversible aprobada, evalúa riesgo y ejecuta con permisos. Escala cuando superas límites o necesitas dueños. No prometas resolver solo ni esperes indefinidamente si se aproxima un cutoff comercial.","en":"Distinguish a false alert from impact: user/process, stores, start and changes. Establish a ticket/bridge and next update; perform bounded read-only tests. If approved reversible mitigation exists, assess risk and execute within permissions. Escalate when beyond limits or when owners are needed. Do not promise solo resolution or wait indefinitely near a business cutoff."},"flow":{"es":"Alerta > Impacto > Evidencia > Runbook / Escalación > Mitigación > Update","en":"Alert > Impact > Evidence > Runbook / Escalation > Mitigation > Update"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Simula guardia: precios atrasados 60 minutos antes de apertura. ¿A quién llamas y por qué?","en":"Simulate on-call: prices delayed 60 minutes before opening. Who do you call and why?"},"diagram":"incident"},{"id":"retail-role-06","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué debe incluir un handover entre equipos remotos de Retail?","en":"What should a Retail handover between remote teams include?"},"options":[{"text":{"es":"Impacto, cronología, evidencia, cambios, pendientes, owner y próximo update","en":"Impact, timeline, evidence, changes, pending actions, owner and next update"},"correct":true,"feedback":{"es":"Usa UTC más timezone comercial cuando importe. Separa hechos de hipótesis y enumera pruebas con resultados. Indica mitigaciones aplicadas, riesgo, accesos y lo que no se debe repetir. Define una acción siguiente con responsable y deadline. Confirmación de recepción evita el vacío entre turnos. Un ticket útil permite continuar sin otra llamada extensa ni secretos pegados.","en":"Use UTC plus business time zone where relevant. Separate facts from hypotheses and list tests with results. Record mitigations, risk, access and actions that must not be repeated. Define a next action with an owner and deadline. Receipt acknowledgment avoids gaps between shifts. A useful ticket enables continuation without another long call or pasted secrets."}},{"text":{"es":"Solo escribir sigue fallando","en":"Only write still failing"},"correct":false,"feedback":{"es":"No aporta contexto ni siguiente acción.","en":"This gives no context or next action."}},{"text":{"es":"Compartir passwords en el ticket","en":"Share passwords in the ticket"},"correct":false,"feedback":{"es":"Usa un mecanismo seguro de acceso.","en":"Use a secure access mechanism."}}],"explanation":{"es":"Usa UTC más timezone comercial cuando importe. Separa hechos de hipótesis y enumera pruebas con resultados. Indica mitigaciones aplicadas, riesgo, accesos y lo que no se debe repetir. Define una acción siguiente con responsable y deadline. Confirmación de recepción evita el vacío entre turnos. Un ticket útil permite continuar sin otra llamada extensa ni secretos pegados.","en":"Use UTC plus business time zone where relevant. Separate facts from hypotheses and list tests with results. Record mitigations, risk, access and actions that must not be repeated. Define a next action with an owner and deadline. Receipt acknowledgment avoids gaps between shifts. A useful ticket enables continuation without another long call or pasted secrets."},"flow":{"es":"Turno saliente > Hechos / Evidencia > Próxima acción > Dueño acepta > Seguimiento","en":"Outgoing shift > Facts / Evidence > Next action > Owner accepts > Follow-up"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Escribe un handover de ocho líneas en inglés para backlog de precios.","en":"Write an eight-line English handover for a price backlog."}},{"id":"retail-role-07","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué diferencia hay entre incident, problem y change en este puesto?","en":"What differs between incident, problem and change in this role?"},"options":[{"text":{"es":"Restaurar servicio, investigar causa y controlar una modificación","en":"Restore service, investigate cause and control a modification"},"correct":true,"feedback":{"es":"Un incidente atiende interrupción/degradación; problem management investiga causa y recurrencia; change controla una modificación con riesgo y aprobación. No es necesario terminar RCA para mitigar, pero se conserva evidencia y seguimiento. Un emergency change sigue teniendo controles y revisión posterior según proceso. Relaciona tickets y evita convertir cada error de dato en despliegue urgente sin diagnóstico.","en":"An incident handles interruption/degradation; problem management investigates cause and recurrence; change controls a modification with risk and approval. Mitigation need not wait for complete RCA, but evidence and follow-up remain. An emergency change still has controls and post-review under the process. Link tickets and avoid turning every data error into an urgent deployment without diagnosis."}},{"text":{"es":"Emergency elimina aprobación y registro","en":"Emergency removes approval and records"},"correct":false,"feedback":{"es":"Controles se adaptan, no desaparecen.","en":"Controls adapt rather than disappear."}},{"text":{"es":"Todo reinicio es RCA terminado","en":"Every restart completes RCA"},"correct":false,"feedback":{"es":"Es acción, no explicación del mecanismo.","en":"It is an action, not an explanation of the mechanism."}}],"explanation":{"es":"Un incidente atiende interrupción/degradación; problem management investiga causa y recurrencia; change controla una modificación con riesgo y aprobación. No es necesario terminar RCA para mitigar, pero se conserva evidencia y seguimiento. Un emergency change sigue teniendo controles y revisión posterior según proceso. Relaciona tickets y evita convertir cada error de dato en despliegue urgente sin diagnóstico.","en":"An incident handles interruption/degradation; problem management investigates cause and recurrence; change controls a modification with risk and approval. Mitigation need not wait for complete RCA, but evidence and follow-up remain. An emergency change still has controls and post-review under the process. Link tickets and avoid turning every data error into an urgent deployment without diagnosis."},"flow":{"es":"Incidente > Restauración > Problem / RCA > Change aprobado > Prevención","en":"Incident > Restoration > Problem / RCA > Approved change > Prevention"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Clasifica workaround temporal, RCA de fuga y aplicación del fix definitivo.","en":"Classify a temporary workaround, leak RCA and permanent fix deployment."}},{"id":"retail-role-08","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Cómo ayudarías a DEV y QA a reproducir performance sin datos de clientes?","en":"How would you help DEV and QA reproduce performance without customer data?"},"options":[{"text":{"es":"Recrear forma/volumen/carga con datos sintéticos o sanitizados y medición","en":"Recreate shape/volume/load using synthetic or sanitized data and measurement"},"correct":true,"feedback":{"es":"Una reproducción útil conserva distribución, dependencias, versión y concurrencia relevantes, no necesariamente PII. Define baseline, pasos, expected/actual, timestamps e instrumentación. Si QA tiene menor capacidad, declara límites de comparación. Aísla una hipótesis y comparte trazas/stacks sanitizados. No copies PROD sin autorización ni entregues un reporte que solo diga está lento.","en":"A useful reproduction preserves relevant distribution, dependencies, version and concurrency, not necessarily PII. Define baseline, steps, expected/actual, timestamps and instrumentation. If QA has lower capacity, state comparison limits. Isolate a hypothesis and share sanitized traces/stacks. Do not copy production without authorization or deliver a report merely saying it is slow."}},{"text":{"es":"Copiar toda BD productiva por conveniencia","en":"Copy the full production DB for convenience"},"correct":false,"feedback":{"es":"Expone datos y puede violar política.","en":"This exposes data and may violate policy."}},{"text":{"es":"Comparar QA sin carga con PROD en pico como equivalentes","en":"Treat unloaded QA as equivalent to peak production"},"correct":false,"feedback":{"es":"Las condiciones no son comparables.","en":"Conditions are not comparable."}}],"explanation":{"es":"Una reproducción útil conserva distribución, dependencias, versión y concurrencia relevantes, no necesariamente PII. Define baseline, pasos, expected/actual, timestamps e instrumentación. Si QA tiene menor capacidad, declara límites de comparación. Aísla una hipótesis y comparte trazas/stacks sanitizados. No copies PROD sin autorización ni entregues un reporte que solo diga está lento.","en":"A useful reproduction preserves relevant distribution, dependencies, version and concurrency, not necessarily PII. Define baseline, steps, expected/actual, timestamps and instrumentation. If QA has lower capacity, state comparison limits. Isolate a hypothesis and share sanitized traces/stacks. Do not copy production without authorization or deliver a report merely saying it is slow."},"flow":{"es":"Síntoma > Datos seguros > Carga representativa > Métricas > Reproducción > Fix probado","en":"Symptom > Safe data > Representative load > Metrics > Reproduction > Tested fix"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Prepara un bug report con seis campos para búsqueda lenta de artículos.","en":"Prepare a six-field bug report for slow item search."}},{"id":"retail-role-09","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"concept","question":{"es":"¿Qué debería tener una página de servicio o runbook de Retail?","en":"What should a Retail service page or runbook contain?"},"options":[{"text":{"es":"Propósito, topología, dueños, checks, recovery y verificación con revisión","en":"Purpose, topology, owners, checks, recovery and verification with review"},"correct":true,"feedback":{"es":"Incluye alcance, versión, dependencias, alertas, pruebas seguras, criterios de escalación y acciones permitidas con precondiciones/rollback. Separa comandos de lectura de cambios peligrosos. Añade resultado esperado y condición de parada; registra fecha y owner de revisión. Publicar HTML/wiki no es suficiente si el contenido está desactualizado. Nunca guardes secretos ni instrucciones sin contexto de ambiente.","en":"Include scope, version, dependencies, alerts, safe tests, escalation criteria and permitted actions with preconditions/rollback. Separate read-only commands from dangerous changes. Add expected outcomes and stop conditions; record review date and owner. Publishing HTML/wiki is insufficient when content is stale. Never store secrets or instructions without environment context."}},{"text":{"es":"Una lista de comandos sin resultados basta","en":"A command list without results is enough"},"correct":false,"feedback":{"es":"No guía interpretación ni riesgo.","en":"It does not guide interpretation or risk."}},{"text":{"es":"Documentar solo después de que el experto salga","en":"Document only after the expert leaves"},"correct":false,"feedback":{"es":"Pierdes conocimiento y aumentas dependencia.","en":"Knowledge is lost and dependency increases."}}],"explanation":{"es":"Incluye alcance, versión, dependencias, alertas, pruebas seguras, criterios de escalación y acciones permitidas con precondiciones/rollback. Separa comandos de lectura de cambios peligrosos. Añade resultado esperado y condición de parada; registra fecha y owner de revisión. Publicar HTML/wiki no es suficiente si el contenido está desactualizado. Nunca guardes secretos ni instrucciones sin contexto de ambiente.","en":"Include scope, version, dependencies, alerts, safe tests, escalation criteria and permitted actions with preconditions/rollback. Separate read-only commands from dangerous changes. Add expected outcomes and stop conditions; record review date and owner. Publishing HTML/wiki is insufficient when content is stale. Never store secrets or instructions without environment context."},"flow":{"es":"Servicio > Procedimiento > Precondiciones > Acción > Resultado > Revisión","en":"Service > Procedure > Preconditions > Action > Outcome > Review"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Escribe una sección de runbook para revisar TLS sin modificar confianza.","en":"Write a runbook section for checking TLS without changing trust."}},{"id":"retail-role-10","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"behavioral","question":{"es":"¿Cómo responderías al cliente si un error de tu equipo escaló un incidente Retail?","en":"How would you respond to a customer when a team mistake escalated a Retail incident?"},"options":[{"text":{"es":"Asumir responsabilidad de respuesta, comunicar hechos y coordinar recuperación sin culpar","en":"Own the response, communicate facts and coordinate recovery without blame"},"correct":true,"feedback":{"es":"Diría: tenemos impacto confirmado en este proceso; estoy coordinando recuperación y validación. Esto sabemos, esto falta comprobar y actualizaremos a esta hora. No inventaría causa ni expondría al compañero. Preservaría cambios/evidencia y ejecutaría mitigación aprobada. Después documentaría RCA y mejora de controles. Ejemplo hipotético: endpoint incorrecto en deploy; comprobar diferencia y compatibilidad antes de revertir.","en":"I would say: we have confirmed impact on this process; I am coordinating recovery and validation. Here is what we know, what remains unconfirmed, and when we will update you. I would not invent a cause or expose the teammate. I would preserve changes/evidence and execute approved mitigation. Then document RCA and control improvements. Hypothetical example: wrong deployment endpoint; verify the difference and compatibility before reverting."}},{"text":{"es":"Nombrar al compañero culpable en la llamada","en":"Name the guilty teammate on the call"},"correct":false,"feedback":{"es":"No ayuda a restaurar y daña colaboración.","en":"This does not restore service and harms collaboration."}},{"text":{"es":"Garantizar ETA sin evidencia","en":"Guarantee an ETA without evidence"},"correct":false,"feedback":{"es":"Crea una expectativa no sustentada.","en":"This creates an unsupported expectation."}}],"explanation":{"es":"Diría: tenemos impacto confirmado en este proceso; estoy coordinando recuperación y validación. Esto sabemos, esto falta comprobar y actualizaremos a esta hora. No inventaría causa ni expondría al compañero. Preservaría cambios/evidencia y ejecutaría mitigación aprobada. Después documentaría RCA y mejora de controles. Ejemplo hipotético: endpoint incorrecto en deploy; comprobar diferencia y compatibilidad antes de revertir.","en":"I would say: we have confirmed impact on this process; I am coordinating recovery and validation. Here is what we know, what remains unconfirmed, and when we will update you. I would not invent a cause or expose the teammate. I would preserve changes/evidence and execute approved mitigation. Then document RCA and control improvements. Hypothetical example: wrong deployment endpoint; verify the difference and compatibility before reverting."},"flow":{"es":"Impacto reconocido > Hechos > Recuperación > Update > RCA sin culpa > Prevención","en":"Acknowledged impact > Facts > Recovery > Update > Blameless RCA > Prevention"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Practica en inglés una respuesta de 45 segundos con próximo update concreto.","en":"Practice a 45-second English answer with a concrete next update."},"check":{"es":"Adaptar a una experiencia vivida; el incidente de endpoint es solo ejemplo.","en":"Adapt to a lived experience; the endpoint incident is only an example."}},{"id":"retail-role-11","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"intermediate","kind":"behavioral","question":{"es":"¿Qué historia de liderazgo encaja con soporte Retail y equipos distribuidos?","en":"What leadership story fits Retail support and distributed teams?"},"options":[{"text":{"es":"Mentoring y coordinación con decisiones, evidencia y autonomía del equipo","en":"Mentoring and coordination with decisions, evidence and team independence"},"correct":true,"feedback":{"es":"Tu CV permite hablar de technical lead DB2, onboarding/mentoring y coordinación de integración con más de diez equipos en Oracle. Construye STAR con un caso real: contexto, objetivo, tu decisión, colaboración y resultado comprobable. Explica qué documentación o entrenamiento redujo dependencia si realmente ocurrió. No atribuyas ventas Retail o ahorro numérico sin datos. Liderazgo también es definir owner y enseñar diagnóstico reproducible.","en":"Your CV supports DB2 technical leadership, onboarding/mentoring and integration coordination across more than ten Oracle teams. Build STAR from a real case: context, objective, your decision, collaboration and a verifiable result. Explain documentation or training that reduced dependency if it actually occurred. Do not claim Retail sales impact or numerical savings without data. Leadership also means assigning owners and teaching repeatable diagnosis."}},{"text":{"es":"Usar una historia hipotética como hecho vivido","en":"Use a hypothetical story as lived fact"},"correct":false,"feedback":{"es":"No es evidencia honesta de experiencia.","en":"This is not honest evidence of experience."}},{"text":{"es":"Hablar solo de ayudé sin decisión ni resultado","en":"Only say I helped without a decision or outcome"},"correct":false,"feedback":{"es":"No muestra tu contribución concreta.","en":"This does not show your concrete contribution."}}],"explanation":{"es":"Tu CV permite hablar de technical lead DB2, onboarding/mentoring y coordinación de integración con más de diez equipos en Oracle. Construye STAR con un caso real: contexto, objetivo, tu decisión, colaboración y resultado comprobable. Explica qué documentación o entrenamiento redujo dependencia si realmente ocurrió. No atribuyas ventas Retail o ahorro numérico sin datos. Liderazgo también es definir owner y enseñar diagnóstico reproducible.","en":"Your CV supports DB2 technical leadership, onboarding/mentoring and integration coordination across more than ten Oracle teams. Build STAR from a real case: context, objective, your decision, collaboration and a verifiable result. Explain documentation or training that reduced dependency if it actually occurred. Do not claim Retail sales impact or numerical savings without data. Leadership also means assigning owners and teaching repeatable diagnosis."},"flow":{"es":"Caso real > Decisión propia > Coordinación > Aprendizaje compartido > Resultado verificable","en":"Real case > Your decision > Coordination > Shared learning > Verifiable result"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Redacta STAR y marca qué parte puedes demostrar con ejemplos.","en":"Write STAR and mark which parts you can support with examples."}},{"id":"retail-role-12","section":"retail-role","sectionLabel":{"es":"Retail · Trabajo, JD y preparación","en":"Retail · Work, JD and preparation"},"level":"basic","kind":"concept","question":{"es":"¿Qué ruta de aprendizaje seguirías tus primeras cuatro semanas en Retail?","en":"What learning path would you follow in your first four Retail weeks?"},"options":[{"text":{"es":"Mapa y acceso, flujo supervisado, diagnóstico en QA y operación revisada","en":"Map/access, supervised flow, QA diagnosis and reviewed operations"},"correct":true,"feedback":{"es":"Semana 1: productos/versiones, RACI, negocio, topología y lectura de runbooks. Semana 2: seguir item/price/sale/documentos con mentor y datos QA. Semana 3: reproducir fallas seguras, logs, SQL y herramientas disponibles. Semana 4: ejecutar tarea autorizada con revisión, documentar y practicar handover/guardia. No es promesa de dominar todos los productos; mide capacidad de explicar y verificar un recorrido asignado.","en":"Week 1: products/versions, RACI, business, topology and runbooks. Week 2: follow item/price/sale/documents with a mentor and QA data. Week 3: reproduce safe failures and practice available logs, SQL and tools. Week 4: complete an authorized reviewed task, document it and practice handover/on-call. This is not a promise to master every product; measure the ability to explain and verify an assigned journey."}},{"text":{"es":"Memorizar comandos admin y actuar sin mentor","en":"Memorize admin commands and act without a mentor"},"correct":false,"feedback":{"es":"No valida contexto ni autorización.","en":"This does not validate context or authorization."}},{"text":{"es":"Dominar todos los módulos en un día","en":"Master every module in one day"},"correct":false,"feedback":{"es":"No es un objetivo realista ni verificable.","en":"This is not realistic or verifiable."}}],"explanation":{"es":"Semana 1: productos/versiones, RACI, negocio, topología y lectura de runbooks. Semana 2: seguir item/price/sale/documentos con mentor y datos QA. Semana 3: reproducir fallas seguras, logs, SQL y herramientas disponibles. Semana 4: ejecutar tarea autorizada con revisión, documentar y practicar handover/guardia. No es promesa de dominar todos los productos; mide capacidad de explicar y verificar un recorrido asignado.","en":"Week 1: products/versions, RACI, business, topology and runbooks. Week 2: follow item/price/sale/documents with a mentor and QA data. Week 3: reproduce safe failures and practice available logs, SQL and tools. Week 4: complete an authorized reviewed task, document it and practice handover/on-call. This is not a promise to master every product; measure the ability to explain and verify an assigned journey."},"flow":{"es":"Semana 1 mapa > Semana 2 recorrido > Semana 3 diagnóstico > Semana 4 tarea revisada","en":"Week 1 map > Week 2 journey > Week 3 diagnosis > Week 4 reviewed task"},"code":"","output":null,"source":"","retail":true,"followup":{"es":"Define un entregable verificable por semana según tu producto asignado.","en":"Define a verifiable weekly deliverable for your assigned product."},"diagram":"jd"}];

function hi(text){const value=String(text);let result='',last=0;termRegex.lastIndex=0;for(const m of value.matchAll(termRegex)){const before=value[m.index-1]||'',after=value[m.index+m[0].length]||'';if(/[\p{L}\p{N}_]/u.test(before)||/[\p{L}\p{N}_]/u.test(after))continue;result+=esc(value.slice(last,m.index))+'<mark class="keyword">'+esc(m[0])+'</mark>';last=m.index+m[0].length;}return result+esc(value.slice(last));}

function validateState(s){if(!s||s.version!==VERSION||!['es','en'].includes(s.lang)||!['quiz','study','oral'].includes(s.mode))return false;if(!Array.isArray(s.session)||s.session.some(id=>!CARD_MAP.has(id))||new Set(s.session).size!==s.session.length)return false;if(!Array.isArray(s.bankOrder)||s.bankOrder.length!==CARDS.length||new Set(s.bankOrder).size!==CARDS.length||s.bankOrder.some(id=>!CARD_MAP.has(id)))return false;if(!Number.isInteger(s.index)||s.index<0||s.index>Math.max(0,s.session.length-1))return false;for(const field of ['records','notes','drafts','selfChecks','round','roundCorrect'])if(!s[field]||typeof s[field]!=='object'||Array.isArray(s[field]))return false;if(!Object.entries(s.records).every(([id,r])=>CARD_MAP.has(id)&&validRecord(r)&&r.selected.every(i=>i>=0&&i<CARD_MAP.get(id).options.length)))return false;if(!Array.isArray(s.bookmarks)||s.bookmarks.some(id=>!CARD_MAP.has(id)))return false;if(![s.notes,s.drafts].every(obj=>Object.entries(obj).every(([id,v])=>CARD_MAP.has(id)&&typeof v==='string')))return false;if(!Object.entries(s.selfChecks).every(([id,v])=>CARD_MAP.has(id)&&Array.isArray(v)&&v.every(i=>Number.isInteger(i)&&i>=0&&i<4)))return false;if(![s.round,s.roundCorrect].every(obj=>Object.entries(obj).every(([id,v])=>CARD_MAP.has(id)&&typeof v==='boolean')))return false;if(!['all','basic','intermediate','advanced'].includes(s.level)||!['any','wrong','marked','new'].includes(s.review)||!['all','base','scenario','command','profile','retail'].includes(s.path))return false;if(s.section!=='all'&&!CARDS.some(c=>c.section===s.section))return false;if(!['all',...SESSION_SIZES].includes(String(s.size))||typeof s.query!=='string'||typeof s.finished!=='boolean')return false;return true;}
function migrateState(s){if(!s||s.version!==VERSION||!Array.isArray(s.bankOrder)||!s.bankOrder.length||s.bankOrder.some(id=>!CARD_MAP.has(id))||new Set(s.bankOrder).size!==s.bankOrder.length)return null;const known=new Set(s.bankOrder);const expanded={...s,bankOrder:[...s.bankOrder,...CARDS.filter(c=>!known.has(c.id)).map(c=>c.id)]};return validateState(expanded)?expanded:null;}

function normalize(value){return value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function matches(c){if(state.section!=='all'&&c.section!==state.section)return false;if(state.level!=='all'&&c.level!==state.level)return false;if(state.path==='retail'&&!c.retail)return false;if(state.path==='base'&&c.level!=='basic')return false;if(state.path==='scenario'&&c.kind!=='scenario')return false;if(state.path==='command'&&!c.code&&!['command','query'].includes(c.kind))return false;if(state.path==='profile'&&!['scripts','interview'].includes(c.section)&&c.kind!=='behavioral')return false;const r=state.records[c.id];if(state.review==='wrong'&&(!r||r.correct))return false;if(state.review==='marked'&&!state.bookmarks.includes(c.id))return false;if(state.review==='new'&&r)return false;if(state.query){const hay=normalize([c.question.es,c.question.en,c.explanation.es,c.explanation.en,c.code,c.sectionLabel.es,c.sectionLabel.en].join(' '));if(!hay.includes(normalize(state.query)))return false;}return true;}

function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function hash(value){let h=2166136261;for(const c of value){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function options(c){const indices=c.options.map((_,i)=>i);let seed=hash(c.id);for(let i=indices.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[indices[i],indices[j]]=[indices[j],indices[i]];}return indices;}
